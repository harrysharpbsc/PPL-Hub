,why:"The word is DEPARTURE until you are cleared. TAKE-OFF is used only for the clearance itself."},{atc:"G-CD, after departure, left turn approved, climb not above altitude 2500 feet until reaching the zone boundary",q:"Reply.",opts:["Left turn approved, not above altitude 2500 feet until zone boundary, G-CD","Left turn, 2500 feet, G-CD","Cleared for take-off, G-CD","Roger, wilco"],a:0,why:"Read back the departure clearance in full. It is not a take-off clearance."},{atc:"G-CD, runway 24, cleared for take-off, surface wind 220 4",q:"Reply.",opts:["Runway 24 cleared for take-off, G-CD","Cleared for take-off, G-CD","Roger, rolling","Wilco, G-CD"],a:0,why:"A take-off clearance is read back with the runway and your callsign."},{atc:"G-CD, contact Borton Approach 118.750",q:"Reply.",opts:["Borton Approach 118.750, G-CD","Wilco","Roger, G-CD","Changing, G-CD"],a:0,why:"Frequency changes are read back with the frequency and your callsign."},{ctx:"You are airborne, left turn complete, heading 330 climbing to 2500 feet. You are now on Borton Approach.",q:"Make your first call.",opts:["Borton Approach, G-ABCD, airborne runway 24, turning left heading 330 degrees, climbing to altitude 2500 feet, QNH 990 hectopascals, en route Walden","Borton Approach, G-ABCD, airborne","Borton Tower, G-ABCD, airborne","Borton Approach, request climb to altitude 3500 feet"],a:0,why:"An airborne report includes the runway, heading, climb and altitude, pressure setting and where you are going."}]},{id:"B",title:"En route and arrival at Walden",desc:"A Basic Service call, a pass-your-message, weather and joining an aerodrome with a flight information service.",steps:[{ctx:"You are cruising VFR at 2500 feet, QNH 1008, tracking to Walden. You want a Basic Service from Wrayton Information.",q:"Make your first call.",opts:["Wrayton Information, G-ABCD, request Basic Service","Wrayton Radar, G-ABCD, request Basic Service","Wrayton Information, G-ABCD, request clearance through your airspace","G-ABCD, Cessna 172, 15 miles south of Westbury, 2500 feet, request Basic Service, over"],a:0,why:"The first call is short: unit, callsign and the service you want. They will say pass your message."},{atc:"G-ABCD, Wrayton Information, pass your message",q:"Pass your message.",opts:["G-ABCD, Cessna 172, from Borton to Walden, 15 NM south of Westbury, altitude 2500 feet, QNH 1008, request Walden weather","G-ABCD, I am somewhere near Westbury going to Walden, over","G-ABCD, Cessna 172, request Basic Service, request Walden weather, over","Wrayton, 2500 feet, Walden"],a:0,why:"Callsign, type, route, position, altitude, pressure setting, then your request."},{atc:"G-ABCD, Roger Basic Service, standby for weather",q:"Reply.",opts:["Basic Service, G-ABCD","Standing by, G-ABCD","Roger","Wilco, weather please"],a:0,why:"The type of service is on the mandatory readback list. STANDBY is neither an approval nor a denial."},{atc:"G-ABCD, Walden weather available, are you ready to copy?",q:"Reply.",opts:["Affirm, G-ABCD","Yes, go ahead","Positive, G-ABCD","Roger"],a:0,why:"The standard word for yes is AFFIRM."},{atc:"G-ABCD, Walden 0950 weather, runway 27, surface wind calm, visibility 10 kilometres, nil weather, few at 4000 feet, QNH 1008, temperature +4, dew point +1",q:"Acknowledge.",opts:["QNH 1008, G-ABCD","Roger, G-ABCD","Weather copied, over","QNH 1008"],a:0,why:"Read back the altimeter setting with your callsign. A bare number with no callsign is not a proper readback."},{ctx:"You are 10 miles from Walden. Walden has a flight information service, callsign Walden Information. You are descending to 1000 feet.",q:"Make your first call.",opts:["Walden Information, G-ABCD, request join","Walden Tower, G-ABCD, request landing clearance","Walden Radio, G-ABCD, joining overhead","Walden Information, G-ABCD, cleared to join"],a:0,why:"Use the right suffix, INFORMATION, keep it short, and do not say CLEARED: you are not being given clearances here."},{atc:"G-ABCD, Walden Information, pass your message",q:"Pass your message.",opts:["G-ABCD, Cessna 172, 6 miles southeast, descending to height 1000 feet","G-ABCD, 6 miles south, will join when I am ready","Walden Information, G-ABCD","G-ABCD, Cessna 172, over the town at 5000 feet"],a:0,why:"Give type, position and height so the FISO can pass joining information."},{atc:"G-ABCD, runway 27, QFE 986 hectopascals, 1 aircraft in circuit, a PA 28 late downwind",q:"Reply.",opts:["Runway 27, QFE 986 hectopascals, joining via left base, G-ABCD","Cleared to join via left base, G-ABCD","Roger, G-ABCD","Runway 27 cleared to land, G-ABCD"],a:0,why:"Read back the runway and pressure setting and state your joining intention. A FISO gives information, not clearances."},{ctx:"You are established on left base.",q:"Report.",opts:["G-ABCD, left base","G-ABCD, left base, request landing clearance","Walden, I am turning in","G-ABCD, final"],a:0,why:"Make the circuit report that matches where you are."},{ctx:"You have turned onto a short final.",q:"Report.",opts:["G-ABCD, final","G-ABCD, final, request landing clearance","G-ABCD, final, cleared to land","G-ABCD, short final, over"],a:0,why:"Simply report final. Landing information will follow."},{atc:"G-ABCD, runway occupied with a PA 28",q:"Reply.",opts:["Roger, G-ABCD","Cleared to land, G-ABCD","Landing now, G-ABCD","Negative, G-ABCD"],a:0,why:"Roger tells them you have received the information. Do not say cleared. You are responsible for your own approach decisions."},{atc:"G-ABCD, runway now vacated, surface wind 270 10, land at your discretion",q:"Reply.",opts:["Roger, landing, G-ABCD","Cleared to land, G-ABCD","Wilco, cleared to land","Roger"],a:0,why:"A FISO cannot clear you to land. State your intention clearly."},{ctx:"You have landed and cleared the runway.",q:"Tell Walden Information.",opts:["G-ABCD, runway vacated","G-ABCD, clear of the runway, thanks, out","Walden Information, G-ABCD, shutting down","G-ABCD, taxiing, over"],a:0,why:"Report runway vacated."}]}]};t.push.apply(t,[{s:1,topic:"Piston engine icing (SS14)",order:20,conf:"weak",status:"draft",summary:"Engines can ice up in three ways: carburettor ice (fuel evaporating chills the carb by up to 35°C), impact ice on the intake or filter, and ice or water in the fuel system. Carb ice can form on a warm humid day, not just a cold one. Use carb heat for at least 15 seconds, apply it before reducing power, and always follow the AFM. Built from CAA Safety Sense Leaflet 14, not yet from your own notes.",sections:[["Three types of engine icing",["<b>Carburettor ice</b>: fuel evaporating in the venturi cools the carb by up to <code>35°C</code> below the outside air. Water vapour freezes and chokes the venturi and throttle. Fuel-injected engines do not get it","<b>Impact (intake) ice</b>: ice builds on or in the air intake or blocks the filter. Needs visible moisture below <code>0°C</code>, and affects carburettor and injected engines alike","<b>Fuel system ice</b>: water in tanks or lines freezes, often at bends or filters. Water can stop an engine even if it never freezes","Car fuel (MOGAS) may be more prone to water problems than AVGAS"]],["When it happens",["Carb icing is possible on warm days, not only in the cold. Worst band is roughly <code>0°C to 10°C</code> with high humidity","Tests showed serious ice at descent power with air above <code>25°C</code> and humidity as low as <code>30%</code>","Clues for high humidity: temperature and dew point close together, wet ground, rain, fog or low cloud","Descent power carries the greatest risk of serious carb ice"]],["Recognising it",["First sign is usually a loss of power or performance","Fixed-pitch prop: a small RPM drop with falling airspeed or height. Opening the throttle slightly can hide it","Constant-speed prop: manifold pressure drops first while RPM stays steady","With an autopilot holding height, airspeed can quietly decay, so watch it","An EGT gauge often shows a drop before power is lost","Fuel icing: power loss in cold, clear air where carb ice is not the cause"]],["Using carb heat and alternate air",["Carb heat sends air through an exhaust heat exchanger and bypasses the filter. A small power drop when selected is normal","Alternate air (injected engines) bypasses a blocked intake or filter. Apply it fully on, and keep it on until clear of icing and the ice has melted","Select heat for at least <code>15 seconds</code>. Rough running at first is normal as ice melts: keep heat on","If the engine fails and carb ice is suspected, keep heat hot as residual exhaust warmth may allow a restart","Always follow the AFM. Do not use continuous carb heat at high power unless the AFM allows it"]],["Procedures by phase of flight",["<b>Start and taxi</b>: start with heat cold. Avoid heat when taxiing because the air is unfiltered","<b>Power checks</b>: heat fully on for 15 seconds. A typical drop is <code>75 to 100 RPM</code> or <code>3 to 5 inches</code> of MP. If power rises above the earlier value when heat goes off, ice was present: repeat until clear","<b>Take-off</b>: normally heat cold. If a long time passed since the checks, apply about 15 seconds just before","<b>Cruise</b>: monitor RPM or MP and apply heat periodically in conducive conditions","<b>Descent</b>: apply heat before reducing power and add power regularly to keep the engine warm","<b>Landing</b>: heat on downwind, and many types go cold at around <code>300 ft</code> ready for a go-around","<b>Go-around</b>: check carb heat is cold before and after applying power"]],["Prevention on the ground",["Keep tanks full to reduce condensation, including in a hangar","Check fuel for water and check filler cap seals for deterioration","Take extra care with MOGAS and barrel fuel","Periodically check the carb heat or alternate air controls and seals"]]],cards:[["What cools the carburettor enough to cause ice?","Fuel evaporating in the venturi, up to 35°C below the outside air."],["Which engines cannot get carb ice?","Fuel-injected engines. They can still get intake (impact) ice."],["Temperature band with the highest carb ice risk in humid air?","About 0°C to 10°C, but it can happen on warm days too."],["First sign of carb ice in a fixed-pitch propeller aircraft?","A small RPM drop with falling airspeed or height."],["First sign of carb ice with a constant-speed propeller?","Manifold pressure falls while RPM stays the same."],["How long should carb heat be selected to clear ice?","At least 15 seconds."],["Normal power-check drop with carb heat on?","About 75 to 100 RPM or 3 to 5 inches of MP."],["When should carb heat be applied during a descent?","Before reducing power, then keep adding power regularly."],["Why avoid carb heat while taxiing?","Heated air bypasses the filter, so it can draw in dust and debris."],["What is impact icing?","Ice on the intake or filter from visible moisture below 0°C."]],quiz:[["On a warm humid day you are descending at low power. Which statement is correct?",["Carb ice is impossible above 15°C","Carb ice can still form and descent power is the highest-risk setting","Carb ice only forms in cloud","Only fuel-injected engines are at risk"],1,"Serious carb ice has been shown with air above 25°C and humidity as low as 30%, especially at descent power."],["Your fixed-pitch propeller RPM drops slightly and airspeed falls. What do you do first?",["Open the throttle and ignore it","Apply carb heat and accept some rough running while it clears","Lean the mixture fully","Switch off the fuel pump"],1,"Select heat and keep it on. The engine may run rough as ice melts."],["At the power check, carb heat on gives a typical drop of:",["10 to 20 RPM","75 to 100 RPM","300 to 400 RPM","No change"],1,"A drop of about 75 to 100 RPM, or 3 to 5 inches of MP, is expected. A rise afterwards suggests ice was cleared."],["Why should you apply carb heat before closing the throttle in the descent?",["It lowers drag","Ice is much more likely at reduced power","It cools the engine","It improves visibility"],1,"Induction ice is far more likely at low power, so heat goes on before power comes off."],["Which engine type can suffer intake icing but not carb icing?",["Carburettor","Fuel-injected","Both","Neither"],1,"Fuel-injected engines have no carburettor but can ice at the intake or filter, so check alternate air."],["At about 300 ft on final many aircraft call for carb heat to be:",["Selected hot","Selected cold ready for a go-around","Left unchanged","Removed from the checklist"],1,"Cold heat gives full power if you go around, but follow the AFM."]],src:[["Safety Sense Leaflet 14: Piston Engine Icing","https://www.caa.co.uk/media/j5omfigm/ssl-14_piston-engine-icing.pdf"]]},{s:4,topic:"Winter weather and icing (SS03)",order:20,conf:"weak",status:"draft",summary:"Winter flying is a Threat and Error Management problem. Fog is visibility below 1,000 m, mist 1,000 to 5,000 m, and clear cold nights breed radiation fog when temperature and dew point close. Cold fronts bring showers and sudden visibility drops, warm fronts lower cloud and visibility. Even light frost can cut lift by up to 30%. Airframe ice mostly forms between 0°C and -10°C. Built from CAA Safety Sense Leaflet 3.",sections:[["Fog, mist and reporting",["<b>Fog</b>: visibility below <code>1,000 m</code>. <b>Mist</b>: <code>1,000 to 5,000 m</code>","METAR codes: <code>FG</code> fog, <code>BR</code> mist, <code>SN</code> snow, <code>GR</code> hail, <code>GS</code> snow pellets, <code>MI</code> shallow, <code>BC</code> patches","Runway state is reported in the <b>Global Reporting Format</b> (GRF) through SNOWTAM or ATIS, not the METAR. It is rated <code>0 to 6</code>, where 6 is a normal dry runway and 0 is minimal braking action","A SNOWTAM is a special NOTAM about snow, ice, slush or standing water","The Met Office is the UK regulated aviation weather provider. Use regulated products as a minimum, plus the F215 low-level chart"]],["Radiation fog and high pressure",["Most inland winter fog is <b>radiation fog</b>, forming after sunset under clear skies, cold temperatures and light winds","The key warning is temperature and dew point <b>converging</b>","It clears slowly, often most of the morning, and unevenly across short distances","Anticyclones give stability and inversions, so fog and low stratus can persist","After several days haze and smog build and the low sun badly reduces visibility"]],["Fronts and depressions",["<b>Cold front</b>: showers, winter thunderstorms, sudden visibility drops, rapid change in temperature and wind. Often good flying in the clear air behind","<b>Warm front</b>: stratus and rain, with cloud base and visibility falling as the leading edge passes","<b>Depression</b>: warm front first (falling pressure, lowering cloud), then cold front (showers, gusts)","<b>Occlusions</b> move slowly and bring low cloud and precipitation"]],["Frost, snow and de-icing",["All frost, ice and snow must be removed before flight. Even light frost can reduce lift by up to <code>30%</code> and raise drag by up to <code>40%</code>","Brush off light frost without scratching, and do not use car scrapers on windows","Use <b>Type I</b> fluid (such as Kilfrost). Types II and IV are for larger aircraft and will not flow off properly at light aircraft speeds","Type I has little or no hold-over time","Hot water works but dry the aircraft and check hinges and gaps","Check pitot and static covers off, drains clear and pitot heat working"]],["Surface performance factors",["Take-off factors from SS09: dry grass <code>x1.2</code>, wet grass <code>x1.3</code>, soft ground or snow <code>x1.25</code> minimum, then the general <code>x1.33</code>","Landing: dry grass <code>x1.15</code>, wet grass <code>x1.35</code>, soft ground or snow <code>x1.25</code>, then the general <code>x1.43</code>","Multiply factors together when more than one applies","Check with the operator about runway condition before going to a strip. Frost, thaw, mud and refreezing change through the day","Low winter sun causes glare accidents and daylight ends early, so keep a time margin"]],["Carb ice and airframe ice",["Carb ice is the main VFR icing risk, most likely <code>0°C to 10°C</code> with high humidity","In cruise in conducive conditions apply heat for about 15 seconds every 10 to 15 minutes","Airframe ice needs visible moisture and <code>0°C</code> or below. Most forms between <code>0°C and -10°C</code>","<b>Clear ice</b>: large supercooled drops in towering cloud, builds fast and is hard to see. <b>Rime ice</b>: milky, powdery on leading edges in stable cloud. <b>Freezing rain</b>: can be extremely severe, avoid it","Only aircraft approved for known icing should enter it, and the AFM must state this"]],["If you pick up ice",["Watch for airspeed loss, and look for ice on windscreen edges and small protrusions","Icing usually sits in bands several thousand feet thick. Descent into warmer air is normally the answer, but watch the terrain","Keep speed up: stall speed is higher by an unknown amount and the stall warner may be frozen","Tail ice cuts elevator authority and can stall the tailplane","On approach add <code>20%</code> or more to speed and consider less flap, and divert to a long runway","If you cannot shed ice, tell ATC and consider a Mayday"]],["Winter ground handling",["Heater exchangers on piston aircraft can leak carbon monoxide. From January 2025 certain piston aircraft carrying passengers need a working CO detector","Battery capacity falls in the cold, so avoid electrics before start and use external power if weak","Avoid long idling and over-priming. Below 0°C preheat with a light-aircraft system","Check the oil breather pipe for ice, and keep tanks full to reduce condensation","Carry survival kit: warm clothing, torch, whistle. A PLB is a wise precaution"]]],cards:[["Define fog and mist by visibility.","Fog is below 1,000 m. Mist is 1,000 to 5,000 m."],["How is runway condition reported now?","Global Reporting Format (rated 0 to 6) via SNOWTAM or ATIS, not the METAR."],["What does GRF 6 mean? And 0?","6 is a normal dry runway. 0 means minimal braking action, such as wet ice."],["Main warning sign of radiation fog?","Temperature and dew point converging, with clear skies and light wind."],["How much can light frost reduce lift and increase drag?","Lift down by up to 30%, drag up by up to 40%."],["Which de-icing fluid type suits light aircraft?","Type I. Types II and IV are for larger aircraft."],["Take-off factors for wet grass and general safety?","x1.3 for wet grass, then x1.33 general."],["Landing factors for wet grass and general safety?","x1.35 for wet grass, then x1.43 general."],["Temperature range of most airframe icing?","0°C to -10°C."],["Clear ice versus rime ice?","Clear ice is from large drops, builds fast and is hard to see. Rime is milky and powdery on leading edges in stable cloud."],["Approach speed change with significant ice?","Add 20% or more."],["Routine carb heat in cruise in icing conditions?","About 15 seconds every 10 to 15 minutes."]],quiz:[["Visibility is 800 m. The METAR code would describe it as:",["BR","FG","SN","BC"],1,"Fog is visibility below 1,000 m. BR is mist, 1,000 to 5,000 m."],["Which fluid is appropriate for de-icing a light aircraft?",["Type II","Type IV","Type I","Washing-up liquid"],2,"Type I fluid is used on light aircraft. Types II and IV do not shear off at low speeds."],["How much can light frost on the wing reduce lift?",["Up to 3%","Up to 10%","Up to 30%","None"],2,"Up to 30% lift loss and up to 40% more drag, so remove all frost."],["A take-off from wet grass: which factor applies before the general safety factor?",["x1.1","x1.3","x1.5","x2.0"],1,"Wet grass is x1.3 for take-off, then x1.33 general."],["You encounter airframe ice. The best first option is usually to:",["Climb at the best rate regardless of terrain","Slow down for better control","Descend towards warmer air if terrain allows, keeping speed up","Switch off the pitot heater"],2,"Ice sits in bands. Descent is normally safer, and keep speed high because stall speed has risen."],["Which is the likely fog type on a clear, calm, cold winter night inland?",["Advection fog","Radiation fog","Sea fog","Frontal fog"],1,"Radiation fog forms as the ground cools under clear skies with light winds."],["The GRF runway condition code of 0 indicates:",["Dry runway","Minimal braking action such as wet ice","Light frost","Runway closed for work"],1,"0 is the worst rating, with minimal braking action."]],src:[["Safety Sense Leaflet 3: Winter Flying","https://www.caa.co.uk/media/3hwj223x/safety-sense-03-winter-flying-version-9.pdf"]]},{s:2,topic:"Weight, balance and performance (SS09)",order:20,conf:"weak",status:"draft",summary:"The pilot is legally responsible for weight, balance and performance. Overloading lengthens take-off and landing, cuts climb and range, and raises stall speed. A forward CG raises stall speed, an aft CG reduces pitch stability. CG is total moment divided by total weight. AFM performance is unfactored, so GA pilots should apply safety factors (take-off x1.33, landing x1.43). Built from CAA Safety Sense Leaflet 9.",sections:[["Responsibility and empty weight",["The pilot in command must keep the aircraft within weight and balance limits for the whole flight, and confirm it can take off, climb and land in the space available","Use the schedule for your own airframe, not a generic type schedule","Basic empty weight normally includes oil, unusable fuel and fitted equipment","If you might exceed MTOW, find real passenger and baggage weights (include lifejackets, coats and bags). Check baggage compartment and seat limits"]],["Fuel weight",["Check tank quantities against the schedule with a dipstick, because gauges can be wrong","For weight and balance assume fuel is on the high side, for fuel planning assume low","AVGAS is about <code>0.72 kg/L</code>, Jet A-1 about <code>0.8 kg/L</code>. MOGAS varies, so weigh a litre"]],["Effects of overloading",["Longer take-off run and higher take-off speed","Reduced acceleration, climb angle, climb rate and ceiling","Reduced range and poorer controllability","Higher stall and landing speeds, longer landing roll and reduced braking","Smaller structural margins, and performance beyond limits cannot be predicted"]],["Balance and the centre of gravity",["<b>Datum</b> is the reference point. <b>Arm</b> is distance from datum. <b>Moment = weight x arm</b>","CG = total moments / total weight","Forward CG: higher stall speed, heavier nose, less nose-up authority, more drag and fuel burn","Aft CG: hard to trim, less pitch stability, pitch-up at low speed and high power, degraded stall and unknown spin behaviour","CG can move as fuel burns, so calculate for take-off and landing","Heavy small items (tool box) matter. Load evenly side to side and respect fuel imbalance limits"]],["Worked CG example",["Empty 700 kg at 2.22 m = 1,554. Front seats 160 kg at 2.05 m = 328. Rear seats 70 kg at 2.98 m = 208.6","Baggage 15 kg at 3.63 m = 54.45. Fuel 100 kg at 2.41 m = 241","Total weight 1,045 kg, total moment 2,386.05","CG = 2,386.05 / 1,045 = <code>2.28 m</code> aft of datum, then check it sits inside the envelope limits"]],["Performance principles and definitions",["AFM figures are <b>unfactored</b>: a new aircraft, a proficient pilot, no wear","Take-off distance includes climb to <code>50 ft</code>. Landing distance is measured from crossing the threshold at 50 ft","<b>TORA</b> take-off run available. <b>TODA</b> = TORA plus clearway. <b>ASDA</b> = TORA plus stopway. <b>LDA</b> landing distance available","Standard reference is <code>1013 hPa</code> and <code>15°C</code>. Pressure altitude is the altimeter reading with 1013 set. Density altitude is pressure altitude corrected for temperature","Rule of thumb in the leaflet: <code>27 ft per hPa</code>"]],["Rule-of-thumb multipliers",["+10% weight: take-off x1.2, landing x1.1","+1,000 ft elevation: take-off x1.1, landing x1.05","+10°C temperature: take-off x1.1, landing x1.05","Tailwind of 10% of lift-off speed: x1.2 for both","2% uphill slope: take-off x1.1. 2% downhill slope: landing x1.1","Multiply multiple factors together"]],["Safety factors",["Dry grass: take-off x1.2, landing x1.15","Wet grass: take-off x1.3, landing x1.35","Wet paved surface: landing x1.15","Soft ground or snow: x1.25 both","General factor applied last: take-off <code>x1.33</code>, landing <code>x1.43</code>","Do not operate if factored distances exceed those available"]],["Rejected take-off and climb",["Pick a visual <b>decision point</b> where you will abort if not enough speed. Move it earlier if the full ASDA is not available","Reasons to reject before the decision point: abnormal engine, poor acceleration, losing the centreline, bird strike, open door, loss of airspeed","After the decision point, minor problems are handled in the air. Never force a lift-off below rotation speed","Minimum climb rates: single-engine <code>500 ft/min</code>, multi-engine with one engine out <code>150 ft/min</code>","Required rate of climb = (ground speed / 60) x gradient in ft per NM. Example: 500 ft in 2 NM is 250 ft/NM. At 70 kt that needs about 291 ft/min","Non-turbo piston aircraft lose a lot of climb above 5,000 ft density altitude"]],["Units and conversions",["1 kg = 2.205 lb. 1 ft = 0.305 m. 1 Imperial gal = 4.546 L. 1 US gal = 3.785 L","1 Imperial gal = 1.205 US gal","Mixed units have caused accidents: check every document and match the specific gravity to the volume unit"]]],cards:[["What is a moment?","Weight x arm (distance from the datum)."],["How do you calculate the CG?","Total moment divided by total weight."],["Effect of a forward CG on stall speed?","Stall speed rises."],["Effect of an aft CG on stability?","Pitch stability reduces, so it is harder to trim and recover."],["General safety factor for take-off and landing?","Take-off x1.33, landing x1.43."],["What does TODA equal?","TORA plus clearway."],["What does ASDA equal?","TORA plus stopway."],["Take-off distance is measured to what height?","50 ft."],["What is pressure altitude?","The altimeter reading with 1013 hPa set."],["Effect of +10% weight on take-off distance?","About x1.2."],["Effect of a tailwind of 10% of lift-off speed?","About x1.2 on distance."],["Minimum single-engine climb rate?","500 ft/min."],["Weight of AVGAS per litre?","About 0.72 kg/L."],["Convert 1 US gallon to litres.","3.785 L."]],quiz:[["A 160 kg load at 2.05 m arm creates a moment of:",["78","328","1,640","32.8"],1,"Moment is weight x arm: 160 x 2.05 = 328."],["An aircraft with 1,045 kg total weight and 2,386.05 total moment has a CG of about:",["2.10 m","2.28 m","2.50 m","2.86 m"],1,"2,386.05 / 1,045 = 2.28 m."],["Which is a result of an aft CG?",["Higher stall speed","Reduced pitch stability","Higher nose-wheel loads","Greater induced drag"],1,"An aft CG reduces pitch stability and can worsen stall and spin behaviour."],["You calculate a 400 m take-off on dry grass. Applying x1.2 for grass then x1.33 gives about:",["480 m","532 m","640 m","712 m"],2,"400 x 1.2 = 480, then x1.33 = about 638 m, so roughly 640 m."],["Which describes TODA?",["TORA plus stopway","TORA plus clearway","LDA plus clearway","Runway length minus displaced threshold"],1,"TODA is the take-off run available plus clearway."],["You must clear 500 ft in 2 NM at 70 kt ground speed. Roughly what rate of climb is needed?",["150 ft/min","250 ft/min","290 ft/min","500 ft/min"],2,"250 ft/NM x (70/60) = about 291 ft/min."],["Which statement about AFM performance figures is correct?",["They include safety margins","They are unfactored for a new aircraft and proficient pilot","They apply only to paved runways","They ignore weight"],1,"AFM data is unfactored, so GA pilots should add their own safety factors."]],src:[["Safety Sense Leaflet 9: Weight, Balance and Performance","https://www.caa.co.uk/media/wcebqozv/ssl09-caa-safety-sense-weight-balance-and-performance.pdf"]]},{s:3,topic:"Pilot health and performance (SS24)",order:20,conf:"weak",status:"draft",summary:"You must self-assess your fitness before every flight, whether you hold a Part-MED medical or a Pilot Medical Declaration. Stress, fatigue, dehydration, alcohol, medication and illness all reduce performance. The UK alcohol limit for flying is 20 mg per 100 ml, and the I AM SAFE checklist covers Illness, Attitude, Medication, Stress, Alcohol, Fatigue and Eating. Hypoxia is a risk above 8,000 ft and carbon monoxide mimics it. Built from CAA Safety Sense Leaflet 24.",sections:[["Factors that reduce performance",["<b>Stress</b>: some is useful, too much hurts performance","<b>Fatigue</b> slows reactions and weakens concentration, memory and vigilance","<b>Dehydration</b> causes fatigue and headaches, worsened by hot cabins. Skipping meals gives low energy and mood swings","<b>Alcohol</b>: UK flying limit is <code>20 mg per 100 ml</code> blood, stricter than driving. Alcohol in the last 24 hours can still give a positive result","Persistent low mood or anxiety harms concentration and decisions: pause and seek advice"]],["I AM SAFE",["<b>I</b>llness, <b>A</b>ttitude, <b>M</b>edication, <b>S</b>tress, <b>A</b>lcohol, <b>F</b>atigue, <b>E</b>ating","Plan at least <code>8 hours</code> sleep before flying","No flying within <code>8 hours</code> of drinking, and up to <code>24 hours</code> after a lot","Eat a moderate, healthy meal within a few hours of flight","Use it like a weather or NOTAM check before going to the aircraft"]],["Medical certificates and the PMD",["Private pilots need a <b>UK Part-MED</b> certificate or, where permitted, a <b>Pilot Medical Declaration</b> (PMD)","PMD standard: reasonable belief you meet <b>DVLA Group 1</b> (car) standards. No examination, introduced 2016, with more restricted privileges (normally UK aircraft and airspace)","PMD maximum take-off mass limits: <code>2,000 kg</code> or <code>5,700 kg</code> depending on the requirements met","<b>Class 2</b> covers PPL flying and is done by an AME. A <b>LAPL</b> medical can usually be done by a GP","Both systems rely on honesty. Seek aeromedical advice after surgery, regular medication, serious illness or injury, pregnancy, hospital admission, or needing glasses for the first time","Withdraw a PMD as soon as you stop meeting DVLA Group 1 standards"]],["Medication, illness and incapacitation",["Starting a new medicine: leave a few days before flying to see effects","SERA.2020 bars flying under a psychoactive substance that impairs performance. Be careful with strong pain relief such as codeine, tramadol or morphine","Heart, blood vessel and brain conditions are the most critical causes of sudden incapacitation","Severe pain, vertigo, sudden vision loss and severe gastroenteritis can incapacitate","Minor colds and earache can become serious in flight"]],["Vision and hearing",["Eye checks at least every <code>two years</code>. Cataracts often affect night vision first","Carry a spare pair of glasses or lenses. The CAA advises against <b>polarised</b> and <b>photochromic</b> lenses","Hearing loss, especially of high frequencies, makes radio speech harder. A good aviation headset helps"]],["Altitude and gas effects",["Trapped gas expands as you climb: ear, sinus and gut discomfort. Do not fly with a cold, and use the <b>Valsalva</b> technique to clear ears","Above <code>8,000 ft</code> contrast sensitivity falls, especially in low light","Above <code>10,000 ft</code>: confusion, clumsiness, drowsiness, alcohol-like effects","Without oxygen or pressurisation stay below <code>10,000 ft</code>, and above that use supplementary oxygen per NCO.OP.190","If hypoxia is suspected, descend. Hyperventilation can be a sign of hypoxia or stress"]],["Heat, cold, CO and G",["Cockpits trap heat, especially while taxiing: drink water and wear breathable clothing","Cold reduces dexterity and slows reactions","<b>Carbon monoxide</b> is colourless and odourless from exhaust and cabin heaters, and its symptoms resemble hypoxia","G-forces change blood flow to eyes and brain: aerobatic training covers the anti-G straining manoeuvre"]],["Spatial disorientation and motion sickness",["Balance sense can conflict with the aircraft's real attitude, leading to wrong control inputs","Risk is highest at night, in cloud, or with false horizons such as sloping cloud banks","If you enter cloud: trust the instruments, level the wings, stabilise, then look for visual references. Non-instrument pilots must never enter cloud deliberately","Motion sickness is a mismatch between vision and balance. If it starts, be ready to return early"]],["Staying healthy",["UK adult guidance: <code>150 minutes</code> moderate or <code>75 minutes</code> vigorous activity a week","Alcohol: not more than <code>14 units</code> a week, spread over 3 or more days","NHS Health Check every five years for ages <code>40 to 74</code> in England","Smoking and e-cigarettes raise heart disease risk"]]],cards:[["What is the UK flying alcohol limit?","20 mg per 100 ml of blood."],["What does I AM SAFE stand for?","Illness, Attitude, Medication, Stress, Alcohol, Fatigue, Eating."],["Minimum recommended sleep before a flight day?","At least 8 hours."],["No flying within how long of drinking alcohol?","8 hours, and up to 24 hours after a lot."],["PMD basis standard?","DVLA Group 1 (car) medical standards."],["What kind of examiner performs Part-MED exams?","A CAA-authorised AME."],["Altitude where contrast sensitivity falls?","Above 8,000 ft."],["Altitude where confusion and drowsiness appear?","Above 10,000 ft."],["Technique to clear the ears?","Valsalva."],["How often should eyes be checked?","At least every two years."],["Which lenses does the CAA advise against?","Polarised and photochromic."],["Why is CO dangerous?","Colourless and odourless, with symptoms like hypoxia."],["What is the weekly activity guideline?","150 minutes moderate or 75 vigorous."],["If you suspect hypoxia?","Descend."]],quiz:[["Which describes the alcohol rule for pilots?",["Same as driving limit","20 mg per 100 ml blood","80 mg per 100 ml blood","No alcohol limit if not flying solo"],1,"The flying limit is 20 mg per 100 ml, much stricter than driving."],["In I AM SAFE, what does the second A stand for?",["Altitude","Attitude","Alcohol","Aircraft"],2,"Illness, Attitude, Medication, Stress, Alcohol, Fatigue, Eating."],["You start a new medication. What does the leaflet suggest?",["Fly immediately","Leave a few days before flying to see how it affects you","Fly only solo","Take a double dose"],1,"Side effects may be delayed, so wait and take aeromedical advice."],["A Pilot Medical Declaration is based on meeting:",["Class 1 standards","DVLA Group 1 standards","LAPL standards only","ICAO Class 3"],1,"A PMD requires reasonable belief you meet DVLA Group 1 car standards."],["Without oxygen or pressurisation, which ceiling applies?",["Below 8,000 ft","Below 10,000 ft","Below FL150","No limit"],1,"Flights without oxygen or pressurisation must stay below 10,000 ft."],["Carbon monoxide poisoning is hard to spot because:",["It smells strongly","It is colourless, odourless and mimics hypoxia","It only happens in winter","It affects only passengers"],1,"CO is invisible and its symptoms resemble hypoxia."],["Who is responsible for fitness to fly before each flight?",["The AME","The instructor","The pilot, whichever medical system applies","The aircraft operator"],2,"Self-assessment before every flight is the pilot's responsibility."]],src:[["Safety Sense Leaflet 24: Pilot Health and Performance","https://www.caa.co.uk/media/dvfk0ogj/safetysense_pilot_health.pdf"]]},{s:7,topic:"Stalls, spins and loss of control (SS30)",order:20,conf:"weak",status:"draft",summary:"A stall depends on angle of attack, not speed or attitude, so it can happen at any speed or attitude. Stall speed rises with the square root of load factor: a 60° banked level turn is 2 g, so a 50 kt stall speed becomes about 70 kt. Recovery is: lower the nose, level the wings, full power, accelerate, balance with rudder. A spin needs much more height to recover. Built from CAA Safety Sense Leaflet 30.",sections:[["What a stall is",["A stall is controlled by the wing's <b>angle of attack</b> (AoA), not by airspeed alone","It can happen at any attitude or airspeed, including with high control forces","A spin can follow if there is significant yaw during a stall. Recovery needs far more height than a stall","Warning of an approaching stall may be reduced in turns or at higher g"]],["Load factor and stall speed",["Stall speed rises with the <b>square root</b> of load factor","60° bank in a level turn = <code>2 g</code>, so stall speed rises by <code>sqrt 2</code> (about 1.4)","Example: <code>50 kt</code> becomes about <code>70 kt</code>"]],["Common causes",["<b>Distraction and fixation</b>: traffic, warnings, late turn to final with too much bank, unexpected ATC instructions","<b>Engine failure on take-off</b>: speed decays quickly, so lower the nose at once. Turning back or stretching the glide often causes a stall","<b>Go-around</b>: abrupt pitch and power changes, so watch airspeed even at full power","<b>VFR into IMC</b>: spatial disorientation leads to loss of control"]],["Symptoms",["<b>Approaching stall</b>: rising nose attitude, falling airspeed, buffet, possible warning","<b>Developed stall</b>: low airspeed, nose drop, strong buffet, roll or yaw, sloppy controls, high rate of descent even with a high nose attitude"]],["Recovery",["1. Move the control column centrally <b>forward</b> to reduce AoA","2. Level the wings with aileron only after AoA is reduced","3. Apply full power if available and counter any pitch-up","4. Accelerate and retract flap and gear as needed","5. Balance with rudder","Always follow the AFM stall and spin technique. Height loss is small if you act at the first stall warning"]],["Staying out of trouble",["Select the right power and attitude for each phase and trim to hold them","Check attitude and airspeed regularly and re-check after any distraction","Practise at safe altitudes and ask an instructor if unsure","Read the AFM or POH for your aircraft"]]],cards:[["What controls whether a wing stalls?","Angle of attack."],["Can a stall happen at high airspeed?","Yes, at any airspeed or attitude if the critical AoA is exceeded."],["Stall speed in a 60° banked level turn?","Rises by about 1.4 times (2 g)."],["Load factor in a 60° banked level turn?","2 g."],["First action in stall recovery?","Move the control column forward to reduce AoA."],["Why not use aileron first in a stall?","Aileron on a stalled wing can aggravate roll. Reduce AoA first."],["What follows significant yaw in a stall?","A possible spin."],["Why is turning back after engine failure on take-off dangerous?","Speed decays and AoA rises, so a stall or spin is likely."],["Does full power on a go-around guarantee safety?","No. Airspeed can still fall so lower the nose to accelerate."],["Stall speed changes with what mathematical relationship?","The square root of load factor."]],quiz:[["A level turn at 60° bank has a stall speed of 50 kt in straight flight. The turning stall speed is about:",["50 kt","60 kt","70 kt","100 kt"],2,"2 g multiplies stall speed by about 1.4, so roughly 70 kt."],["The first action to recover from a stall is to:",["Apply full power only","Move the control column forward to reduce AoA","Level the wings with aileron","Pull back"],1,"Reduce AoA first, then level wings, add power and accelerate."],["A stall can occur:",["Only at low airspeed","Only in a climb","At any attitude or airspeed","Only with flaps down"],2,"A stall depends on AoA, which can be exceeded at any speed or attitude."],["After engine failure on take-off the leaflet advises you to:",["Turn back immediately","Stretch the glide","Lower the nose promptly","Raise the nose"],2,"Lower the nose to keep flying speed. Turning back and stretching the glide often cause stalls."],["Which is a developed stall symptom?",["Increasing airspeed","Strong buffet with a high descent rate despite a high nose attitude","Steady climb","Stable controls"],1,"A developed stall gives strong buffet, mushy controls and a high descent rate."],["Why is a spin more serious than a stall?",["It needs far more height to recover","It uses more fuel","It is only a risk with flaps","It disables radios"],0,"A spin needs considerably more height to recover from, and may be unrecoverable at low level."]],src:[["Safety Sense Leaflet 30: Loss of Control","https://www.caa.co.uk/media/ukogcsea/caa8230_safetysense_30-lossofcontrol_v10.pdf"]]},{s:6,topic:"VFR flight into IMC (SS33)",order:20,conf:"weak",status:"draft",summary:"Most VFR-into-IMC accidents follow poor weather decisions, pressure to press on, and no instrument skills. Plan a minimum safe altitude (add 500 or 1,000 ft to the MEF), avoid flight below 1,500 ft AGL en route, and decide early to turn back. If you enter IMC, fly the attitude indicator, make a gentle rate 1 turn of no more than 20° bank through 180°, call ATC and make a MAYDAY. Built from CAA Safety Sense Leaflet 33.",sections:[["Causes of VFR into IMC",["Complex or uncertain forecasts, or only checking departure and destination weather","Weather deteriorating on the day, and pressure to continue (get-there-itis)","Distraction from navigation or radio","No instrument qualification: instrument flying is a separate perishable skill"]],["Spatial disorientation types",["<b>Visual</b>: false horizon from sloping cloud","<b>Vestibular</b>: the leans, feeling banked the wrong way","<b>Somatogravic</b>: acceleration feels like a pitch-up","<b>Coriolis</b>: head movement in a prolonged turn gives false rotation","<b>Inversion</b>: abrupt level-off feels like tumbling"]],["Planning to avoid IMC",["Watch weather for days beforehand and review METARs, TAFs and the F215 chart. Account for elevation differences","Red flags: widespread PROB30, big time windows for change, unclear early-morning data","Warm fronts: low cloud and poor visibility. Cold fronts: showers with unpredictable cloud. Persistent high pressure: haze and unclear horizon","Set a <b>minimum safe altitude</b>: add <code>500 ft or 1,000 ft</code> to the Maximum Elevation Figure (MEF) for each quadrangle","En-route flight below <code>1,500 ft AGL</code> is not recommended","Have a Plan B, identify diversion aerodromes, and brief passengers that weather may change the plan. Do not take off just to have a look"]],["VFR on top",["VMC above cloud without sight of the surface","Risks: no hole at the destination to get down, and an emergency above cloud","Class G at or below 3,000 ft AMSL (or 1,000 ft above terrain, whichever is higher): remain in sight of the surface","Above 3,000 ft AMSL: <code>5 km</code> visibility, <code>1,500 m</code> horizontal and <code>1,000 ft</code> vertical from cloud"]],["In-flight decisions and warning signs",["Use planned decision points and look ahead and to the sides","Warning signs: scraps of cloud passing close, intermittent loss of horizon, a warm front sky closing the gaps, haze or rain fading the horizon","High risk at night, over sea and over featureless terrain","Start recovery when you recognise the risk, not after you enter cloud","Never descend below MSA in IMC. If weather closes in on all sides, consider a precautionary field landing"]],["If you enter IMC",["Priorities: <b>Aviate, Navigate, Communicate</b>","Trust the instruments, focus on the attitude indicator, make small inputs and trim","If control is difficult, hold straight and level and avoid power changes and turns","Turn <code>180°</code> once stable, toward where you believe VMC lies"]],["The 180° turn",["Note the target heading, choose a direction, and set a <b>rate 1</b> turn with bank no more than <code>20°</code>","Use a little back pressure to prevent descent and scan attitude, heading, airspeed and turn coordinator","Roll out near the target heading and hold it until visual references appear","No attitude indicator: use altimeter and turn and slip, keeping the altimeter steady","No heading indicator: rate 1 takes <code>2 minutes</code> for 360°, so <code>1 minute</code> for 180°. Do not trust the compass in the turn"]],["Calling for help",["Call ATC as soon as you have capacity, but fly the aircraft first","A <b>MAYDAY</b> is appropriate in VFR into IMC","Be honest that you are not IMC qualified. Best help: units with radar, or the D&amp;D cell on <code>121.5 MHz</code>","Landing below VFR minima is a last resort and a practised SRA can help"]]],cards:[["What does the MEF stand for and how is it used?","Maximum Elevation Figure. Add 500 or 1,000 ft for a safe altitude margin."],["Lowest recommended en-route height under VFR?","1,500 ft AGL."],["VMC minima above 3,000 ft AMSL in Class G?","5 km visibility, 1,500 m horizontal and 1,000 ft vertical from cloud."],["Priority order if you enter cloud?","Aviate, Navigate, Communicate."],["Maximum bank for the 180° turn?","20° (rate 1)."],["Time for a 180° rate 1 turn?","1 minute (2 minutes for 360°)."],["What is VFR on top?","VMC above cloud without sight of the surface."],["What type of call should you make in VFR into IMC?","MAYDAY."],["Which frequency for the D&D cell?","121.5 MHz."],["Which illusion makes you feel banked the wrong way?","The leans (vestibular)."],["What is somatogravic illusion?","Acceleration feels like a pitch-up."],["Never do what in IMC?","Descend below MSA."]],quiz:[["Which is the recommended priority order in IMC?",["Communicate, Navigate, Aviate","Aviate, Navigate, Communicate","Navigate, Aviate, Communicate","Aviate, Communicate, Navigate"],1,"Flying the aircraft comes first."],["Without a heading indicator, how long does a rate 1 turn through 180° take?",["30 seconds","1 minute","2 minutes","3 minutes"],1,"Rate 1 is 2 minutes for 360°, so 1 minute for 180°."],["A sensible minimum safe altitude margin above the MEF is:",["100 ft","500 or 1,000 ft","2,500 ft","None needed"],1,"The leaflet notes common practice of adding 500 or 1,000 ft."],["Maximum bank angle suggested for the 180° turn in IMC:",["10°","20°","30°","45°"],1,"Rate 1 turn, no more than 20° bank, with a little back pressure."],["Which illusion makes acceleration feel like a pitch-up?",["Coriolis","Leans","Somatogravic","Inversion"],2,"Somatogravic illusion is caused by rapid acceleration."],["Which call is appropriate when you inadvertently enter IMC without a rating?",["No call needed","MAYDAY","Routine position report","Weather request only"],1,"The leaflet advises a MAYDAY call in a VFR-into-IMC situation."]],src:[["Safety Sense Leaflet 33: VFR Flight into IMC","https://www.caa.co.uk/media/v43pcnok/safety-sense-leaflet-33.pdf"]]},{s:8,topic:"GA radiotelephony practice (SS22)",order:30,conf:"weak",status:"draft",summary:"CAA guidance on how GA pilots use the radio in the UK. Know the squawks (7000, 7500, 7600, 7700), read back the key clearances, report the right circuit calls and use 121.5 MHz for emergencies. MAYDAY and PAN PAN follow a set order. For radio failure, set 7600 and keep clear of controlled airspace. Built from CAA Safety Sense Leaflet 22, alongside CAP 413.",sections:[["Squawk codes",["<code>7000</code> VFR conspicuity","<code>2000</code> IFR conspicuity (not used in all states)","<code>7500</code> unlawful interference","<code>7600</code> radio failure","<code>7700</code> emergency","<code>0030</code> lost (UK procedure). Press IDENT only when asked","Select ALT unless told otherwise"]],["Equipment and technique",["Voice band is <code>117.975 to 137.000 MHz</code> at 8.33 kHz spacing","Check squelch is set properly and keep volume ideally no higher than <code>70%</code>","Initial call: station name then your callsign. Later: callsign only","Answer with the response then your callsign. Avoid fillers like 'this is' and do not use voice inflection to ask questions","Press PTT before speaking and hold until finished"]],["Items to read back",["Taxi instructions, level, heading and speed instructions","Airway or en-route clearances and approach clearances","Runway-in-use and clearances to take off, land, enter, backtrack, cross or hold short","Transponder instructions and altimeter settings","Frequency changes, type of ATS service and transition levels","Simple reporting instructions need only <b>wilco</b>"]],["Circuit and aerodrome calls",["Standard calls are <b>downwind</b> and <b>final</b>. Overhead join: report overhead and then descending deadside","<b>Final</b> is between 4 NM and the threshold. <b>Long final</b> is 4 to 8 NM. There is no 'short final': state distance instead","At ATC aerodromes call at 15 NM or 5 minutes from the ATZ, whichever is greater","<b>AFIS</b> uses the suffix 'Information' and may issue ground instructions up to a holding point. 'Land at your discretion' is not a clearance","<b>AGCS</b> uses 'Radio' and cannot give clearances or instructions","Unattended aerodromes: use <b>SAFETYCOM 135.480 MHz</b> within 10 NM and up to 1,000 ft above circuit height"]],["Flight information services and transits",["<b>Basic Service</b>: pilot avoids traffic. <b>Traffic Service</b>: gives traffic information only. <b>Deconfliction Service</b>: IFR in Class G, with avoidance advice","Request a CAS transit about <b>10 minutes</b> before the boundary and stay clear until cleared. Read back altitude limits","Pass-your-message order: callsign, type, departure, destination, position, altitude and altimeter setting, VFR or IFR, intentions","MATZ is not controlled airspace for civil aircraft, but contact the unit before entering"]],["MAYDAY and PAN PAN",["MAYDAY is serious and imminent danger. PAN PAN is a safety concern without immediate danger","Order: MAYDAY or PAN PAN x3, station, callsign, type, nature, intentions, position (height and heading), pilot qualification, other information (POB, endurance)","Call the unit you are talking to, or <b>London Centre D&amp;D on 121.5</b>. Select <code>7700</code>","'Mayday out' closes the call. Make a PAN PAN early if things may get worse"]],["Radio failure and lost procedures",["Fly the aircraft, stay in VMC and clear of controlled airspace","Check frequency, switches, volume and squelch, PTT, headset, circuit breakers (reset once), an alternate radio, a relay, or 121.5","Set <code>7600</code>. If only receive failed, make blind transmissions. If only transmit failed, keep listening","Over an aerodrome, observe the signal square, join the circuit and watch for light signals","If lost, seek help early, squawk <code>0030</code> with ALT and call London Centre on 121.5. Do not ask for training fixes in a real emergency"]]],cards:[["What does squawk 7600 mean?","Radio failure."],["What does squawk 7700 mean?","Emergency."],["What does squawk 7500 mean?","Unlawful interference."],["VFR conspicuity squawk?","7000."],["UK lost procedure squawk?","0030."],["Frequency for the London Centre D&D cell?","121.5 MHz."],["SAFETYCOM frequency?","135.480 MHz."],["How far from the aerodrome is SAFETYCOM usable?","Within 10 NM and up to 1,000 ft above circuit height."],["What does AFIS suffix say?","Information."],["What does AGCS suffix say?","Radio."],["Long final range?","4 to 8 NM."],["When do you press IDENT?","Only when ATC says squawk IDENT."],["Who may be unable to give clearances at AGCS?","The radio operator, since it is not a formal ATC service."],["How early should a CAS transit be requested?","About 10 minutes before the boundary."]],quiz:[["Which code do you set after radio failure?",["7000","7500","7600","7700"],2,"7600 is radio failure."],["What is the UK lost procedure squawk?",["0030","2000","7000","7700"],0,"0030 is the UK lost procedure code, with ALT selected."],["SAFETYCOM 135.480 MHz is used at unattended aerodromes within:",["5 NM","10 NM and 1,000 ft above circuit height","25 NM","The ATZ only"],1,"SAFETYCOM is usable within 10 NM and up to 1,000 ft above circuit height."],["An AFIS says 'land at your discretion'. This is:",["A landing clearance","Not a clearance, so make sure the runway is clear","A request to go around","An instruction to hold"],1,"AFIS gives no landing clearance and you decide and check the runway is clear."],["Where should you call if you are not in contact with anyone and need emergency help?",["Any tower","London Centre D&D on 121.5","Ground","Information on 119.875"],1,"D&D on 121.5 MHz can help."],["There is no 'short final' call. Instead you should:",["Say 'final'","State the distance, such as 'half-mile final'","Say 'base'","Say 'long final'"],1,"State the distance from the threshold."]],src:[["Safety Sense Leaflet 22: Radiotelephony","https://www.caa.co.uk/media/vfybdggv/safetysense22-radiotelephony.pdf"]]},{s:5,topic:"VFR flight planning and VMC minima (SS05)",order:20,conf:"weak",status:"draft",summary:"Good VFR planning covers weather, NOTAMs, fuel, weight, route and airspace, then keeps checking in flight. Legal fuel reserves for Part-21 aeroplanes are 10 minutes in sight of an aerodrome by day, 30 minutes by day otherwise and 45 minutes at night. Know the VMC minima and the FREDA checks, and keep 'Take 2' (2 NM or 200 ft) from controlled airspace. Built from CAA Safety Sense Leaflet 5.",sections:[["Pre-flight planning",["Use threat and error management: spot the threats, then plan how to handle them","Brief weather for departure, route, destination and alternates. Avoid en-route flight below <code>1,500 ft AGL</code>","Get NOTAMs and check airspace and temporary restrictions","Check weight and balance and performance for the actual load and runway","Carry a paper chart as backup. A Maximum Elevation Figure leaves no margin by itself"]],["Fuel reserves",["Part-21 aeroplanes: <code>10 minutes</code> by day in sight of the aerodrome, <code>30 minutes</code> by day otherwise, <code>45 minutes</code> by night","Helicopters: <code>20 minutes</code>","These are minima: plan to land with more"]],["VMC minima in the UK",["At or above <code>10,000 ft</code> (FL100): <code>8 km</code> visibility, <code>1,500 m</code> horizontal and <code>1,000 ft</code> vertical from cloud","Below 10,000 ft and above 3,000 ft amsl or 1,000 ft above terrain: <code>5 km</code>, same cloud distances","At or below 3,000 ft amsl, Classes A to E: 5 km with the same cloud distances","Class F or G at or below 3,000 ft: 5 km, clear of cloud and the surface in sight","UK reduction for Class F or G at or below 140 kt IAS by day with the surface in sight: <code>1,500 m</code> visibility","UK Class D exemption at or below 3,000 ft amsl by day at 140 kt IAS or less, clear of cloud, surface in sight"]],["In-flight monitoring",["About <code>80%</code> of your time should be spent looking outside","Do <b>FREDA</b> checks about every 10 minutes: Fuel, Radio, Engine, Direction, Altimeter","The regional pressure setting often reads low, so allow for it","Know your ATS: <b>Basic Service</b> versus <b>Traffic Service</b>","Use <b>Take 2</b>: keep 2 NM or 200 ft clear of controlled airspace edges"]],["Arrival and review",["Call the destination about 10 minutes before arrival and plan an overhead join where appropriate","Review the flight afterwards: what went well and what to improve"]]],cards:[["Fuel reserve for a Part-21 aeroplane at night?","45 minutes."],["Fuel reserve by day not in sight of an aerodrome?","30 minutes."],["Fuel reserve by day in sight of the aerodrome?","10 minutes."],["Fuel reserve for helicopters?","20 minutes."],["Visibility at or above FL100?","8 km."],["Visibility below FL100, above 3,000 ft amsl?","5 km."],["Horizontal and vertical distance from cloud in controlled-airspace VMC minima?","1,500 m horizontal, 1,000 ft vertical."],["What does FREDA stand for?","Fuel, Radio, Engine, Direction, Altimeter."],["How often to do FREDA checks?","About every 10 minutes."],["What is Take 2?","Keep 2 NM or 200 ft clear of controlled airspace."],["How much time should be spent looking outside?","About 80%."],["Recommended minimum en-route height under VFR?","Avoid below 1,500 ft AGL."]],quiz:[["You are flying a Part-21 aeroplane by night. The minimum final reserve is:",["10 minutes","30 minutes","45 minutes","60 minutes"],2,"45 minutes at night for Part-21 aeroplanes."],["VMC visibility at FL100 and above:",["5 km","8 km","10 km","1,500 m"],1,"8 km at or above 10,000 ft."],["FREDA stands for:",["Fuel Radio Engine Direction Altimeter","Fuel Route Engine Direction Altitude","Flaps Radio Engine Distance Altimeter","Fuel Radio Electrics Direction Airspeed"],0,"Fuel, Radio, Engine, Direction, Altimeter."],["What does 'Take 2' mean?",["Two radio calls","Keep 2 NM or 200 ft from controlled airspace","Two turns of a hold","Two minutes of fuel"],1,"A margin of 2 NM or 200 ft helps avoid infringements."],["About how much of your time should you spend looking outside?",["20%","50%","80%","100%"],2,"Roughly 80% of the time outside, 20% inside."]],src:[["Safety Sense Leaflet 5: Flight under VFR","https://www.caa.co.uk/media/ekemwzjw/caa8230_safetysense_05-vfr_v5.pdf"]]}]),Object.assign(a,{"Three types of engine icing":"Carburettor, intake and fuel system ice, and which engines they affect.","When it happens":"Humid air between 0°C and 10°C is worst, but warm days can ice too.","Recognising it":"Power loss shows as RPM or manifold pressure falling first.","Using carb heat and alternate air":"Select heat for at least 15 seconds and expect rough running as it clears.","Procedures by phase of flight":"Heat on before power off in descent, cold again for the go-around.","Prevention on the ground":"Full tanks, drained water checks and good seals.","Fog, mist and reporting":"Fog is under 1,000 m, mist 1,000 to 5,000 m, and runway state uses GRF.","Radiation fog and high pressure":"Clear, calm nights with closing temperature and dew point make fog.","Fronts and depressions":"Cold fronts bring showers, warm fronts lower cloud and visibility.","Frost, snow and de-icing":"Clear all frost. Use Type I fluid on light aircraft.","Surface performance factors":"Multiply the surface factors, then the general safety factor.","Carb ice and airframe ice":"Carb ice 0 to 10°C, airframe ice mostly 0 to -10°C.","If you pick up ice":"Keep speed up, descend if terrain allows, add 20% on approach.","Winter ground handling":"CO detectors, cold starts, battery care and survival gear.","Responsibility and empty weight":"The pilot in command owns the weight and balance and performance check.","Fuel weight":"Verify fuel with a dipstick and know AVGAS is about 0.72 kg/L.","Effects of overloading":"Longer take-off and landing, worse climb and range, higher stall speed.","Balance and the centre of gravity":"CG is total moment over total weight, and each end of the range has hazards.","Worked CG example":"A step-by-step example giving a CG of 2.28 m.","Performance principles and definitions":"AFM data is unfactored. TORA, TODA, ASDA, LDA and density altitude.","Rule-of-thumb multipliers":"How weight, height, heat, wind and slope scale distances.","Safety factors":"Surface factors, then x1.33 take-off and x1.43 landing.","Rejected take-off and climb":"Decision points, abort criteria and climb gradient maths.","Units and conversions":"Mass, length and volume conversions to prevent unit errors.","Factors that reduce performance":"Stress, fatigue, dehydration and alcohol, with the 20 mg limit.","I AM SAFE":"A seven-letter self-check before every flight.","Medical certificates and the PMD":"Part-MED, Class 2, LAPL and the DVLA Group 1 PMD.","Medication, illness and incapacitation":"New medicines, strong pain relief and causes of sudden incapacitation.","Vision and hearing":"Two-yearly eye checks, spare glasses and a good headset.","Altitude and gas effects":"Gas expansion, ears and hypoxia above 8,000 and 10,000 ft.","Heat, cold, CO and G":"Heat, cold, carbon monoxide and G-force effects.","Spatial disorientation and motion sickness":"False horizons and what to do if you enter cloud.","Staying healthy":"Activity, alcohol units and health checks.","What a stall is":"It depends on angle of attack, not speed.","Load factor and stall speed":"Stall speed goes up with the square root of g.","Common causes":"Distraction, engine failure, go-around and VFR into IMC.",Symptoms:"Buffet, nose attitude and falling speed warn you.",Recovery:"Forward stick, wings level, power, accelerate, rudder.","Staying out of trouble":"Trim, check attitude and airspeed, and practise.","Causes of VFR into IMC":"Poor forecasts, pressure to continue and distraction.","Spatial disorientation types":"Visual, vestibular, somatogravic, Coriolis and inversion illusions.","Planning to avoid IMC":"Weather review, MSA with a 500 or 1,000 ft margin and a Plan B.","VFR on top":"Minima and risks of flying above cloud.","In-flight decisions and warning signs":"Spot the signs early and turn back.","If you enter IMC":"Aviate, Navigate, Communicate and stay straight and level.","The 180° turn":"Rate 1, 20° bank, 1 minute for 180°.","Calling for help":"Call MAYDAY and use ATC or D&D on 121.5.","Squawk codes":"7000, 7500, 7600, 7700 and the UK lost code 0030.","Equipment and technique":"8.33 kHz, squelch, volume and call structure.","Items to read back":"Clearances and settings that must be read back.","Circuit and aerodrome calls":"Final, long final, AFIS, AGCS and SAFETYCOM.","Flight information services and transits":"Basic, Traffic and Deconfliction services and transit requests.","MAYDAY and PAN PAN":"The distress call order and 121.5 D&D.","Radio failure and lost procedures":"Squawk 7600, check the set and use the signal square.","Pre-flight planning":"Weather, NOTAMs, weight, route and a paper chart.","Fuel reserves":"10, 30 and 45 minute reserves for Part-21 aeroplanes.","VMC minima in the UK":"Visibility and cloud distances by height and airspace class.","In-flight monitoring":"80% outside, FREDA and Take 2.","Arrival and review":"Early call and a post-flight review."}),t.push.apply(t,[{s:4,topic:"Weather charts and forecasts (Skyway Code)",order:30,conf:"weak",status:"draft",summary:"The Skyway Code explains the UK GA weather products. The F215 forecasts weather below 10,000 ft for a 9-hour period, the F214 gives upper winds and temperatures, and the GAMET is a plain-text low-level forecast issued four times a day for four UK regions. TAFs are forecasts and METARs are reports, with cloud heights above aerodrome level. A ceiling is BKN or OVC, and legal VFR minima are limits, not targets. Built from the Skyway Code pp.33-40.",sections:[["F215, F214 and GAMET",["<b>F215</b> forecasts in-flight weather below <code>10,000 ft</code> for the British Isles over a <code>9-hour</code> period centred on a fixed time. F415 is the near-Europe version","The F215 shows fronts and pressure centres at the chart time, zones lettered A, B, C with cloud amount, type and heights above mean sea level, visibility, ice and turbulence, and the freezing level (0°C isotherm). <code>XXX</code> means tops above the chart limit","<b>F214</b> gives forecast upper winds and temperatures at 'spot' positions (columns: altitude in 1,000s of feet, wind direction, speed, temperature). F414 is near Europe","<b>GAMET</b> is an abbreviated plain-text low-level forecast issued four times a day for four UK regions. It replaced AIRMETs and includes the synoptic summary, hazards, freezing level and zone forecasts"]],["Reading TAFs and METARs",["TAFs are <b>forecasts</b>, METARs are <b>reports</b> of actual weather, normally updated every half hour","Example: <code>34008KT</code> is wind from 340° at 8 kt. <code>9999</code> means visibility 10 km or more. <code>SCT025</code> is 3 to 4 oktas at 2,500 ft above aerodrome level (AAL)","Cloud type is not reported unless it is cumulonimbus or towering cumulus","<b>TEMPO</b> is a temporary change within a period. <b>PROB30</b> and <b>PROB40</b> are the only probabilities used in the UK. If PROB30/40 or uncertain timings appear, look at the overall situation more thoroughly","Cloud is given above the <b>aerodrome</b>, so compare with terrain on your route. A 1,500 ft ceiling can hide hill tops","Viewing reports on a map helps build the weather picture. A <b>SIGMET</b> warns of severe weather such as thunderstorms, mountain waves, icing or turbulence"]],["Icing in the Skyway Code",["If you enter visible moisture at <code>0°C</code> or below, airframe ice may form. The worst usually occurs between <code>0°C and -15°C</code>","Always remove frost, ice and snow, and keep the pitot and static ports clear","Carb ice comes from the pressure and temperature drop in the venturi. It often forms outside visible moisture with high humidity and is more likely at low power","The carb icing risk chart plots dewpoint against air temperature and shows serious icing at any power or at descent power, so use carb heat per the AFM","Fuel-injected engines can still ice at the air intake: use alternate air"]],["Making the weather decision",["Know the conditions linked with warm and cold fronts, high and low pressure and thunderstorms","<b>Cloud ceiling</b> is the lowest cloud covering more than half the sky (BKN or OVC). <b>Cloud base</b> is the lowest visible cloud and includes FEW and SCT","Legal VFR minima are <b>limits, not targets</b>. Class G can allow 1,500 m visibility clear of cloud but the cloud height often forces dangerously low flight","Ceiling of <code>1,500 ft AGL</code> or less needs particular attention to terrain. Below <code>1,000 ft AGL</code> is normally for circuits or familiar local flying","Surface visibility under <code>5 km</code> is not recommended for VFR: the horizon is unlikely to be clear. Haze towards the sun and low winter sun can reduce visibility","Winds above about <code>35 kt</code> aloft often mean bumpy conditions, and strong headwinds affect fuel","If you do not hold an IR or IMC rating, you must not enter cloud"]]],cards:[["What period does an F215 cover?","A 9-hour period centred on a fixed time, below 10,000 ft."],["What does the F214 provide?","Forecast upper winds and temperatures."],["How often is a GAMET issued?","Four times a day for four UK regions."],["What does XXX on the F215 mean?","Cloud tops above the chart upper limit."],["What is the difference between a TAF and a METAR?","A TAF is a forecast, a METAR is a report of the actual weather."],["What does 9999 mean in visibility?","10 km or more."],["Cloud heights in TAFs and METARs are measured from where?","Above aerodrome level."],["What does TEMPO mean?","A temporary condition within the stated period."],["Which probabilities are used in UK TAFs?","PROB30 and PROB40 only."],["What is a SIGMET?","A warning of severe weather such as thunderstorms, mountain waves, icing or turbulence."],["Define cloud ceiling.","The lowest cloud covering more than half the sky (BKN or OVC)."],["Worst airframe icing temperature range per the Skyway Code?","0°C to -15°C."],["Surface visibility threshold below which VFR is not recommended?","Less than 5 km."],["Winds aloft above roughly what speed suggest bumpy conditions?","About 35 kt."]],quiz:[["Which chart forecasts weather below 10,000 ft over a 9-hour period?",["F214","F215","GAMET","SIGMET"],1,"F215 is the low-level significant weather forecast."],["In a TAF, SCT025 means:",["3 to 4 oktas at 2,500 ft AAL","3 to 4 oktas at 250 ft AMSL","1 to 2 oktas at 2,500 ft AAL","5 to 7 oktas at 2,500 ft AMSL"],0,"SCT is 3 to 4 oktas and the height is above aerodrome level in hundreds of feet."],["A cloud ceiling is:",["Any cloud base","Lowest cloud covering more than half the sky","Cloud above 10,000 ft","Cumulonimbus only"],1,"BKN or OVC forms a ceiling. FEW and SCT do not."],["A METAR reports visibility as 9999. This means:",["999 m","9,999 m exactly","10 km or more","Fog"],2,"9999 is used for 10 km or more."],["The Skyway Code says legal VFR visibility minima should be regarded as:",["Targets","Limits not targets","Irrelevant","Only for IFR"],1,"Safe VFR flight normally ceases long before the legal minima."],["Which product is a plain-text forecast issued four times a day for low-level GA?",["GAMET","F215","SIGMET","VOLMET"],0,"GAMET replaced AIRMET and covers four UK regions."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.33-40","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]},{s:5,topic:"Route planning and altitude selection (Skyway Code)",order:30,conf:"weak",status:"draft",summary:"Plan a VFR route with a pilot's log (PLOG), error-check it, and back it up with a plotted chart. Choose a safety altitude by adding 500 or 1,000 ft to the Maximum Elevation Figure (MEF) and study at least 5 NM either side of track. Avoid whole-number cruising altitudes, plan descents at 3 NM per 1,000 ft, use Take 2 near controlled airspace and plan a transit about 10 minutes ahead. Built from the Skyway Code pp.41-45.",sections:[["The PLOG",["A pilot's log holds headings, distances and times for each leg, frequencies, planned and safety altitudes and the fuel plan","Gross-error check all figures, for example confusing 030° with 300°, and keep winds aloft up to date","Plot the route on a paper chart too: it is the backup if the moving map device fails","Pick a radio frequency for each stage, consider UK FIS, and note hazards: aerodromes, danger areas, parachuting, glider sites and cable launches","Many busy GA aerodromes have no ATZ. VFR traffic may bunch near visual reference points (VRPs) and beacons"]],["Maximum Elevation Figure and safety altitude",["The <b>MEF</b> is the large figure in each lat/long box on the VFR chart. It is the higher of the highest obstacle or the highest terrain plus <code>300 ft</code>","Obstacles under 300 ft AGL may not be in the data, hence the 300 ft. Obstacles over 300 ft are captured with no extra margin","Study the area at least <code>5 NM</code> either side of track","No legal safety altitude exists for VFR but add <code>500 ft or 1,000 ft</code> over the highest obstacle or terrain","Set safety altitudes below which you will not descend without reversing course or diverting","If IFR-qualified, consider planning the flight as IFR from the outset"]],["Choosing a cruising altitude",["Avoid whole-number altitudes such as 3,000 ft. Pick random ones such as 4,200 ft or 5,400 ft","Flying higher can give a better view, greater glide range, lower traffic density, less turbulence, better TAS and fuel burn, and better radio reception","SERA VFR cruising levels apply above 3,000 ft AGL (starting at FL35) but are not mandatory in the UK. In some European states they are mandatory","Descent planning rule: <code>3 NM for every 1,000 ft</code>, so about 30 NM from 10,000 ft. Ground speed x 5 gives the descent rate in ft/min (100 kt is about 500 ft/min, a 3° path)"]],["Avoiding infringements",["Study controlled airspace boundaries: vertical limits change over short distances","Mark a route that clearly avoids CAS rather than navigating around edges ad hoc","<b>Take 2</b>: keep <code>2 NM or 200 ft</code> from CAS, Danger and Restricted areas, ATZs and similar","Request a UK FIS near CAS, or use a Frequency Monitoring Code","Use the relevant aerodrome QNH, not the RPS. Do not use IFR waypoints for VFR navigation. Make user waypoints at recognisable features","In local handling, set altitudes you must not exceed and include 'airspace' in HASELL checks"]],["Planning a transit of CAS",["Have a plan B. For CTRs check for preferred VFR routes in the aerodrome AIP entry (AD 2.22)","Request about <b>10 minutes</b> before the boundary and calculate an ETA at the boundary","Crossing overhead at right angles to the main runway can avoid aerodrome traffic","Be ready for a different route or altitude. Overflying with vertical clearance is an effective avoidance"]]],cards:[["What does a PLOG contain?","Headings, distances, times, frequencies, planned and safety altitudes and the fuel plan."],["What is the MEF?","The higher of the highest obstacle or highest terrain plus 300 ft in a lat/long box."],["Why the 300 ft in the MEF?","Obstacles under 300 ft AGL may not be captured in the aeronautical data."],["Suggested margin above the highest obstacle for a safety altitude?","500 ft or 1,000 ft."],["How wide should you study terrain either side of track?","At least 5 NM."],["Why choose non-whole-number cruising altitudes?","To reduce the risk of conflict, such as 4,200 ft."],["Descent rule of thumb?","3 NM per 1,000 ft of height to lose."],["Descent rate rule using ground speed?","Ground speed x 5 gives ft/min, so 100 kt gives about 500 ft/min."],["What is Take 2?","Keep 2 NM or 200 ft from CAS and similar airspace."],["How early to request a CAS transit?","About 10 minutes before the boundary."],["Is the RPS recommended for VFR near CAS?","No, use the relevant aerodrome QNH."],["Why avoid IFR waypoints in VFR navigation?","They are often on CAS boundaries or approach routes, creating infringement risk."]],quiz:[["The MEF in a lat/long box represents:",["Average terrain height","Higher of the highest obstacle or highest terrain plus 300 ft","Safe cruising altitude","Highest obstacle plus 1,000 ft"],1,"The MEF is not a safe altitude on its own: add a margin."],["You need to descend from 6,000 ft to 1,000 ft. Using the rule of thumb you need about:",["5 NM","15 NM","25 NM","50 NM"],1,"3 NM per 1,000 ft x 5,000 ft of height to lose = 15 NM."],["At 120 kt ground speed the rate of descent rule gives about:",["300 ft/min","600 ft/min","900 ft/min","1,200 ft/min"],1,"Ground speed x 5 = 600 ft/min."],["Take 2 means:",["Two radio calls","2 NM or 200 ft clear of airspace","Two navigation aids","Two crew"],1,"It is the recommended margin from CAS and similar airspace."],["Which safety altitude margin does the Skyway Code suggest?",["100 ft","500 ft or 1,000 ft","2,000 ft","None"],1,"There is no legal requirement but 500 or 1,000 ft above the highest obstacle or terrain is appropriate."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.41-45","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]},{s:5,topic:"Altimeter settings (Skyway Code)",order:35,conf:"weak",status:"draft",summary:"The UK uses QNH (altitude above sea level), QFE (height above aerodrome), regional pressure setting (the lowest forecast pressure in a region) and standard 1013 hPa (flight levels). One hPa is about 27 ft. The transition altitude is normally 3,000 ft outside controlled airspace and 5,000 or 6,000 ft within and below it, and the transition level must be at least 1,000 ft above it. The RPS usually reads low. Built from the Skyway Code pp.90-91.",sections:[["Four pressure settings",["<b>QNH</b>: altitude above mean sea level. On the ground it reads aerodrome elevation","<b>QFE</b>: height above aerodrome level. On the ground it reads zero","<b>Regional pressure setting (RPS)</b>: the lowest forecast pressure in an altimeter setting region. The UK has <code>21</code> regions with geographic names such as Portland or Cotswold. It normally gives a lower reading than actual altitude","<b>Standard 1013 hPa</b>: used above the transition altitude, giving flight levels and pressure altitude","<code>1 hPa</code> is about <code>27 ft</code>"]],["Transition altitude and level",["TA is the altitude above which position is given as a flight level","Outside CAS the UK transition altitude is normally <code>3,000 ft</code> AMSL. Within and below CAS it is normally <code>5,000 or 6,000 ft</code> (see ENR 1.7)","It is not mandatory for VFR flights in the UK to change to FLs, but it is for IFR","The lowest VFR flight level is normally FL35. The transition level is always at least <code>1,000 ft</code> above the TA","Example: QNH 1000 and 3,000 ft altitude: set 1013 and the altimeter reads about <code>3,351 ft</code> (13 hPa x 27 ft)"]],["Recommended procedure",["Use the most relevant QNH for your route or area. Use the RPS only if no local QNH is available","When transiting below or near CAS defined by altitude, use the QNH applicable to the airspace","When near CAS defined by flight level, use 1013 hPa","Larger aerodromes use QNH for take-off and landing"]]],cards:[["What does QNH indicate?","Altitude above mean sea level."],["What does QFE indicate?","Height above aerodrome level."],["What is the standard pressure setting?","1013 hPa."],["How many feet per hPa?","About 27 ft."],["What is the RPS?","The lowest forecast pressure in an altimeter setting region."],["How many altimeter setting regions does the UK have?","21."],["Why is the RPS a risk near CAS?","It normally under-reads, risking a vertical infringement."],["UK transition altitude outside CAS?","Normally 3,000 ft."],["Transition altitude in or below CAS?","Normally 5,000 or 6,000 ft."],["Minimum gap between transition altitude and transition level?","At least 1,000 ft."],["What is the lowest VFR flight level?","Normally FL35."],["Is use of flight levels mandatory for VFR in the UK?","No, it is required for IFR."]],quiz:[["With QNH 1000 and the altimeter on 1013 at 3,000 ft altitude, the reading is about:",["2,649 ft","3,000 ft","3,351 ft","4,013 ft"],2,"13 hPa x 27 ft = 351 ft, so 3,351 ft."],["The regional pressure setting is:",["The highest forecast pressure","The lowest forecast pressure in the region","An actual QNH","1013 hPa"],1,"Using RPS normally gives a lower altimeter reading than actual."],["The transition level must be:",["Equal to the TA","At least 1,000 ft above the TA","At least 500 ft above the TA","FL100"],1,"There must be a 1,000 ft minimum transition layer."],["Near CAS defined as a flight level you should set:",["QNH","RPS","1013 hPa","QFE"],2,"Use standard setting when the airspace is defined by FLs."],["Which setting reads zero on the ground at an aerodrome?",["QNH","QFE","RPS","1013"],1,"QFE reads height above the aerodrome."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.90-91","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]},{s:2,topic:"Fuel, flight plans and aerodrome planning (Skyway Code)",order:30,conf:"weak",status:"draft",summary:"Part 21 aircraft must carry certain reserves, and for non-Part 21 aircraft the Skyway Code advises not landing with less than 30 minutes of fuel for VFR. Gauges are not reliable so dip the tanks. A flight plan is required across borders, when under ATC, and when leaving the vicinity of an aerodrome at night. Check PPR, surface, usable length, obstacles and local procedures at unfamiliar aerodromes. Built from the Skyway Code pp.46-55.",sections:[["Fuel management",["Know fuel burn at each power setting and compare actual with planned during the flight","Carry reserves proportionate to the flight. Non-Part 21 aircraft just need 'sufficient', but not less than <code>30 minutes</code> for VFR is recommended","Pay attention to climb burn at high density altitude, cruise altitude and TAS, winds aloft and diversion options","Fuel gauges are not reliable for planning: use a dipstick or equivalent. Never ignore a low gauge in flight","A <b>fuel totaliser</b> measures fuel used, depends on the starting figure and would not show a leak","Lean the mixture for cruise per the AFM. Several accidents came from fuel system misconfiguration, so understand tanks and selectors"]],["Mass and balance reminders",["Operating outside mass and balance limits is illegal. Use figures for your own airframe","Avgas is about <code>0.72 kg/L</code> and Jet A-1 about <code>0.82 kg/L</code> (the leaflet uses about 0.8)","CG = total moments / total mass (example 2,386.05 / 1,045 = 2.28 m)","Check CG for take-off and landing as burning fuel can move it out of limits. Utility category may limit manoeuvres","In most light aircraft you cannot fill the tanks and all the seats"]],["Performance reminders",["TORA, TODA, ASDA and LDA are in the AIP. Unlicensed strips often give only total length","Do a calculation if mass, temperature, elevation or surface changes significantly. AFM data is for a new aircraft and proficient pilot","Safety factors: dry grass x1.2 and x1.15, wet grass x1.3
