<script>!function(){"use strict";var e=["Air Law","Aircraft General Knowledge","Flight Performance and Planning","Human Performance and Limitations","Meteorology","Navigation","Operational Procedures","Principles of Flight","Communications"],t=[{s:0,topic:"Operations of Aircraft",order:10,conf:"weak",status:"draft",summary:"EASA sorts aviation activity three ways: commercial or non-commercial, air transport or specialised operation, and complex or other-than-complex aircraft. An aircraft is complex if it meets criteria on mass, seating, crew or engines. The Basic Regulation splits into Part-NCO, Part-FCL and SERA. Modern Part-21 aircraft use these, while non-Part-21 aircraft (microlights, gyroplanes, vintage, ex-military and amateur-built) come under ANO 2016.",sections:[["EASA classifies civil aviation activity",["Commercial or non-commercial, based on the presence of remuneration","Air transport or specialised operation, based on the activity performed","Complex motor-powered or other-than-complex motor-powered, based on the aircraft used"]],["Definition of complex (air operations)",["Maximum certificated take-off mass exceeding <code>5,700 kg</code>","Certificated for a maximum passenger seating configuration of more than <code>19</code>","Certificated for a minimum crew of at least <code>2</code> pilots","Equipped with at least <code>one</code> turbojet engine or more than <code>one</code> turboprop engine"]],["Structure of the assimilated EU law",["The <b>Basic Regulation</b> branches into parts for different aspects of aviation","<b>Part-NCO</b> deals with NCO operations","<b>Part-FCL</b> deals with flight crew licensing","<b>SERA</b> (Standardised European Rules of the Air) deals with rules of the air"]],["Documents for a UK pilot in a G-registered aeroplane",["<b>ANO 2016</b>: enacted by parliament, with safety requirements for all aircraft in UK airspace and persons involved in aircraft operations; airworthiness, operational and flight crew regulations for non-Part-21 aircraft","<b>UK rules of the air regulations 2015</b> (SERA UK): all aircraft in UK airspace must adhere","<b>Part-FCL</b>: licensing requirements for Part-21 aeroplanes","<b>Part-NCO</b>: operational regulations for Part-21 other-than-complex motor-powered aircraft","<b>ANO 2016 Part 6 &amp; Schedule 8</b>: licensing for non-Part-21 aircraft","<b>ANO 2016 Part 5 &amp; Schedule 5</b>: operational regulations for non-Part-21 aircraft"]],["Part-21 or non-Part-21?",["Most modern factory-built aircraft (not microlights or gyroplanes) are <b>Part-21</b>","Vintage, ex-military, amateur-built aircraft, microlights and gyroplanes are <b>non-Part-21</b>"]]],cards:[["What three ways does EASA classify civil aviation activity?","Commercial vs non-commercial; air transport vs specialised operation; complex vs other-than-complex motor-powered aircraft."],["What decides commercial vs non-commercial?","The presence of remuneration."],["What decides air transport vs specialised operation?","The activity performed."],["Complex aircraft: take-off mass threshold?","Maximum certificated take-off mass exceeding 5,700 kg."],["Complex aircraft: passenger seating threshold?","Maximum certificated seating of more than 19."],["Complex aircraft: minimum crew?","At least 2 pilots."],["Complex aircraft: engine criterion?","At least one turbojet, or more than one turboprop."],["What does Part-NCO cover?","Operational regulations for Part-21 other-than-complex motor-powered aircraft."],["What does Part-FCL cover?","Licensing requirements for Part-21 aeroplanes."],["What does SERA stand for, and cover?","Standardised European Rules of the Air; the rules of the air."],["What does the Air Navigation Order (ANO) 2016 contain?","Safety requirements for all aircraft in UK airspace and people involved in operating them, including airworthiness, operational and flight crew rules for non-Part-21 aircraft."],["Which ANO 2016 parts cover licensing and operations for non-Part-21 aircraft?","Licensing: Part 6 and Schedule 8. Operations: Part 5 and Schedule 5."],["Which aircraft are non-Part-21?","Vintage, ex-military, amateur-built aircraft, microlights and gyroplanes."],["Which aircraft are Part-21?","Most modern factory-built aircraft, excluding microlights and gyroplanes."]],quiz:[["Which take-off mass makes an aircraft complex?",["2,730 kg","5,700 kg","5,701 kg","12,500 kg"],2,"The threshold is a maximum certificated take-off mass exceeding 5,700 kg."],["Which maximum seating configuration meets the complex threshold?",["9","12","19","20"],3,"More than 19, so exactly 19 does not qualify."],["What makes an activity commercial?",["Carrying passengers","Using a complex aircraft","Remuneration","Flying for a company"],2,"Commercial vs non-commercial depends on the presence of remuneration."],["Which engine fit meets the complex criterion?",["One piston engine","One turboprop","One turbojet","None of these"],2,"One turbojet is enough; turboprops need to be more than one."],["What separates air transport from specialised operation?",["The aircraft type","The activity performed","Crew size","Remuneration"],1,"It is based on the activity performed."],["Which regulation covers the rules of the air?",["Part-FCL","Part-NCO","SERA","Part-21"],2,"SERA is the Standardised European Rules of the Air."],["Which part covers flight crew licensing for Part-21 aeroplanes?",["Part-FCL","Part-NCO","SERA","ANO Part 5"],0,"Part-FCL contains the licensing requirements."],["Which of these is a non-Part-21 aircraft?",["A modern factory-built aeroplane","A microlight","A Part-21 airliner","A factory-built single"],1,"Microlights, gyroplanes, vintage, ex-military and amateur-built aircraft are non-Part-21."],["Which part covers operations of Part-21 other-than-complex aircraft?",["Part-NCO","Part-FCL","SERA","ANO Part 6"],0,"Part-NCO holds the operational regulations for these aircraft."]]},{s:0,topic:"Aviation Law and organisations",order:20,conf:"weak",status:"draft",summary:"How international and UK aviation law fit together. ICAO and the Chicago Convention set the Articles on sovereignty, registration, documents and licences, with 19 Annexes behind them. EASA and the UK CAA regulate at regional and national level. The UK Aeronautical Information Service covers the AIP and its 28-day AIRAC cycle, colour-coded AICs, NOTAMs and Air Supplements, plus the CAP guides and the layout of the Air Navigation Order 2016.",sections:[["International Civil Aviation Organisation (ICAO)",["Civil aviation resumed in <code>1919</code>; overflying other nations' territory and landing safely at prepared airfields had to be solved","<b>Paris Convention</b> <code>1919</code>: first major international aviation meeting (mostly European nations); general principles of air law and procedures agreed","<b>Chicago Convention</b> <code>1944</code>: moral obligation on contracting states to provide safe and efficient ground and flight organisations","<b>ICAO</b> formed <code>1947</code>, based in Montreal, Canada, to promote standards and recommended practices","The UK, like most nations, is an active ICAO member"]],["Differences between ICAO nations",["Cruising levels: <b>feet</b> in western nations, metres in some eastern European nations","Pressure: the UK uses hectopascals (hPa), an ICAO recommendation; the US uses inches of mercury","Airspace classes are widely adopted with small differences: the UK has no <b>Class B</b>, while the USA allocates it to Terminal Control Areas"]],["Chicago Convention principles",["The principles are known as <b>Articles</b>","<b>Shall</b> means must (required)","<b>Should</b> means not required, but recommended for good airmanship and flight safety"]],["Articles 1 to 13: sovereignty and regulations",["<b>1 Sovereignty:</b> each state has complete and exclusive sovereignty over its airspace","<b>2 Territory:</b> land and waters under a state's sovereignty","<b>4 Misuse:</b> civil aviation not to be used contrary to the convention's aims (illegal uses or war)","<b>5 Non-scheduled flight:</b> aircraft of other states may fly into or through, and land, without prior permission; a state may require overflying aircraft to land, or to follow prescribed routes or get permission where terrain is remote","<b>10 Customs airports:</b> a state may require landing at a customs airport on entry, and departure from one","<b>11 Applicability:</b> any aircraft, whatever its nationality, obeys the regulations of the state it is in","<b>12 Rules of the air:</b> apply to aircraft in a state's territory and aircraft carrying its nationality mark anywhere; over the high seas the convention's rules apply; states endeavour to prosecute violators","<b>13 Entry and clearance:</b> immigration, passport, customs and quarantine rules apply to passengers, crew and cargo"]],["Articles 16 to 26: registration and formalities",["<b>16 Search:</b> a state may search aircraft of other states on landing or before departure and inspect documents","<b>17 Nationality:</b> that of the state of registration","<b>18 Dual registration:</b> not allowed, but registration can be changed from one state to another","<b>19 National laws:</b> registration follows that state's laws","<b>20 Marks:</b> aircraft operating internationally display nationality and registration marks","<b>22 Facilitation:</b> prevent unnecessary delays (customs, immigration, quarantine)","<b>23 Procedures:</b> customs and immigration follow international practice","<b>24 Customs duty:</b> temporary admission duty-free; fuel, oil, spares and regular equipment retained on board on departure are exempt, but not items unloaded; spares imported for an aircraft on international operations are duty-free","<b>25 Distress:</b> states assist aircraft in distress and allow the owner and state of registry to assist","<b>26 Accident investigation:</b> the state where an accident occurs (deaths, serious injury or serious defect) investigates per ICAO procedures; the state of registry may observe"]],["Articles 28 to 40: facilities, documents and licences",["<b>28 Facilities:</b> radio, met and navigation services to ICAO standards; standard systems for communications, marking, signals and lighting; cooperation on charts","<b>29 Documents:</b> certificate of registration, certificate of airworthiness, licence for each crew member, journey logbook, radio licences, passenger list (names, embarkation, destination) if carrying passengers, cargo manifest and declarations if carrying cargo","<b>30 Radio:</b> only if licensed by the state of registry, used per the regulations of the state flown over, and only by licensed crew","<b>31 Certificate of airworthiness:</b> valid, issued by the state of registry","<b>32 Licences:</b> issued by the state of registry; a state may refuse to recognise its own nationals' licences granted by another state for flights over its territory","<b>33 Recognition:</b> certificates and licences recognised if issued to ICAO standards","<b>34 Journey logbooks:</b> kept on international operations","<b>35 Cargo:</b> weapons or munitions of war only with the state's permission; other items may be prohibited for public order or safety","<b>36 Photography:</b> may be prohibited or regulated","<b>37 Standards:</b> states aim for uniformity; ICAO adopts and amends standards and recommended practices (SARPs)","<b>39 and 40 Endorsements:</b> failures to meet a standard are shown on the certificate or licence; use internationally only if permitted; use in another state is at that state's discretion"]],["Articles 43 to 47, Annexes",["<b>43:</b> ICAO is formed by the convention, made up of an assembly, a council and other bodies","<b>44 Objectives:</b> safe and orderly growth; peaceful aircraft design and operation; development of airways, airports and navigation facilities; safe, regular, efficient and economical transport; fair competition without discrimination","<b>47:</b> states grant ICAO the legal capacity it needs","<b>19 Annexes</b> supplement the articles and define standards and recommended practices (SARPs)","UK differences from the ICAO system are shown in <b>AIP GEN 1-7</b>"]],["EASA",["EASA regulates licensing for pilots and aircraft across the EU, with full responsibility for flight operations and crew licensing (including training)","Having left the EU, the UK is again responsible for its own regulation","Key regulations for private pilots: the <b>Basic Regulation</b> and the <b>Aircrew Regulation</b>, both amended regularly","The Basic Regulation has annexes on airworthiness, licensing, medical and air traffic management","Subdivisions are <b>Parts</b> (e.g. <b>Part ORA</b> covers organisations such as training schools), implemented through <b>AMC</b> (Acceptable Means of Compliance) and <b>GM</b> (Guidance Material)"]],["Aviation law in the UK",["Enacted by Parliament; main sources for a private pilot: the Air Navigation Order, Part-NCO, Part-FCL and the Air Navigation (General) Regulations","The <b>CAA</b> is responsible for civil aviation in the UK, including the <b>Aeronautical Information Service (AIS)</b>"]],["Aeronautical Information Publication (AIP)",["<b>GEN:</b> national regulations and requirements, services, charges","<b>ENR:</b> en route rules and procedures, ATS information, navigation warnings","<b>AD:</b> information on licensed UK aerodromes","Updated on a fixed 28-day <b>AIRAC</b> cycle (Aeronautical Information Regulation And Control), with information of lasting character"]],["Aeronautical Information Circulars (AICs)",["Published monthly: administrative matters, advance warning of operational changes, operational and safety advice","Colours: Air Safety <b>pink</b>; Administrative <b>white</b>; Operational and Air Traffic Services <b>yellow</b>; UK Restrictions Chart <b>mauve</b>; Maps/Charts <b>green</b>","The exam may refer to a specific AIC; read the relevant ones, especially pink: Take-off, Climb and Landing Performance (AIC 127/2006, Pink 110), Wake Turbulence (AIC P083/2020), Helicopter Flight in Degraded Visual Conditions (AIC P137/2019)"]],["NOTAMs and Air Supplements",["<b>NOTAMs</b> are obtained daily before flight: restrictions (temporary controlled airspace, Red Arrows displays), runway closures, temporary obstacles, other vital information","Categories: <b>NOTAMN</b> new, <b>NOTAMR</b> replaces a previous one, <b>NOTAMC</b> cancels a previous one","<b>Air Supplements</b> carry temporary information with too much text or graphics for a NOTAM, e.g. major air shows or aerodrome work","AIP Supplements are issued every 28 days and stay current until no longer valid or notified as such"]],["AIS delivery and publications",["NATS provides the AIS on behalf of the CAA (NATS AIS Internet Briefing System)","AIS is giving way to the digital <b>Aeronautical Information Management (AIM)</b> system; ICAO Annex 15 covers aeronautical information services","<b>CAP 1535</b> Skyway Code; <b>CAP 637</b> Visual aids handbook; <b>CAP 413</b> Radiotelephony procedures; <b>CAP 804</b> licence requirements (reference only)","CAA General Aviation Safety Leaflets are available at training organisations and aeroclubs"]],["The Air Navigation Order 2016",["A statutory instrument enacted by Parliament as the basis of UK civil aviation, arranged in <b>Parts</b> (e.g. Part 4 Airworthiness of Aircraft) with consecutively numbered <b>Articles</b>","Further detail is in <b>Schedules</b> (e.g. Schedule 1 Interpretation)","Flight planners refer to it for equipment, licensing, documents, registration and operations, alongside Part-NCO","<b>Schedule 13</b> sets liability and maximum penalties for contraventions","<b>Schedule 1</b> gives the legal definitions and acts as a glossary"]]],cards:[["What was the Paris Convention of 1919?","The first major international aviation meeting, mostly European nations. It agreed general principles of air law and procedures."],["What did the Chicago Convention (1944) establish?","A moral obligation on contracting states to provide safe and efficient ground and flight organisations."],["When was ICAO formed, and where is it based?","1947, Montreal, Canada."],["What is ICAO's purpose?","To promote aviation standards and recommended practices internationally."],["Cruising level units: west vs some eastern Europe?","Feet in the west; metres in some eastern European nations."],["Pressure units: UK vs US?","UK: hectopascals (hPa). US: inches of mercury."],["How does UK airspace differ on Class B?","The UK has no Class B. In the USA it is allocated to Terminal Control Areas."],["What are ICAO principles from the Chicago Convention called?","Articles."],["ICAO wording: shall vs should?","Shall means must (required). Should means recommended for good airmanship and safety, not required."],["Article 1?","Sovereignty: each state has complete and exclusive sovereignty over its airspace."],["Article 5?","Non-scheduled flights: other states' aircraft may fly into, through and land without prior permission; states may require overflying aircraft to land."],["Article 11?","Any aircraft, whatever its nationality, must obey the regulations of the state it is flying in."],["Article 12?","States ensure rules of the air are followed in their territory and by aircraft with their nationality mark anywhere. Over the high seas the convention's rules apply."],["Article 17 and 18?","Aircraft have the nationality of the state of registration. No dual registration, but registration can be changed."],["Article 20?","Aircraft operating internationally display nationality and registration marks."],["Article 24?","Aircraft enter temporarily duty-free. Fuel, oil, spares and regular equipment kept on board on departure are exempt, not unloaded items."],["Article 26?","The state where an accident occurs investigates (deaths, serious injury, serious defect). The state of registry may observe."],["Article 29: documents on international flights?","Certificate of registration, certificate of airworthiness, crew licences, journey logbook, radio licences, passenger list and cargo manifest if applicable."],["Article 31?","International aircraft need a valid certificate of airworthiness from the state of registry."],["Article 32 and 33?","Licences come from the state of registry, and are recognised by other states if issued to ICAO standards."],["Article 44: ICAO objectives?","Safe and orderly growth, peaceful aviation, airway/airport/navigation development, safe regular efficient economical transport, fair competition without discrimination."],["How many ICAO Annexes, and where are UK differences shown?","19 Annexes. UK differences are in AIP GEN 1-7."],["Who regulates UK aviation after leaving the EU, and what is the CAA's information role?","The UK regulates itself. The CAA provides the Aeronautical Information Service (AIS), delivered by NATS."],["What are AMC and GM?","Acceptable Means of Compliance and Guidance Material, used to implement the rules in Parts."],["What is Part ORA?","The Part dealing with regulation of organisations, such as training schools."],["Main UK sources of regulation for a private pilot?","The Air Navigation Order, Part-NCO, Part-FCL and the Air Navigation (General) Regulations."],["What do the AIP parts GEN, ENR and AD cover?","GEN: national regulations and services. ENR: en route information. AD: licensed aerodromes."],["How often is the AIP updated?","Every 28 days on the AIRAC cycle."],["How often are AICs published, and what is the colour code?","Monthly. Pink air safety, white administrative, yellow operational/ATS, mauve UK restrictions chart, green maps/charts."],["NOTAM categories?","NOTAMN new, NOTAMR replacing, NOTAMC cancelling."],["What are Air Supplements?","Temporary information with too much text or graphics for a NOTAM, e.g. air shows or aerodrome work. Issued every 28 days."],["What is replacing the AIS concept?","The digital Aeronautical Information Management (AIM) system. ICAO Annex 15 covers aeronautical information services."],["CAP 1535, 637, 413, 804?","Skyway Code; Visual aids handbook; Radiotelephony procedures; licence requirements (reference only)."],["How is the ANO 2016 organised?","Parts containing consecutively numbered Articles, with detail in Schedules."],["ANO Schedule 13 and Schedule 1?","Schedule 13: liability and maximum penalties. Schedule 1: legal definitions (glossary)."]],quiz:[["Which convention was the first major international aviation meeting?",["Chicago 1944","Paris 1919","Montreal 1947","Geneva 1930"],1,"The Paris Convention of 1919, mostly European nations."],["When was ICAO formed?",["1919","1944","1947","1950"],2,"The Chicago Convention was 1944, ICAO itself was formed in 1947."],["Which unit of pressure does the UK use?",["Inches of mercury","Hectopascals","Millimetres of mercury","Pounds per square inch"],1,"The UK uses hPa; the US uses inches of mercury."],["Which airspace class does the UK not have?",["Class A","Class B","Class C","Class D"],1,"The UK has no Class B; in the USA it covers Terminal Control Areas."],["What does 'shall' mean in ICAO documents?",["Recommended","Required","Optional","Advisory"],1,"Shall means must. Should is a recommendation."],["Which Article gives states exclusive sovereignty over their airspace?",["Article 1","Article 2","Article 11","Article 12"],0,"Article 1 is sovereignty."],["Which Article makes any aircraft obey the regulations of the state it is in?",["Article 5","Article 11","Article 12","Article 13"],1,"Article 11, regardless of nationality."],["What nationality does an aircraft have?",["The operator's","The state of registration","The pilot's","The manufacturer's"],1,"Article 17: the state of registration."],["Can an aircraft be registered in two states at once?",["Yes, if both agree","No, but registration can be changed","Yes, for international flights","Only commercial aircraft"],1,"Article 18 forbids dual registration."],["Which Article lists documents carried on international flights?",["Article 20","Article 29","Article 31","Article 34"],1,"Article 29."],["Which state investigates an accident with deaths in another state?",["State of registry","State where it occurs","ICAO","State of the operator"],1,"Article 26: the state where it occurs investigates; the state of registry may observe."],["How many ICAO Annexes are there?",["12","15","19","24"],2,"There are 19 Annexes."],["Where are UK differences from ICAO shown?",["AIP GEN 1-7","ANO 2016","SERA","Article 37"],0,"AIP GEN 1-7."],["How often is the AIP updated?",["Weekly","Every 28 days","Monthly","Annually"],1,"On the 28-day AIRAC cycle."],["What colour are Air Safety AICs?",["White","Pink","Yellow","Green"],1,"Pink; white is administrative, yellow operational/ATS, mauve restrictions chart, green maps/charts."],["Which AIP part covers licensed aerodromes?",["GEN","ENR","AD","AIC"],2,"AD covers aerodromes."],["What does NOTAMC do?",["Gives new information","Replaces a NOTAM","Cancels a NOTAM","Corrects a chart"],2,"NOTAMN is new, NOTAMR replaces, NOTAMC cancels."],["Which CAP is the radiotelephony procedures guide?",["CAP 637","CAP 413","CAP 1535","CAP 804"],1,"CAP 413. CAP 1535 is the Skyway Code."],["Which ANO schedule covers penalties?",["Schedule 1","Schedule 5","Schedule 8","Schedule 13"],3,"Schedule 13; Schedule 1 is interpretation."],["Which body is responsible for civil aviation in the UK?",["EASA","ICAO","CAA","NATS"],2,"The CAA; NATS provides AIS on its behalf."],["How often are AICs published?",["Daily","Weekly","Monthly","Every 28 days"],2,"AICs are monthly."],["What carries temporary information too long for a NOTAM?",["An AIC","An Air Supplement","The AIRAC cycle","AIP ENR"],1,"Air Supplements, e.g. for major air shows."]]}],a={"EASA classifies civil aviation activity":"Activity is classified three ways: by payment, by type of operation and by aircraft category.","Definition of complex (air operations)":"Four tests (mass, seats, crew, engines); meeting any one makes an aircraft complex.","Structure of the assimilated EU law":"The Basic Regulation splits into Part-NCO (operations), Part-FCL (licensing) and SERA (rules of the air).","Documents for a UK pilot in a G-registered aeroplane":"Which document applies depends on Part-21 status: Part-FCL and Part-NCO for Part-21 aircraft, ANO 2016 for the rest, with UK SERA for everyone.","Part-21 or non-Part-21?":"Modern factory-built aircraft are Part-21; microlights, gyroplanes, vintage, ex-military and amateur-built are not.","International Civil Aviation Organisation (ICAO)":"Post-WW1 flying led to the Paris Convention (1919), the Chicago Convention (1944) and ICAO (1947, Montreal) to set common standards.","Differences between ICAO nations":"Nations differ on cruising level units, pressure units and airspace classes; the UK uses feet, hPa and has no Class B.","Chicago Convention principles":'Its principles are called Articles; "shall" is mandatory and "should" is only recommended.',"Articles 1 to 13: sovereignty and regulations":"States control their own airspace and regulations; any aircraft must obey the rules of the state it is in, and customs and entry rules apply.","Articles 16 to 26: registration and formalities":"An aircraft has one nationality (its state of registry), shows its marks, benefits from smooth customs, and is investigated by the state where an accident occurs.","Articles 28 to 40: facilities, documents and licences":"Covers the facilities states provide and the documents, licences and certificates needed for international flights, which are recognised if they meet ICAO standards.","Articles 43 to 47, Annexes":"Sets up ICAO, its objectives and legal capacity; 19 Annexes hold the detailed standards, with UK differences in AIP GEN 1-7.",EASA:"EASA regulated licensing and operations across the EU; the UK now regulates itself, but the Parts, AMCs and GM structure remains familiar.","Aviation law in the UK":"UK law comes from Parliament via the ANO, Part-NCO, Part-FCL and the General Regulations, with the CAA responsible for information through the AIS.","Aeronautical Information Publication (AIP)":"The AIP has three parts (GEN, ENR, AD) and is revised every 28 days on the AIRAC cycle.","Aeronautical Information Circulars (AICs)":"Monthly circulars on administration, operations and safety, colour-coded by subject; pink safety AICs matter most for the exam.","NOTAMs and Air Supplements":"NOTAMs give daily short-notice information (new, replacing or cancelling); Air Supplements carry longer temporary information.","AIS delivery and publications":"NATS delivers the AIS for the CAA, AIM is replacing it, and the CAPs and safety leaflets explain the rules in simpler form.","The Air Navigation Order 2016":"The ANO is the UK's main aviation statute: Parts and Articles for the rules, Schedules for detail, penalties in Schedule 13 and definitions in Schedule 1."};t.push({s:0,topic:"Rules of the Air",order:30,conf:"weak",status:"draft",summary:"The rules that keep aircraft apart. SERA and the UK rules apply ICAO Annex 2, and the commander always has to avoid collisions. Head-on aircraft turn right, the overtaker keeps clear, and converging aircraft give way to less manoeuvrable types or to traffic on their right. Near aerodromes you follow the pattern and turn left, the lower or final aircraft has priority, and navigation lights show which way another aircraft is heading. Low flying rules set 1,000 ft over congested areas and 500 ft elsewhere, with defined exemptions.",sections:[["SERA and the UK rules of the air",["Regulation (EU) No 923/2012 of 26 September 2012, as amended, set common rules of the air and operational provisions for air navigation services across EU states","On <code>1 January 2021</code> the UK left EASA and the regulations in force passed into UK law as <b>retained EU law</b>, now called <b>assimilated law</b> (EU Withdrawal Act 2018)","SERA applies ICAO standards and recommended practices and harmonises the ICAO airspace classification, supporting a single EU sky","The Single European Sky helps states meet their 1944 Chicago Convention obligations through a common interpretation and implementation","Only differences agreed by EU states are notified to ICAO","<b>ICAO Annex 2</b> sets the international standards for the rules of the air; the UK and EU both fully endorse them","<b>SERA</b> applies to every aircraft in EU airspace, whatever its type or state of registry","SERA does not cover every aspect, so states may keep supplementary rules","UK rules assimilated under <b>Article 249 of the ANO</b> sit in a separate Statutory Instrument, usually bound with the ANO in <b>CAP 393</b>","Many permissions and exemptions last only a short period, so check they are still valid on the CAA website (<b>ORS4</b>, Official Record Series 4)"]],["Scope and departures from the rules",["The rules apply to all aircraft in the UK (including near offshore installations, where low flying is concerned) and to all UK-registered aircraft wherever they are","SERA may be departed from as far as necessary to avoid immediate danger, or to comply with the law of the country the aircraft is in","A departure for safety reasons must be reported in writing to the competent authority within <code>10 days</code>"]],["Collision avoidance (SERA.3201)",["A collision risk exists when another aircraft is at the same level or approaching, its range is decreasing and its relative bearing stays constant","Regardless of any ATC clearance, the commander must take all possible measures to avoid colliding with any other aircraft","Do not fly so close to another aircraft as to create a danger of collision","No formation flying unless the commanders have agreed","An aircraft that must give way avoids passing over, under or crossing ahead of the other, unless passing well clear","An aircraft with right of way maintains its heading and speed","A glider and its tug count as one aircraft under the command of the tug; aeroplanes and helicopters must give way to aircraft towing gliders"]],["Right of way (SERA.3210)",["<b>Head-on:</b> if there is danger of collision, each aircraft turns <b>right</b>","<b>Overtaking:</b> the aircraft being overtaken has right of way; the overtaker, whether climbing, descending or level, keeps out of the way by turning right","An overtaking situation can be taken as approaching within <code>70°</code> of the other aircraft's centreline","<b>Converging, by category:</b> power-driven heavier-than-air aircraft give way to airships, sailplanes and balloons; airships give way to sailplanes and balloons; sailplanes give way to balloons","<b>Converging, same category at about the same altitude:</b> the aircraft with the other on its <b>right</b> gives way","Power-driven aircraft give way to those towing other aircraft or objects such as banners"]],["Flights near an aerodrome (SERA.3225)",["Unless ATC authorises otherwise, conform to the pattern formed by other landing aircraft or keep clear of the airspace where it is formed","Make all turns to the <b>left</b> unless ground signals direct otherwise","If ATC approves a straight-in approach, the pilot normally reports <b>long final</b> at <code>8 nm</code> and <b>final</b> at <code>4 nm</code> from the runway"]],["Order of landing and take-off (Rules 9 and 10)",["An aircraft landing or on final approach has right of way over others in flight or on the surface","When two or more aircraft approach to land, the <b>lower</b> aircraft has right of way, but must not cut in front of or overtake one on final approach","If ATC sets a landing order, follow it. If another aircraft is making an emergency landing, give way, and at night do not land until given further instruction","Power-driven heavier-than-air aircraft give way to sailplanes in all cases","Take off and land in the direction shown by ground signals or, without them, into wind, unless good aviation practice demands otherwise","Do not land on a runway that is not clear unless ATC authorises it. <b>Land after</b> is not a landing clearance: the decision is yours, based on whether separation is sufficient (never given at night)","Where take-offs and landings are not confined to a runway, leave clear on your left any aircraft which has landed, is landing or is about to take off (keep right of other aircraft)","When taxiing on a landing area, turn left once you are satisfied it will not interfere with other traffic","A flying machine about to take off leaves clear on its left any aircraft which has taken off or is about to","After landing, move clear of the landing area as soon as possible unless ATC authorises otherwise"]],["Radio in the ATZ and the right-hand traffic rule",["In an <b>Aerodrome Traffic Zone (ATZ)</b>, maintain appropriate radio or other communication with the aerodrome authority (ATC, Aerodrome Flight Information Service or Air/Ground Radio)","Before SERA, an aircraft following a road, railway, canal, coast or other line feature in sight of the ground had to keep it on its left, except in controlled airspace or when told otherwise","This is <b>no longer</b> a legal requirement, but the CAA strongly recommends it to keep separation from aircraft flying the opposite way along the same feature"]],["Lights on aircraft (Rule 14, SERA.3215)",["Aircraft must show the lights specified for their category so others can judge position and heading at night; the requirements generally apply when moving on the ground, and no other lights may be shown that impair them","If any required light fails in flight and cannot be repaired or replaced at once, the aircraft <b>must land</b> as soon as it is safe, unless ATC authorises continuing (Rule 15)","Flying machines and airships: <b>green</b> navigation light on the <b>right (starboard)</b> wing, <b>red</b> on the <b>left (port)</b> wing, each showing <code>110°</code> from dead ahead","The <b>white</b> tail light shows through <code>70°</code> either side of dead astern","The anti-collision light is a flashing red light visible in all directions","Red out to your left means your paths will not cross (<b>red to red = safe</b>); red out to your right may mean a collision risk (<b>red to green = unsafe</b>)","Green is the reverse: <b>green to green = safe</b>, <b>green to red = unsafe</b>","Red and green both visible: the other aircraft is heading straight at you. White visible: it is flying away from you","Airships also show a white nose light through <code>110°</code> either side of dead ahead; gliders show the basic flying machine lights or a steady red light in all directions; free balloons show a steady red light in all directions","In the UK, night runs from <code>30 minutes after sunset</code> to <code>30 minutes before sunrise</code>"]],["Low flying prohibitions (SERA.3105 and .5005(f))",["Minimum heights are set in both EASA SERA and UK SERA, with some differences","<b>UK and EASA, congested areas:</b> not below <code>1,000 ft</code> above the highest fixed object within <code>600 m</code>, and able to land clear without undue hazard to persons or property if an emergency arises. Being able to land clear is the pilot's responsibility, not ATC's","<b>EASA:</b> not below <code>500 ft</code> above the ground or water, or 500 ft above the highest obstacle within <code>150 m</code> of the aircraft","<b>UK, day only:</b> not closer than <code>500 ft</code> to any person, vehicle, vessel or structure","<b>UK, at night:</b> not below 500 ft above the ground or water, or 500 ft above the highest obstacle within 150 m","Exempt from the 500 ft and congested area rules when landing or taking off by normal aviation practice; the UK also exempts practising approaches to land or checking navigation aids or procedures at an aerodrome (under EASA a state authority may grant that exemption)"]],["Open-air assemblies",["<b>EASA:</b> except for take-off or landing, or with permission, do not fly over an organised open-air assembly of persons below the higher of 1,000 ft above the highest obstacle within 600 m, or a height that allows a landing without undue hazard if an emergency arises","<b>UK:</b> the same heights apply over assemblies of more than <code>1,000</code> persons, and flying lower needs written permission from the CAA","<b>UK:</b> do not land or take off within <code>1,000 m</code> of an assembly of more than 1,000 persons, except at an aerodrome using CAA-notified procedures, or at another landing site using notified procedures and the organiser's written permission"]],["Exceptions to the low flying prohibitions",["<b>Take-off and landing:</b> exempt when flying by normal aviation practice to take off, land, practise approaches or check navigation aids or procedures at an aerodrome; exempt from the 500 ft rule when landing, taking off or air-taxiing","<b>Captive balloons and kites:</b> no low flying prohibitions apply","<b>Special VFR and notified routes:</b> exempt from the 1,000 ft rule, but landings under this exemption only at a licensed or government aerodrome unless the CAA gives written permission","<b>Balloons and helicopters:</b> a balloon landing because it is becalmed is exempt from the 1,000 ft rule; a helicopter over a congested area is exempt from the land-clear rule","<b>Police air operator's certificate:</b> exempt from the 500 ft rule, the 1,000 ft rule and the open-air assembly prohibitions","<b>Flying displays, air races and contests:</b> exempt from the 500 ft rule within <code>1,000 m</code> horizontally of the gathering","<b>Glider hill-soaring:</b> exempt from the 500 ft rule","<b>Picking up or dropping tow ropes, banners or similar at an aerodrome:</b> exempt from the 500 ft rule","<b>Manoeuvring helicopters:</b> exempt from the 500 ft rule within a licensed or government aerodrome (or elsewhere with written CAA permission), but not closer than <code>60 m</code> to persons, vessels, vehicles or structures outside the site"]]],cards:[["Which regulation introduced SERA, and when?","Regulation (EU) No 923/2012 of 26 September 2012, as amended."],["What happened to EASA rules in the UK on 1 January 2021?","They passed into UK law as retained EU law, now called assimilated law."],["Which ICAO Annex sets the international rules of the air?","Annex 2."],["Where are the UK-assimilated rules of the air found?","Under Article 249 of the ANO, in a separate Statutory Instrument usually bound with the ANO as CAP 393."],["Where do you check that a permission or exemption is still valid?","The CAA website, ORS4 (Official Record Series 4)."],["Which aircraft do the UK rules of the air apply to?","All aircraft in the UK, and all UK-registered aircraft wherever they are."],["When may you depart from the rules of the air?","As far as necessary to avoid immediate danger, or to comply with the law of the country you are in."],["How soon must a safety departure from the rules be reported?","In writing to the competent authority within 10 days."],["When does a collision risk exist?","Another aircraft is at the same level or approaching, its range is decreasing and its relative bearing stays constant."],["Who must avoid collisions, whatever ATC has cleared?","The commander (pilot in command)."],["What should an aircraft with right of way do?","Maintain its heading and speed."],["How are a glider and its tug treated?","As one aircraft under the command of the tug. Aeroplanes and helicopters give way to aircraft towing gliders."],["Head-on with a risk of collision: what does each aircraft do?","Turn right."],["Overtaking: who has right of way, and what does the overtaker do?","The aircraft being overtaken. The overtaker keeps clear by turning right."],["What counts as an overtaking situation?","Approaching from within 70° of the other aircraft's centreline."],["Converging: who gives way, by category?","Power-driven heavier-than-air aircraft give way to airships, sailplanes and balloons; airships to sailplanes and balloons; sailplanes to balloons."],["Converging in the same category at about the same altitude: who gives way?","The aircraft that has the other on its right."],["Near an aerodrome, which way do you turn?","Left, unless ground signals direct otherwise."],["On a straight-in approach, where are 'long final' and 'final' reported?","Long final at 8 nm, final at 4 nm from the runway."],["Two aircraft approach to land: who has priority?","The lower aircraft, but it must not cut in front of or overtake one on final. An aircraft on final has right of way over others."],["What does ATC's 'land after' mean?","It is not a clearance to land. You decide whether separation is sufficient. It is never given at night."],["Is the right-hand traffic rule still a legal requirement?","No. Keeping a line feature on your left is only strongly recommended by the CAA."],["Which colour navigation light is on which wing?","Green on the right (starboard) wing, red on the left (port) wing, each showing 110° from dead ahead."],["How much of the sky does the white tail light cover?","70° either side of dead astern."],["Red to red, green to green: safe or unsafe?","Safe. Red to green and green to red are unsafe."],["You see both red and green lights on another aircraft. What does it mean?","It is heading straight at you. A white light means it is flying away."],["What must you do if a required light fails in flight?","Land as soon as it is safe, unless ATC authorises continuing."],["When does night start and end in the UK?","From 30 minutes after sunset to 30 minutes before sunrise."],["Minimum height over a congested area?","1,000 ft above the highest fixed object within 600 m, and able to land clear in an emergency. Landing clear is the pilot's responsibility."],["UK 500 ft rule by day?","Not closer than 500 ft to any person, vehicle, vessel or structure."],["EASA 500 ft rule?","Not below 500 ft above the ground or water, or 500 ft above the highest obstacle within 150 m."],["How close may you take off or land to an open-air assembly of more than 1,000 persons?","Not within 1,000 m, except at an aerodrome using CAA procedures or at an approved site with the organiser's written permission."],["Do the low flying prohibitions apply to captive balloons and kites?","No."],["How close may a manoeuvring helicopter under the exemption get to people and property outside the site?","Not closer than 60 m."]],quiz:[["Which ICAO Annex sets the international standards for the rules of the air?",["Annex 1","Annex 2","Annex 11","Annex 15"],1,"Annex 2. Annex 1 covers licensing, Annex 11 air traffic services and Annex 15 aeronautical information services."],["Which CAA publication usually binds the ANO with the assimilated rules of the air?",["CAP 393","CAP 413","CAP 637","CAP 1535"],0,"CAP 393. CAP 413 is the radiotelephony guide, CAP 637 the visual aids handbook and CAP 1535 the Skyway Code."],["Within how many days must a safety departure from the rules be reported in writing?",["24 hours","7 days","10 days","30 days"],2,"Ten days, to the competent authority."],["Two aircraft approach head-on with a danger of collision. What does each do?",["Climb","Turn left","Turn right","Descend"],2,"Each turns right."],["An aircraft is being overtaken. Who has right of way?",["The overtaking aircraft","The aircraft being overtaken","The higher aircraft","The faster aircraft"],1,"The aircraft being overtaken. The overtaker keeps clear by turning right."],["Two aeroplanes converge at about the same altitude. Who gives way?",["The one with the other on its left","The one with the other on its right","The lower one","The slower one"],1,"The aircraft that has the other on its right gives way."],["A power-driven aeroplane converges with a balloon. Who gives way?",["The balloon","The aeroplane","Whichever is lower","Whichever is slower"],1,"Power-driven heavier-than-air aircraft give way to airships, sailplanes and balloons."],["Within what angle of the other aircraft's centreline is an approach treated as overtaking?",["30°","70°","110°","140°"],1,"Within 70° of the overtaken aircraft's centreline."],["Which way do you turn near an aerodrome, unless told otherwise?",["Right","Left","Away from the circuit","Either way"],1,"Left, unless ground signals direct otherwise."],["Where is 'long final' reported on a straight-in approach?",["2 nm","4 nm","8 nm","10 nm"],2,"Long final at 8 nm, final at 4 nm."],["ATC says 'land after'. What does this mean?",["You are cleared to land","You decide whether separation is sufficient","You must go around","You must hold"],1,"It is not a landing clearance. The decision is yours, based on whether you judge separation sufficient."],["Which main navigation light is on the left (port) wing?",["Green","Red","White","Flashing red"],1,"Red on the left, green on the right."],["Through what angle does the white tail light show?",["70° either side of dead astern","110° either side of dead ahead","360°","180° to the rear"],0,"70° either side of dead astern. The red and green lights show 110° from dead ahead."],["You see an approaching aircraft's red light out to your left. What does this suggest?",["A collision risk","Your paths will not cross","It is flying away","It is a glider"],1,"Red to red is safe. Red to green is unsafe."],["A required light fails in flight and cannot be repaired. What must you do?",["Continue to your destination","Land as soon as it is safe, unless ATC authorises continuing","Climb above cloud","Switch on the landing light"],1,"Rule 15: land as soon as it is safe unless ATC authorises you to continue."],["When does night begin in the UK?",["At sunset","30 minutes after sunset","1 hour after sunset","At the end of civil twilight"],1,"Night runs from 30 minutes after sunset to 30 minutes before sunrise."],["What is the minimum height over a congested area?",["500 ft above the highest obstacle within 150 m","1,000 ft above the highest fixed object within 600 m","1,500 ft above the ground","500 ft above the ground"],1,"1,000 ft above the highest fixed object within 600 m, and you must be able to land clear in an emergency."],["Who is responsible for being able to land clear over a congested area?",["ATC","The pilot","The aerodrome","The CAA"],1,"The pilot, not ATC."],["What is the UK daytime 500 ft rule?",["Not below 500 ft above the ground","Not closer than 500 ft to any person, vehicle, vessel or structure","Not below 500 ft over water","Not within 500 ft of an aerodrome"],1,"By day, not closer than 500 ft to any person, vehicle, vessel or structure."],["How close may you take off or land to an open-air assembly of more than 1,000 persons, outside an approved procedure?",["Not within 150 m","Not within 500 m","Not within 1,000 m","Not within 2,000 m"],2,"Not within 1,000 m, except at an aerodrome using CAA procedures or an approved site with written permission."],["Which of these is exempt from the low flying prohibitions?",["A captive balloon or kite","Any glider","Any helicopter","Any aircraft over water"],0,"No low flying prohibitions apply to captive balloons and kites. Gliders are exempt only when hill-soaring, and only from the 500 ft rule."],["How close may a manoeuvring helicopter under the exemption get to people outside the site?",["20 m","60 m","150 m","500 ft"],1,"Not closer than 60 m to persons, vessels, vehicles or structures outside the aerodrome or site."]]}),Object.assign(a,{"SERA and the UK rules of the air":"SERA applies ICAO Annex 2 standards across the EU; since Brexit the UK applies them as assimilated law, with its own supplementary rules in the ANO and CAP 393.","Scope and departures from the rules":"The rules cover all aircraft in the UK and UK-registered aircraft anywhere; you may depart from them to avoid immediate danger, then report within 10 days.","Collision avoidance (SERA.3201)":"The commander is always responsible for avoiding collisions; the aircraft giving way keeps well clear and the one with right of way holds course and speed.","Right of way (SERA.3210)":"Head-on, both turn right; the overtaker keeps clear by turning right; when converging, give way to the less manoeuvrable category, or to the aircraft on your right.","Flights near an aerodrome (SERA.3225)":"Follow or stay clear of the traffic pattern and turn left, unless told otherwise.","Order of landing and take-off (Rules 9 and 10)":"The lower aircraft, or the one on final, has priority; land and take off into wind, and 'land after' is not a clearance.","Radio in the ATZ and the right-hand traffic rule":"Keep radio contact in an ATZ; keeping line features on your left is now only a recommendation.","Lights on aircraft (Rule 14, SERA.3215)":"Green on the right wing, red on the left, white at the tail, plus a red anti-collision light; a failed light means landing as soon as safe, and UK night starts 30 minutes after sunset.","Low flying prohibitions (SERA.3105 and .5005(f))":"1,000 ft over congested areas and 500 ft elsewhere, with different UK and EASA wording; being able to land clear is the pilot's job.","Open-air assemblies":"Stay above the 1,000 ft or land-clear height over assemblies, and keep take-off and landing 1,000 m away unless an approved procedure applies.","Exceptions to the low flying prohibitions":"Take-off, landing, special VFR, displays, hill-soaring and similar activities have defined exemptions from the 500 ft and 1,000 ft rules."}),t.push({s:8,topic:"Radiotelephony (CAP 413)",order:10,conf:"weak",status:"draft",summary:"How to talk on the radio in the UK. Speak clearly and steadily, say digits the radio way, use the standard words (ROGER, WILCO, AFFIRM, NEGATIVE, UNABLE), and read back the clearances that matter, ending with your callsign. Declare MAYDAY for distress and PAN PAN for urgency, and know what to do if the radio fails. Built from CAP 413 Edition 24, not yet from your own notes.",sections:[["Transmitting technique",["Check the volume and listen out first so you do not talk over someone else","Speak in a normal tone at an even rate of no more than <code>100 words per minute</code>, and keep the microphone at a steady distance","A slight pause before and after numbers makes them easier to understand",'Avoid hesitation sounds like "er" and avoid courtesies and chat',"Press the transmit switch fully before speaking and release it only when the message is complete. A <b>stuck microphone</b> blocks the frequency for everyone","After a call, wait at least <code>10 seconds</code> before calling again","A message should not contain more than <b>three</b> items (clearances, instructions or information)"]],["Letters, numbers and time",["Use the phonetic alphabet for individual letters, for example Alpha, Bravo, Charlie, Juliett, Whiskey","Digits are said <b>ZERO, WUN, TOO, TREE, FOWER, FIFE, SIX, SEVEN, AIT, NINER</b>, with <b>DAYSEEMAL</b> for the decimal point","Callsigns, headings, wind, speeds, flight levels and frequencies are said <b>one digit at a time</b>","Altitude, height, cloud height, visibility and pressure settings in whole hundreds or thousands use <b>HUNDRED</b> and <b>TOUSAND</b>, for example 2,500 ft is TOO TOUSAND FIFE HUNDRED and QNH 1000 is WUN TOUSAND","Frequencies use all six figures, except when the last two digits are zero, so 118.000 is WUN WUN AIT DAYSEEMAL ZERO","Time is given in <b>UTC</b>. Normally only the minutes are given, preceded by the word TIME if a time check"]],["Standard words and phrases",["<b>ROGER</b> means you have received the last transmission. It does not mean you will comply","<b>WILCO</b> means you understand the message and will comply with it","<b>AFFIRM</b> means yes. <b>NEGATIVE</b> means no, permission not granted, or that is not correct","<b>UNABLE</b> means you cannot comply, normally followed by a reason","<b>STANDBY</b> means wait and I will call you. It is not an approval or a denial","<b>SAY AGAIN</b> asks for a repeat. <b>I SAY AGAIN</b> repeats for emphasis. <b>CORRECTION</b> means an error has been made and the right version follows","<b>READ BACK</b> asks you to repeat the message exactly. <b>CONFIRM</b> asks for verification","<b>CONTACT</b> means your details have been passed. <b>FREECALL</b> means they have not, so give full details","<b>OVER</b> and <b>OUT</b> are not normally used on VHF"]],["Callsigns and stations",["On first contact use the full callsigns of both stations, for example <i>Borton Tower, G-ABCD</i>","You may abbreviate your own callsign (G-ABCD becomes G-CD) only after the ground station has abbreviated it first","The abbreviation keeps the first character and the last two","You may prefix the callsign with the aircraft manufacturer, type or category (such as Cessna or Helicopter)","You must not change callsign type during a flight unless ATC instructs it","Station suffixes show the service: <b>TOWER</b> (aerodrome control), <b>GROUND</b>, <b>APPROACH</b>, <b>RADAR</b>, <b>CONTROL</b>, <b>INFORMATION</b> (flight information), <b>RADIO</b> (air/ground), <b>DELIVERY</b>","On initial contact state the service you want, for example <i>request Basic Service</i>"]],["Clearances and readbacks",["Read back in full: taxi instructions, level, heading and speed instructions, route and approach clearances, runway in use, clearances to enter, land on, take off from, cross or hold short of a runway, SSR codes, altimeter settings, frequency changes, type of ATS service and transition levels","Always end a readback with your <b>callsign</b>","If your readback is wrong the controller says <b>NEGATIVE</b> followed by the correct version, and you read it back again","If you cannot comply, say <b>UNABLE</b> and give the reason","Other messages can be acknowledged with an abbreviated readback, such as <i>Roger</i> or <i>Wilco</i>","An ATC route clearance is <b>not</b> permission to take off or enter the runway","The word <b>TAKE-OFF</b> is used only when cleared for take-off or when that clearance is cancelled. At other times the word is <b>DEPARTURE</b>","A take-off clearance is issued separately from any other clearance","<b>CLEARED</b> and <b>CLIMB</b> are not used by air/ground radio operators or FISOs"]],["Aerodrome calls",["Make the first call short: station, your callsign and what you want, for example <i>request join</i>. The unit replies with your callsign and <i>pass your message</i>","Surface wind is a two-minute average. Ask for <i>instant wind</i> if you want the instantaneous value","Circuit reports are made as required by local procedures, such as downwind, base and final","<b>Final</b> is reported when you turn onto final approach. If that turn is more than <code>4 NM</code> from touchdown the report is <b>long final</b>","A landing clearance includes the runway designator. <b>CONTINUE APPROACH</b> is not an invitation to land","<b>LAND AFTER</b> (the preceding aircraft) is not a landing clearance: the pilot decides whether separation is sufficient","At aerodromes with a FISO the pilot hears information such as <b>LAND AT YOUR DISCRETION</b>, not clearances, and states their intentions","After landing, stay on the tower frequency until the runway is vacated, then report <i>runway vacated</i> if asked"]],["Emergencies and failures",["<b>MAYDAY, MAYDAY, MAYDAY</b> is distress: serious or imminent danger requiring immediate assistance","<b>PAN PAN, PAN PAN, PAN PAN</b> is urgency: a safety concern that does not require immediate assistance","The emergency message order is: prefix, station, callsign, aircraft type, nature of emergency, intentions, position, level and heading, pilot qualifications, other useful information such as persons on board","If not already talking to a unit, use <code>121.5 MHz</code>, address <b>London Centre</b>, and squawk <code>7700</code> if you have a transponder","Other special codes are <code>7600</code> for radio failure and <code>7500</code> for hijack","Declare early and cancel later. It is better to declare as soon as there is doubt","With a suspected communication failure check frequency, volume, headset and range, then try another frequency","If still unable, transmit your message twice, preceded by <b>TRANSMITTING BLIND</b>, or <b>TRANSMITTING BLIND DUE TO RECEIVER FAILURE</b> if your receiver has failed","A radio check uses the format: station callsign, your callsign, RADIO CHECK, frequency. Readability is 1 (unreadable) to 5 (perfectly readable)"]]],cards:[["What is the maximum rate of speech on the radio?","No more than 100 words per minute."],["How long should you wait before making a second call?","At least 10 seconds."],["How is the digit 9 said on the radio?","NINER."],["How are the digits 3, 4 and 5 said?","TREE, FOWER, FIFE."],["How is a decimal point said?","DAYSEEMAL."],["How is 2,500 ft said?","TOO TOUSAND FIFE HUNDRED."],["How is QNH 1000 said?","WUN TOUSAND."],["How is frequency 118.000 said?","WUN WUN AIT DAYSEEMAL ZERO. If the last two digits are zero, only the first four digits are given."],["Which time standard is used on the radio?","UTC."],["What does ROGER mean?","I have received your last transmission. It does not mean you will comply."],["What does WILCO mean?","I understand your message and will comply with it."],["What does AFFIRM mean?","Yes."],["What does NEGATIVE mean?","No, permission not granted, or that is not correct."],["What does UNABLE mean?","I cannot comply with your request, instruction or clearance. It is normally followed by a reason."],["What does STANDBY mean?","Wait and I will call you. It is not an approval or a denial."],["What is the difference between CONTACT and FREECALL?","CONTACT: your details have been passed. FREECALL: they have not, so give full details."],["When may you shorten G-ABCD to G-CD?","Only after the ground station has abbreviated it first."],["Which services do not use the word CLEARED?","Air/ground radio operators and flight information service officers (FISOs)."],["Which clearances must be read back in full?","Taxi, level, heading, speed, route and approach clearances, runway in use, runway entry, landing, take-off, crossing and hold-short clearances, SSR codes, altimeter settings, frequency changes, type of service and transition levels."],["How do you end a readback?","With your callsign."],["What does a controller say if your readback is wrong?","NEGATIVE, followed by the correct version."],["Which word is used in a departure clearance that is not a take-off clearance?","DEPARTURE. TAKE-OFF is used only when cleared for take-off or when that clearance is cancelled."],["At what distance is a 'long final' report made?","When turning onto final more than 4 NM from touchdown."],["Is CONTINUE APPROACH an invitation to land?","No. You must wait for a landing clearance or go around."],["What does the radio check format contain?","Station callsign, your callsign, RADIO CHECK, and the frequency."],["What does readability 3 mean?","Readable but with difficulty."],["Which prefix declares distress?","MAYDAY, MAYDAY, MAYDAY."],["Which prefix declares urgency?","PAN PAN, PAN PAN, PAN PAN."],["Which frequency is used for emergency calls and who do you address?","121.5 MHz, addressed to London Centre."],["Which transponder code means emergency?","7700. Radio failure is 7600 and hijack is 7500."],["What do you say if you cannot make contact and must transmit blind?","TRANSMITTING BLIND, then the message twice. If your receiver has failed: TRANSMITTING BLIND DUE TO RECEIVER FAILURE."]],quiz:[["How is the digit 9 said on the radio?",["Nine","Niner","Nyne","Nein"],1,"NINER, so it cannot be confused with the German word for no."],["How is QNH 1000 hPa said?",["Wun zero zero zero","Wun tousand","Ten hundred","One thousand hectopascals only"],1,"Whole thousands are said as the digit followed by TOUSAND, so WUN TOUSAND."],["How is an altitude of 2,500 ft said?",["Too fife zero zero","Twenty-five hundred","Too tousand fife hundred","Too tousand five zero zero"],2,"Altitudes in whole hundreds and thousands use TOUSAND and HUNDRED: TOO TOUSAND FIFE HUNDRED."],["Which word means you have received the message and will comply?",["Roger","Wilco","Affirm","Acknowledge"],1,"WILCO means understood and will comply. ROGER only means received."],["Which word do you use for yes?",["Yes","Affirm","Positive","Roger"],1,"AFFIRM is the standard word for yes. NEGATIVE means no."],["What is the maximum rate of speech?",["60 words per minute","100 words per minute","150 words per minute","200 words per minute"],1,"No more than 100 words per minute, slower when the message will be written down."],["How long should you wait before a second call?",["2 seconds","5 seconds","10 seconds","30 seconds"],2,"At least 10 seconds, to give the receiving station time to get ready to reply."],["Which of these must be read back in full?",["Time check","Runway in use","Traffic information","Surface wind"],1,"Runway in use is on the mandatory readback list."],["A controller says NEGATIVE after your readback. What does it mean?",["Your readback was incorrect and the correct version follows","You are refused take-off","Your radio is unreadable","You must change frequency"],0,"NEGATIVE followed by the correct version means your readback was wrong. Read the corrected version back."],["How may G-ABCD be shortened?",["G-AB","G-CD","ABCD","G-ACD"],1,"First character and last two: G-CD, and only once the ground station has abbreviated it first."],["Which word replaces TAKE-OFF in a departure instruction that is not a take-off clearance?",["DEPARTURE","LAUNCH","LINE UP","ROLL"],0,"TAKE-OFF is used only when cleared for take-off or when it is cancelled. Otherwise DEPARTURE."],["Which call prefix declares distress?",["PAN PAN","MAYDAY","SECURITE","URGENT"],1,"MAYDAY, MAYDAY, MAYDAY declares distress. PAN PAN declares urgency."],["Which frequency is used for emergency calls when not talking to a unit?",["118.0","121.5","123.45","130.0"],1,"121.5 MHz, the international aeronautical emergency frequency."],["Which transponder code indicates an emergency?",["7000","7500","7600","7700"],3,"7700 is emergency. 7600 is radio failure and 7500 is hijack."],["Which callsign suffix is used for a flight information service?",["TOWER","RADIO","INFORMATION","CONTROL"],2,"INFORMATION is flight information. RADIO is air/ground communication service."],["A radio check reply says READABILITY 3. What does it mean?",["Perfectly readable","Readable","Readable but with difficulty","Unreadable"],2,"3 is readable but with difficulty. 5 is perfectly readable and 1 is unreadable."],["What do you say if you suspect your receiver has failed?",["Mayday receiver","Transmitting blind due to receiver failure, then the message twice","Say again all stations","Radio check"],1,"Transmit your reports twice, preceded by TRANSMITTING BLIND DUE TO RECEIVER FAILURE."],["Is CONTINUE APPROACH an invitation to land?",["Yes","Only in daylight","No, you need a landing clearance or must go around","Only at an uncontrolled aerodrome"],2,"CONTINUE APPROACH is not an invitation to land."]]}),Object.assign(a,{"Transmitting technique":"Speak steadily at no more than 100 words per minute, pause around numbers, and release the microphone when done.","Letters, numbers and time":"Say digits as ZERO, WUN, TOO, TREE, FOWER, FIFE, SIX, SEVEN, AIT, NINER, and use HUNDRED and TOUSAND for whole hundreds and thousands of altitude and pressure.","Standard words and phrases":"ROGER means received, WILCO means will comply, AFFIRM means yes, NEGATIVE means no, UNABLE means you cannot comply.","Callsigns and stations":"Use full callsigns at first, shorten yours only after the ground station does, and use the right suffix for the service.","Clearances and readbacks":"Read back the safety-critical items in full, end with your callsign, and remember a route clearance is not a take-off clearance.","Aerodrome calls":"Keep first calls short, report long final beyond 4 NM, and never treat CONTINUE APPROACH or LAND AFTER as a landing clearance.","Emergencies and failures":"MAYDAY is distress, PAN PAN is urgency; use 121.5 and 7700, declare early, and transmit blind twice if you cannot make contact."});var n={facts:[["How is the digit 5 said on the radio?",["Five","Fife","Fiver","Fyve"],1,"FIFE, so it is not confused with nine or other digits."],["How is the digit 3 said on the radio?",["Three","Tree","Thri","Trey"],1,"TREE."],["How is frequency 118.125 said?",["Wun wun ait dayseemal wun too fife","Wun wun ait dayseemal wun two five zero","Wun eighteen dayseemal one two five","Wun wun ait wun too fife"],0,"Six figures: each digit separately with DAYSEEMAL in sequence."],["How is frequency 122.500 said?",["Wun too too dayseemal fife zero zero","Wun too too dayseemal fife","Wun too too fife hundred","Wun twenty-two dayseemal five"],1,"When the last two digits are zero only the first four digits are given: WUN TOO TOO DAYSEEMAL FIFE."],["Which numbers use HUNDRED or TOUSAND?",["Callsigns","Headings","Whole hundreds and thousands of altitude, cloud height and visibility","Wind direction"],2,"Altitude, height, cloud height, visibility and RVR in whole hundreds or thousands."],["Which time standard is used in RTF?",["Local time","UTC","Zulu with a date","Solar time"],1,"UTC at all times unless specified."],["What is the maximum number of items in one ATC message?",["One","Three","Five","As many as needed"],1,"No more than three specific items (clearance, instruction or information)."],["What should you do if the microphone sticks on?",["Nothing, it will release","Release the button and place the microphone where it cannot switch on by accident","Switch off the radio permanently","Keep talking"],1,"A stuck microphone blocks the frequency. Always release the button and stow the microphone safely."],["What is the format of a radio check call?",["Own callsign, station, radio check, frequency","Station, own callsign, RADIO CHECK, frequency","RADIO CHECK, frequency, station","Station, frequency, can you hear me"],1,"Station being called, your identification, RADIO CHECK, then the frequency."],["A controller wants to hand you to a new unit and your details have been passed. Which word do they use?",["FREECALL","CONTACT","CHANGING TO","MONITOR"],1,"CONTACT means your details have been passed. FREECALL means they have not."],["What does the phrase CONFIRM mean?",["I request verification","I agree","Cancel","Wait"],0,"CONFIRM: I request verification of a clearance, instruction, action or information."],["What does DISREGARD mean?",["Ignore","Stop","Cancel the clearance","Repeat"],0,"DISREGARD means ignore."],["Which phrase asks someone to repeat all or part of their last transmission?",["READ BACK","SAY AGAIN","CORRECTION","I SAY AGAIN"],1,"SAY AGAIN. I SAY AGAIN means I repeat for clarity or emphasis."],["Which call do you make to ask about transmission quality?",["HOW DO YOU READ","SAY AGAIN","RADIO ALPHA","ARE YOU THERE"],0,"HOW DO YOU READ: What is the readability of my transmission?"],["Which service uses the callsign suffix RADIO?",["Aerodrome control","Air/ground communication service","Approach","Area control"],1,"RADIO is the suffix for air/ground communication service."],["Which callsign suffix is aerodrome control?",["GROUND","TOWER","APPROACH","DELIVERY"],1,"TOWER is aerodrome control. GROUND is ground movement control."],["You hear a long final report. How far from touchdown is the aircraft?",["Less than 4 NM","More than 4 NM","Exactly 2 NM","Over the threshold"],1,"Long final is reported when the turn onto final is made at more than 4 NM."],["Does LAND AFTER THE (type) clear you to land?",["Yes","No, it is not a landing clearance and you decide whether separation is sufficient","Only in daylight","Only at towered aerodromes"],1,"LAND AFTER is not a landing clearance, you decide if separation is sufficient. It is never given at night."],["Which pair of words distinguishes distress from urgency?",["MAYDAY and PAN PAN","SOS and PAN","SECURITE and MAYDAY","URGENT and MAYDAY"],0,"MAYDAY is distress. PAN PAN is urgency."],["Which condition is distress?",["Threatened by serious and imminent danger and requiring immediate assistance","Concerning the safety of the aircraft but not requiring immediate assistance","Lost but safe","Unsure of weather"],0,"Distress is serious or imminent danger requiring immediate assistance. Urgency concerns safety but does not require immediate assistance."],["Which transponder code means radio failure?",["7500","7600","7700","7000"],1,"7600 is radio failure."],["Which transponder code means hijack?",["7500","7600","7700","7000"],0,"7500."],["Who do you address on 121.5 MHz for an emergency call?",["Tower","London Centre","Approach","Ground"],1,"Emergency calls on 121.5 MHz are addressed to London Centre."],["Should you declare an emergency early or wait to be sure?",["Wait until it is certain","Early, and cancel later if it is not needed","Never on 121.5","Only on tower frequency"],1,"Declare as soon as there is doubt. You can cancel later."],["What is the first thing to check if you cannot reach a station?",["Correct frequency, station open, range and volume","Squawk 7700","Land immediately","Change callsign"],0,"Check frequency, watch hours, range, volume and headset before assuming equipment failure."],["What is the maximum length of a test transmission?",["3 seconds","10 seconds","30 seconds","1 minute"],1,"No more than 10 seconds."]],prow:[["ACKNOWLEDGE","Let me know that you have received and understood this message"],["AFFIRM","Yes"],["APPROVED","Permission for proposed action granted"],["CANCEL","Annul the previously transmitted clearance"],["CONFIRM","I request verification of a clearance, instruction, action or information"],["CORRECTION","An error has been made in this transmission, the correct version is..."],["DISREGARD","Ignore"],["HOW DO YOU READ","What is the readability of my transmission?"],["I SAY AGAIN","I repeat for clarity or emphasis"],["MONITOR","Listen out on a frequency"],["NEGATIVE","No, or permission not granted, or that is not correct"],["READ BACK","Repeat all, or the specified part, of this message back to me exactly as received"],["REPORT","Pass me the following information"],["REQUEST","I should like to know, or I wish to obtain"],["ROGER","I have received your last transmission"],["SAY AGAIN","Repeat all, or the following part, of your last transmission"],["SPEAK SLOWER","Reduce your rate of speech"],["STANDBY","Wait and I will call you. No onward clearance is to be assumed"],["UNABLE","I cannot comply with your request, instruction or clearance"],["WILCO","I understand your message and will comply with it"],["FREECALL","Call the unit, your details have not been passed"],["CONTACT","Establish communications with the unit, your details have been passed"]],rbk:[{atc:"G-CD, taxi holding point A1 runway 14",ok:"Taxi holding point A1 runway 14, G-CD",bad:["Roger, G-CD","Taxi holding point A1, G-CD","Holding point runway 14, wilco"],why:"Taxi instructions are on the mandatory readback list. Read back the whole instruction, including the runway, and finish with your callsign."},{atc:"G-CD, QNH 1003",ok:"QNH 1003, G-CD",bad:["Roger, G-CD","QNH 1013, G-CD","One zero zero three"],why:"Altimeter settings must be read back with your callsign. A wrong number is exactly what a readback catches."},{atc:"G-CD, squawk 4521",ok:"Squawk 4521, G-CD",bad:["Wilco, G-CD","4521","Roger, squawking"],why:"SSR codes are read back in full with your callsign."},{atc:"G-CD, contact Ground 118.050",ok:"Ground 118.050, G-CD",bad:["Wilco","Roger, G-CD","Changing, G-CD"],why:"Frequency changes are read back, including the frequency and your callsign."},{atc:"G-CD, runway 27, cleared to land, surface wind 270 7",ok:"Runway 27 cleared to land, G-CD",bad:["Roger, landing, G-CD","Cleared to land, G-CD","Wilco"],why:"A clearance to land is read back with the runway and your callsign."},{atc:"G-CD, line up and wait runway 24",ok:"Line up and wait runway 24, G-CD",bad:["Lining up, G-CD","Roger, G-CD","Wilco, runway 24"],why:"Clearances to enter a runway must be read back in full, with the runway and your callsign."},{atc:"G-CD, hold position",ok:"Holding, G-CD",bad:["Roger, G-CD","Wilco, G-CD","Standing by, G-CD"],why:"A hold position instruction is acknowledged by saying you are holding, with your callsign."},{atc:"G-CD, runway 24, cleared for take-off, surface wind 220 4",ok:"Runway 24 cleared for take-off, G-CD",bad:["Cleared for take-off, G-CD","Wilco, G-CD","Roger, rolling"],why:"A take-off clearance is read back with the runway and your callsign."},{atc:"G-CD, after departure, left turn approved, climb not above altitude 2500 feet until reaching the zone boundary",ok:"Left turn approved, not above altitude 2500 feet until zone boundary, G-CD",bad:["Left turn, 2500 feet, G-CD","Roger, wilco","Cleared for take-off, G-CD"],why:"Read back the whole departure clearance. Note APPROVED is used here, not CLEARED, and the word DEPARTURE rather than TAKE-OFF."},{atc:"G-CD, report downwind",ok:"Wilco, G-CD",bad:["Downwind, G-CD","Roger, G-CD","Negative, G-CD"],why:"A request to report is not on the mandatory readback list. WILCO says you have received it and will comply. ROGER only means received."},{atc:"G-ABCD, Roger Basic Service, standby for weather",ok:"Basic Service, G-ABCD",bad:["Roger","Standing by, G-ABCD","Wilco, weather please"],why:"The type of ATS service is on the readback list. STANDBY is not an approval or a denial, so there is nothing to comply with."},{atc:"G-CD, negative, QNH 990 hectopascals",ok:"QNH 990 hectopascals, G-CD",bad:["Roger, G-CD","QNH 997 hectopascals, G-CD","Say again, G-CD"],why:"NEGATIVE means your readback was wrong. Read back the corrected version exactly as given."}],calls:[{ctx:"You are at the Borton flying club in Cessna 172 G-ABCD, ready to taxi for a VFR flight to Walden. Call Borton Tower.",ans:["Borton Tower","G-ABCD","Cessna 172","at the flying club","request taxi","VFR to Walden"],dis:["over","please","cleared for take-off"],why:"Station first, then your callsign, then type, position and what you want."},{ctx:"You have done your power checks at the holding point and the tower has already shortened your callsign. Call ready.",ans:["G-CD","ready for departure"],dis:["ready for take-off","over","Tower"],why:"Say DEPARTURE. TAKE-OFF is used only for the take-off clearance itself (CAP 413 2.67)."},{ctx:"You are 10 miles from Walden. Make a radio check on tower frequency 118.700.",ans:["Borton Tower","G-ABCD","radio check","118.700"],dis:["can you hear me","over","Walden Information"],why:"The test transmission format is station, aircraft identification, RADIO CHECK, frequency."},{ctx:"You are overhead Walden at altitude 2500 feet and need to join the circuit. Call Walden Information.",ans:["Walden Information","G-ABCD","request join"],dis:["Walden Tower","cleared to join","over"],why:"Keep the first call short: unit, callsign, request. They reply with pass your message."},{ctx:"Wrayton Information has said G-ABCD, pass your message. You are 15 NM south of Westbury, altitude 2500, QNH 1008, flying Borton to Walden in a Cessna 172, and want Walden weather.",ans:["G-ABCD","Cessna 172","from Borton to Walden","15 NM south of Westbury","altitude 2500 feet","QNH 1008","request Walden weather"],dis:["over","how do you read","Basic Service"],why:"Pass your message: callsign, type, route, position, altitude, pressure setting, then your request."},{ctx:"Give a position report to Wrayton Information: G-ABCD, mid-channel at 25 past the hour, altitude 3500 feet, next reporting point Greenpoint at 40.",ans:["G-ABCD","mid-channel","25","altitude 3500 feet","Greenpoint 40"],dis:["over","roger"],why:"A position report contains identification, position, time, level, then the next position and ETA."},{ctx:"You are leaving Borton Approach's zone and changing to Wrayton Information on 125.750. You have been told to report at the zone boundary.",ans:["G-CD","zone boundary","changing to Wrayton Information 125.750"],dis:["over","goodbye","Borton Approach"],why:"Report the position, then say CHANGING TO and the unit and full six-figure frequency."},{ctx:"After take-off from Borton runway 24 you call Borton Approach, turning left heading 330 degrees, climbing to altitude 2500 feet, QNH 990, en route Walden.",ans:["Borton Approach","G-ABCD","airborne runway 24","turning left heading 330 degrees","climbing to altitude 2500 feet","QNH 990","en route Walden"],dis:["over","Borton Tower"],why:"An airborne report names the unit, your callsign, the runway, your heading, climb and altitude, the pressure setting and where you are going."}],emerg:[{ctx:"Your Cessna 172 G-ABCD has an engine failure 5 miles west of Seaton at 2000 ft, heading 090. You plan a forced landing, you are a student pilot, two on board. You are talking to Seaton Radio.",ans:["MAYDAY MAYDAY MAYDAY","Seaton Radio","G-ABCD","Cessna 172","engine failure","intend forced landing","5 miles west of Seaton, altitude 2000 feet, heading 090","student pilot","2 persons on board"],dis:["over and out","please help"],why:"Order from CAP 413 8.13: prefix, station, callsign, type, nature, intentions, position level and heading, pilot qualifications, then other useful information."},{ctx:"You are lost in a Piper PA-28 G-ABCD, 15 NM north of Westbury at 3500 ft, heading 270, with no instrument qualification. Fuel is fine and there is no immediate danger. Call London Centre on 121.5 and ask for help finding your position.",ans:["PAN PAN PAN PAN PAN PAN","London Centre","G-ABCD","Piper PA-28","uncertain of position","request position fix","15 NM north of Westbury, altitude 3500 feet, heading 270","no instrument qualification"],dis:["MAYDAY MAYDAY MAYDAY","over"],why:"Uncertainty of position without immediate danger is urgency, so PAN PAN. Address London Centre on 121.5."}],scen:[{id:"A",title:"Departing Borton",desc:"Radio check, taxi, readbacks and the first call after take-off, with a tower controller.",steps:[{ctx:"You are in Cessna 172 G-ABCD at the Borton flying club, planning a VFR flight to Walden. Borton Tower is on 118.700 and runway 24 is in use.",q:"Make your first call: check your radio.",opts:["Borton Tower, G-ABCD, radio check 118.700","Borton Tower, radio check please","G-ABCD, Borton Tower, can you hear me?","Hello Borton, test, one two three"],a:0,why:"Radio check format: station, your identification, RADIO CHECK, frequency."},{atc:"G-ABCD, Borton Tower, readability 5",q:"Tell the tower you are starting up and want departure information.",opts:["Borton Tower, G-ABCD, Cessna 172 starting, request departure information","Borton Tower, G-ABCD, ready for take-off","Borton, Cessna 172 starting up","G-ABCD, requesting the weather, over"],a:0,why:"Say who you are calling, your callsign, your type, what you are doing and what you want."},{atc:"G-CD, departure runway 24, surface wind 220 6, QNH 990 hectopascals, temperature +6, dew point +3",q:"Reply.",opts:["Runway 24, QNH 990 hectopascals, G-CD","Runway 24, QNH 997 hectopascals, G-CD","Roger, G-CD","Wilco, runway 24"],a:0,why:"Runway in use and altimeter setting must be read back, ending with your callsign. Tower has now shortened your callsign so you may too."},{ctx:"You are ready to move off the stand.",q:"Request taxi.",opts:["Borton Tower, G-CD, Cessna 172 at the flying club, request taxi for VFR flight to Walden","Borton Tower, G-CD, taxiing to runway 24 now","G-CD, can I go now?","Borton Ground, G-CD, request taxi"],a:0,why:"Request taxi with your position and intention. There is only a Tower here, so Ground is the wrong unit."},{atc:"G-CD, taxi holding point G1 runway 24 via taxiway Charlie, QNH 990 hectopascals",q:"Reply.",opts:["Holding point G1 runway 24 via taxiway Charlie, QNH 990 hectopascals, G-CD","Taxi holding point G1, G-CD","Roger, G-CD","Wilco, via Charlie"],a:0,why:"Taxi instructions are read back in full, with the QNH, and your callsign."},{ctx:"You have completed power checks at holding point G1.",q:"Tell the tower you are ready.",opts:["G-CD, ready for departure","G-CD, ready for take-off","G-CD, entering the runway","G-CD, at G1, over"],a:0
