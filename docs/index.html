and x1.35, soft ground or snow x1.25, then general x1.33 for take-off and x1.43 for landing","Do not operate if factored distances exceed distances available","Do not fly if the climb would be under <code>500 ft/min</code> in a typical single, or <code>150 ft/min</code> on a twin with one engine failed. Vx is slower than Vy and gives the better gradient"]],["Flight plans",["A flight plan is required for flights across international borders, flights under an ATC service (entering CAS or leaving a controlled aerodrome), and leaving the vicinity of an aerodrome at night","'Booking out' fulfils the night abbreviated flight plan if an ATSU can receive it. Otherwise file a full plan","Full plans go via AFTN. Abbreviated plans can be given by radio or phone and are not passed to other units","Filing is recommended over water more than <code>10 NM</code> from the UK coast, to the Scottish Highlands and Islands, and over sparse areas"]],["Unfamiliar aerodromes",["The AIP covers licensed or certificated aerodromes only. Unlicensed information may be unverified","Ask about PPR, local procedures, surface (long, wet or soft grass), usable length, obstacles, wind effects, noise abatement and other hazards","Do the same for alternates. Considering alternates is often overlooked in GA"]]],cards:[["Recommended minimum fuel at landing for VFR non-Part 21 aircraft?","Not less than 30 minutes."],["Best way to check fuel on board?","Physically with a dipstick or equivalent."],["What does a fuel totaliser measure?","Fuel consumed by the engine, not tank contents."],["Specific gravity of Avgas?","About 0.72 kg/L."],["Specific gravity of Jet A-1 in the Skyway Code?","About 0.82 kg/L."],["Climb rate below which not to fly in a single piston aircraft?","500 ft/min."],["Climb rate minimum on a twin with one engine failed?","150 ft/min."],["When must a flight plan be filed?","International flights, under ATC service, and leaving the aerodrome vicinity at night."],["What is an abbreviated flight plan?","Information to an ATSU by radio or phone for part of a flight."],["Over-water distance from the UK coast where a flight plan is recommended?","More than 10 NM."],["Does the AIP cover unlicensed aerodromes?","No, only licensed or certificated ones."],["Which speed gives the better climb gradient for obstacles?","Vx."]],quiz:[["What minimum fuel at landing is recommended for a VFR flight in non-Part 21 aircraft?",["10 minutes","30 minutes","45 minutes","60 minutes"],1,"Part 21 aircraft have specific reserves, but for others 30 minutes is recommended."],["A flight plan is required when:",["Flying over any water","Leaving the vicinity of an aerodrome at night","Flying above 3,000 ft","Flying solo"],1,"Booking out can satisfy this if an ATSU receives it."],["Which is the most reliable fuel quantity check?",["Fuel gauge","Totaliser","Dipstick or equivalent","Fuel flow estimate"],2,"Gauges are not sufficiently reliable for planning."],["A twin with one engine failed should not operate if it climbs below:",["50 ft/min","150 ft/min","500 ft/min","1,000 ft/min"],1,"150 ft/min on a twin with an engine failed; 500 ft/min for singles."],["Which is true of the general safety factors?",["Applied before other factors","Applied after other factors: x1.33 take-off, x1.43 landing","Apply only to paved runways","Apply only to twins"],1,"Apply them after surface factors."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.46-55","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]},{s:0,topic:"Rules of the Air essentials (Skyway Code)",order:30,conf:"weak",status:"draft",summary:"The pilot in command has final authority, is responsible for compliance even when not at the controls, and must not fly impaired by psychoactive substances. Do not fly closer than 500 ft to any person, vessel, vehicle or structure, and over congested areas stay at least 1,000 ft above the highest obstacle within 600 m. In the air, head-on both turn right, converging the aircraft with the other on its right gives way, and the aircraft being overtaken has right of way. Built from the Skyway Code pp.57-63.",sections:[["Which rules apply",["UK Standardised Rules of the Air (UK SERA), the UK Rules of the Air Regulations 2015 and general permissions (see ORS4)","In another state comply with both your state of registry's rules and the state you are in, whichever is more limiting. If they conflict the rules of the state you are in take precedence"]],["Pilot in command",["Has final authority over the aircraft and is always responsible for compliance, even if not touching the controls","May depart from the rules only if absolutely necessary for safety","Must be familiar with all available information and study weather and fuel and an alternative course of action for flights away from the aerodrome","Must not act while under the influence of a psychoactive substance that impairs performance"]],["Low flying and congested areas",["Unless taking off or landing, do not fly closer than <code>500 ft</code> to any person, vessel, vehicle or structure","Over congested areas or open-air assemblies stay at least <code>1,000 ft</code> above the highest obstacle within <code>600 m</code>, and high enough to land clear of people and property in an emergency","UK exceptions include practice approaches, published low-level routes, Special VFR, hill soaring gliders and permitted events","Do not take off or land in a congested area except at an aerodrome, or within 1,000 m of an open-air assembly of more than 1,000 people","Aerobatics over congested areas are not allowed. Single-engine pilots should be able to glide clear of congested areas"]],["Right of way in the air",["Do not fly close to other aircraft so as to cause a collision hazard","<b>Head-on</b>: both turn right","<b>Converging</b>: the aircraft that has the other on its right gives way ('on the right, in the right')","<b>Overtaking</b>: the aircraft being overtaken has right of way, and the overtaker passes to the right, keeping clear. Overtaking exists within 70° of the other's extended centreline. Sailplanes may pass either side","Priority order when converging: balloons, gliders, airships, then aircraft towing, then powered aircraft last (powered aircraft give way to all others)","Landing aircraft have priority. The lower aircraft has priority when two approach to land, but do not cut in front of one already on final. An aircraft compelled to land has priority","Following a line feature on the right side is good practice but no longer mandatory"]],["Right of way on the ground",["Head-on: both stop and turn right","Converging: the aircraft that has the other on its right gives way","Overtaking: the overtaken aircraft has right of way and the overtaker may pass left or right","Taxiing aircraft give way to aircraft taking off or about to take off","Aircraft have priority over vehicles. Emergency vehicles have priority over all surface traffic"]]],cards:[["Who has final authority over the aircraft?","The pilot in command."],["Closest approach allowed to any person, vessel, vehicle or structure (not taking off or landing)?","500 ft."],["Minimum height over congested areas?","1,000 ft above the highest obstacle within 600 m."],["Head-on in the air?","Both turn right."],["Converging aircraft: who gives way?","The one that has the other on its right."],["Overtaking aircraft pass on which side?","The right (sailplanes may pass either side)."],["Overtaking sector angle?","Within 70° either side of the extended centreline."],["Who gives way, a powered aircraft or a glider?","The powered aircraft."],["Who has priority when two aircraft approach to land?","The lower one, but do not cut in front of one on final."],["Head-on on the ground?","Both stop and turn right."],["Which aircraft taxiing give way to?","Aircraft taking off or about to take off."],["Which vehicles have priority over all surface traffic?","Emergency vehicles assisting an aircraft in distress."]],quiz:[["Two aeroplanes approach head-on. Each should:",["Turn left","Turn right","Climb","Descend"],1,"Both alter course to the right."],["You are converging with an aircraft on your right. You should:",["Maintain course","Give way","Turn left","Overtake"],1,"The aircraft that has the other on its right gives way."],["Over a congested area your minimum height is:",["500 ft above ground","1,000 ft above the highest obstacle within 600 m","1,500 ft above ground","2,000 ft AMSL"],1,"It is also high enough to land clear in an emergency."],["Who has priority among these in the air?",["A glider over a powered aeroplane","A powered aeroplane over a balloon","An airship over a glider","A powered aircraft over towing aircraft"],0,"Powered heavier-than-air aircraft give way to gliders."],["An aircraft is being overtaken. It has:",["No right of way","Right of way","Right of way only on the ground","To give way"],1,"The aircraft being overtaken has right of way."],["Where may you not take off or land in the UK without special permission?",["Aerodrome","Congested area (outside an aerodrome)","Licensed strip","ATZ"],1,"Take-off and landing in a congested area need aerodrome procedures or CAA permission."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.57-63","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]},{s:0,topic:"VFR, IFR and Special VFR (Skyway Code)",order:35,conf:"weak",status:"draft",summary:"VMC minima depend on height and airspace class. At and above FL100 the minimum is 8 km visibility, 1,500 m horizontally and 1,000 ft vertically from cloud. Below FL100 it is 5 km with the same cloud distances, with UK exceptions for class D and class G at 140 kt IAS or less. VFR at night requires a cloud ceiling of at least 1,500 ft. Special VFR in a CTR needs 1,500 m visibility, clear of cloud, in sight of the surface and 140 kt IAS or less. Built from the Skyway Code pp.64-67.",sections:[["VMC minima",["At and above <code>FL100 / 10,000 ft</code> (all classes): <code>8 km</code> visibility, <code>1,500 m</code> horizontally and <code>1,000 ft</code> vertically from cloud","Below FL100 and above 3,000 ft AMSL or 1,000 ft above terrain, whichever is higher: <code>5 km</code>, same cloud distances","At and below 3,000 ft AMSL or 1,000 ft above terrain (classes A to E): 5 km, 1,500 m horizontal and 1,000 ft vertical. Class F and G: 5 km, clear of cloud and in sight of the surface","<b>Class D exception (UK)</b>: by day at or below 3,000 ft AMSL, in sight of the surface and at 140 kt IAS or less you may fly clear of cloud, with 5 km visibility (1,500 m for helicopters)","<b>Class G exception (UK)</b>: 5 km may reduce to 1,500 m by day in sight of the surface at 140 kt IAS or less","VFR is not permitted in class A","VMC minima exist to avoid other traffic (e.g. class E cloud rules keep VFR from IFR traffic)"]],["Other VFR requirements",["A VFR flight may not take off or land in a CTR, or enter the ATZ or circuit, if the reported cloud ceiling is under <code>1,500 ft</code> or ground visibility under <code>5 km</code>. Request Special VFR instead","VFR flights may not operate above <code>FL195</code> unless authorised","SERA VFR cruising levels are not mandatory in the UK"]],["VFR at night (UK)",["Same visibility and cloud rules as by day, except the 1,500 m class G reduction is not permitted","Cloud ceiling must be at least <code>1,500 ft</code>","Be in sight of the surface at or below 3,000 ft AMSL or 1,000 ft above terrain","Never fly lower than 500 ft above ground or water, or 500 ft above the highest obstacle within 150 m. Over congested areas stay 1,000 ft above the highest obstacle within 600 m","Submit a flight plan if leaving the vicinity of the aerodrome, and use an air traffic service if available","En-route obstacles 150 m (490 ft) or more AGL are lit at night"]],["Special VFR (SVFR)",["Allows flight in a CTR below VMC minima without complying with IFR. Subject to ATC separation from IFR and other SVFR flights","Minimum to accept a clearance: clear of cloud, in sight of the surface, flight visibility not less than <code>1,500 m</code> (<code>800 m</code> helicopters) and <code>140 kt</code> IAS or less","For take-off or landing in the CTR, reported ground visibility must be at least 1,500 m (800 m helicopter) or a cloud ceiling of <code>600 ft</code>","SVFR at night is permitted in the UK. Some aerodromes have local flying areas with standard SVFR arrangements"]],["IFR",["You must fly IFR if below VMC minima (unless in a CTR with SVFR clearance). Class A is IFR only","IFR requires a valid instrument qualification","IFR flights fly at least 1,000 ft (2,000 ft in mountainous areas) above the highest obstacle within 8 km (5 NM), except for take-off or landing","Outside CAS, IFR cruising levels apply above 3,000 ft AMSL in the UK"]]],cards:[["VMC visibility at and above FL100?","8 km."],["Horizontal and vertical cloud clearance in SERA VMC?","1,500 m horizontally and 1,000 ft vertically."],["Class D exception conditions?","By day at or below 3,000 ft AMSL, in sight of the surface at 140 kt IAS or less."],["Class G visibility reduction in the UK?","5 km to 1,500 m by day, in sight of the surface at 140 kt IAS or less."],["Is VFR permitted in class A?","No."],["Cloud ceiling needed to take off or land in a CTR under VFR?","At least 1,500 ft, with 5 km ground visibility."],["Upper limit for VFR flights unless authorised?","FL195."],["Cloud ceiling needed for VFR at night?","At least 1,500 ft."],["Minimum visibility for SVFR (aeroplane)?","1,500 m, clear of cloud and in sight of the surface."],["Maximum speed for SVFR?","140 kt IAS."],["Minimum reported ceiling to take off or land under SVFR?","600 ft (or ground visibility 1,500 m)."],["IFR terrain clearance outside mountainous areas?","1,000 ft above highest obstacle within 8 km."]],quiz:[["In Class E at FL100 or above the VFR visibility minimum is:",["5 km","8 km","10 km","1,500 m"],1,"8 km at or above FL100."],["In class G by day at 120 kt IAS and in sight of the surface, the UK visibility minimum can reduce to:",["800 m","1,500 m","3 km","5 km"],1,"1,500 m by day, clear of cloud and in sight of the surface at 140 kt IAS or less."],["The reported ceiling below which VFR cannot be used to land in a CTR is:",["600 ft","1,000 ft","1,500 ft","2,500 ft"],2,"Below 1,500 ft ceiling or 5 km ground visibility, request Special VFR."],["Special VFR minima for an aeroplane include:",["800 m visibility","1,500 m visibility and 140 kt IAS or less","5 km visibility","FL100"],1,"Clear of cloud, in sight of the surface, 1,500 m and 140 kt or less."],["Which statement is true about night VFR in the UK?",["The 1,500 m class G reduction still applies","Minima are the same as by day, except no 1,500 m reduction","VFR is not allowed","Ceiling of 600 ft is enough"],1,"The reduced class G visibility is not permitted at night."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.64-67","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]},{s:0,topic:"Airspace, ATZ, MATZ and transponders (Skyway Code)",order:40,conf:"weak",status:"draft",summary:"An ATZ is a cylinder of 2 NM radius when the longest runway is 1,850 m or less, 2.5 NM otherwise, extending 2,000 ft above the aerodrome. A MATZ is not controlled airspace for civilians but contact is strongly recommended. Most UK GA controlled airspace is class D (CTRs and CTAs) with class A for airways and TMAs. Transponders should be on with altitude reporting (squawk 7000 VFR), and Mode S is needed in class A and C, above FL100 and in TMZs. Built from the Skyway Code pp.68-72 and 84-89.",sections:[["Airspace structure",["ICAO classes A to G exist but in UK airspace A, C, D, E and G are notified","<b>Class A</b>: IFR only, clearance required, ATC service and separation for all flights","Most controlled airspace GA meets is class D: <b>CTRs</b> (surface to about 2,500 ft AMSL or higher) and <b>CTAs</b> (base about 1,500 ft AMSL, overlying CTRs)","<b>TMAs</b> cover several busy aerodromes and are normally class A (the Scottish TMA is an exception)","<b>Airways</b> link structures and are normally class A. Some in Scotland are class E with a transponder mandatory zone, giving VFR access without clearance","In class D there is no formal ATC separation of VFR from other traffic, only traffic information"]],["ATZ and aerodromes without one",["An ATZ is a cylinder around an aerodrome: <code>2 NM</code> radius if the longest runway is <code>1,850 m or less</code>, <code>2.5 NM</code> if longer, up to <code>2,000 ft</code> above the aerodrome","You may cross an ATZ en route if you comply with Rule 11: with ATC permission is needed, with AFIS or AGCS get information","Some aerodromes without an ATZ are shown with a circle and <b>T</b> (intensive training) or <b>U</b> (unusual activity such as aerobatics or formation)"]],["MATZ",["A MATZ is <b>not controlled airspace</b> for civilians but contains high-performance military aircraft, so contact the unit before entering","It contains an ATZ: never enter that ATZ without a positive clearance","Standard MATZ: 5 NM radius, 3,000 ft above airfield level, with two STUBS and LARS frequency","Request a 'MATZ penetration service' about 10 minutes flying time ahead. If there is no reply after two attempts you may enter with caution","MATZ are often inactive at weekends but check. Downwind and base legs of the radar training circuit can lie outside the MATZ"]],["Requesting a transit",["Start with the request: for example 'Solent Radar, G-DOME, request Basic Service and zone transit'","On 'pass your message', give type, route, position, altitude and QNH. 'Standby' needs no acknowledgement","Read back the squawk, altitude limits and service, and acknowledge future instructions with 'wilco'","Remain clear until cleared. If no clearance is likely, alter course away positively"]],["Transponder",["Squawk <code>7000</code> VFR or <code>2000</code> IFR. Select Mode C (ALT) at all times","Emergency codes: <code>7700</code> emergency, <code>7600</code> radio failure, <code>7500</code> unlawful interference, <code>0030</code> lost","Frequency Monitoring Codes show you are listening on a frequency. Reset to conspicuity afterwards","If you carry a serviceable transponder SERA requires it selected on with altitude. It can be turned off only on ATC direction, in airspace not needing carriage, or to save power","<b>Mode S Elementary Surveillance</b> is needed in class A or C airspace, above FL100 and in TMZs"]]],cards:[["ATZ radius for a runway of 1,850 m or less?","2 NM."],["ATZ radius for a runway over 1,850 m?","2.5 NM."],["ATZ height?","Up to 2,000 ft above the aerodrome."],["What do T and U mean on a chart circle?","T is intensive training, U is unusual activity such as aerobatics or formation."],["Is a MATZ controlled airspace for civil aircraft?","No."],["Standard MATZ dimensions?","5 NM radius, 3,000 ft above airfield level."],["Can you enter the ATZ within a MATZ without clearance?","No."],["Which class is a typical UK CTR?","Class D."],["Which class are airways and TMAs?","Normally class A."],["VFR conspicuity squawk?","7000."],["Squawk for lost?","0030."],["Where is Mode S ES required?","Class A and C, above FL100, and TMZs."]],quiz:[["The ATZ around an aerodrome with a 1,500 m runway has a radius of:",["1 NM","2 NM","2.5 NM","3 NM"],1,"Runways of 1,850 m or less give a 2 NM ATZ."],["A MATZ is:",["Controlled airspace","Not controlled airspace for civilians, but contact is strongly recommended","Prohibited","Class A"],1,"Contact the unit before entering and never enter the ATZ without clearance."],["Which class is most GA controlled airspace in the UK?",["A","B","D","F"],2,"CTRs and CTAs are normally class D."],["Which squawk shows a lost aircraft?",["7500","7600","0030","2000"],2,"0030 is the UK lost code."],["A circle with a T on the VFR chart means:",["Transit allowed","Intensive training","Tower","TMZ"],1,"T denotes intensive use for training flights."],["Mode S Elementary Surveillance is required:",["In class G","In class A or C airspace, above FL100 and in TMZs","Only at night","Only IFR"],1,"Those are the circumstances listed by the Skyway Code."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.68-72, 84-89","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]},{s:6,topic:"Aerodrome operations and circuits (Skyway Code)",order:30,conf:"weak",status:"draft",summary:"At aerodromes you observe other traffic, conform with the circuit, turn left unless told otherwise, and land and take off into wind. You may not land on an occupied runway without ATC authority. During notified watch hours you may not operate in an ATZ without permission (ATC) or information (AFIS/AGCS), and you must report position and height entering and leaving. Joining aircraft give way to traffic in the circuit. Built from the Skyway Code pp.96-99.",sections:[["Operating rules (SERA.3225)",["Observe other traffic to avoid collision, conform with or avoid the circuit pattern","All turns to the <b>left</b> when approaching to land or take off unless otherwise indicated","Land and take off <b>into wind</b> unless safety dictates otherwise","On landing, leave clear to your left any other aircraft landing or about to take off, and move clear of the landing area as soon as possible","When taking up position for take-off leave clear on your left any aircraft that has taken off or is about to"]],["ATZ rules (Rule 11 and 12)",["Rule 10: do not land on a runway occupied by another aircraft unless authorised by ATC","Rule 11: during notified hours of ATC, AFIS or AGCS, do not operate within an ATZ unless you have permission (ATC) or have obtained information (AFIS or AGCS)","Keep a continuous watch on the frequency or for visual signals and transmit position and height on entering or leaving the ATZ","Rule 12: do not taxi on the manoeuvring area of an uncontrolled aerodrome without the permission of the person in charge or the AFIS unit"]],["The circuit",["Legs: crosswind, downwind, base, final, with the liveside and deadside","Standard radio calls at downwind and final. Also announce base or late downwind if it helps situational awareness","Joining aircraft give way to traffic already established","Always make position calls even if you know of no other traffic, with blind calls if no AGCS or AFIS. Non-radio aircraft are a possibility","If in doubt on local procedure, ask by phone or radio. AFIS and AGCS will not give instructions to airborne aircraft"]],["Departure procedures",["Obtain runway in use, circuit direction and QNH or QFE before taxiing. Larger aerodromes provide ATIS: quote the information letter","At a controlled aerodrome request permission to taxi. At an AGCS aerodrome no taxi clearance is needed but you must have the permission of the person in charge. At an AFIS aerodrome request taxi instructions","Complete power and pre-take-off checks at the holding point before saying 'ready for departure'","At an AFIS aerodrome the service reverts to information only: the pilot ensures it is safe to enter the runway","At an ATC aerodrome you must not enter the runway without clearance (take-off clearance or 'line up and wait')","Stop at an angle at the holding point for a good view of the approach, particularly in a high-wing aircraft","Report leaving the ATZ. At large aerodromes, moving-map aerodrome charts are helpful. <b>Hot spots</b> are circled in red on charts"]]],cards:[["Which way do you turn in the circuit unless told otherwise?","Left."],["Which direction do you land and take off?","Into wind unless safety dictates otherwise."],["What does Rule 10 say about runways?","Do not land on an occupied runway unless authorised by ATC."],["What does Rule 11 apply to?","Operating within an ATZ during notified hours of watch."],["What does Rule 12 apply to?","Taxiing on the manoeuvring area of an uncontrolled aerodrome."],["Do you need a taxi clearance at an AGCS aerodrome?","No, but you need the permission of the person in charge."],["What do you request at an AFIS aerodrome before taxiing?","Taxi instructions."],["Who must you give way to when joining the circuit?","Traffic already established."],["What must be transmitted on entering or leaving an ATZ?","Aircraft position and height."],["What are hot spots on aerodrome charts?","Holding points vulnerable to runway incursion, circled in red."],["Which clearance allows runway entry at an ATC aerodrome?","Take-off clearance or 'line up and wait'."],["What must you call after departing the ATZ?","Report leaving the ATZ."]],quiz:[["Unless told otherwise, circuit turns are:",["Right","Left","Either","Depends on wind"],1,"All turns left when approaching to land or take off unless indicated."],["At an AFIS aerodrome, when you report 'ready for departure':",["You receive a take-off clearance","The service reverts to information only and you ensure it is safe","ATC separates you","You must hold"],1,"AFIS gives information, not clearances, once you are at the holding point."],["Rule 11 requires, in an ATZ with an AGCS, that you:",["Get permission","Obtain appropriate information","Hold off","Squawk 7700"],1,"For AFIS or AGCS you get information, with ATC you get permission."],["Joining traffic must:",["Have priority","Give way to traffic already in the circuit","Join on final","Squawk ident"],1,"Joining aircraft give way to established traffic."],["Before taxiing at an aerodrome with ATIS, you should quote:",["The QFE","The information letter on first contact","The squawk","Fuel on board"],1,"Give the ATIS letter on first contact with ATC."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.96-99","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]},{s:6,topic:"Emergencies (Skyway Code)",order:35,conf:"weak",status:"draft",summary:"Know your aircraft's checklists, fly the aircraft, assess, then declare an emergency in good time (on 121.5 MHz if not talking to anyone). The call format follows MAYDAY or PAN PAN three times, station, callsign, type, nature, intentions, position, altitude, heading and other information. D&D at London Area Control Centre can give fast position fixes. After engine failure land ahead after take-off and use a constant-aspect approach to a field. Built from the Skyway Code pp.136-141.",sections:[["Key principles",["Know the AFM checklists for time-critical emergencies by heart","<b>Fly the aircraft</b>: accidents often happen when a non-lethal problem distracts from flying. Keep a safe flying speed","<b>Assess</b> before acting. Do not jump to conclusions","<b>Declare</b> an emergency in good time. It is easier to cancel than to start too late. If not with an ATSU use <code>121.5 MHz</code>","Select <code>7700</code>. 'Mayday out' means no reply needed"]],["Mayday and Pan call format",["Distress: 'Mayday' three times. Urgency: 'Pan Pan' three times","Then: station addressed, callsign, aircraft type, nature of emergency, intentions, position, altitude, heading, other information (persons on board, pilot qualifications)","There is no ICAO requirement to include pilot qualifications but doing so helps UK controllers"]],["Distress and Diversion Cell (D&D)",["The emergency centre at the London Area Control Centre, available <b>24 hours</b> to pilots in UK airspace in distress or with difficulties such as being unsure of position","Can give accurate position fixes by direction finding. Instant fixes are available in the London FIR at or above <code>3,000 ft</code> AMSL over land east of Wales and south of Manchester, and in the Scottish FIR at or above 8,500 ft","Also takes practice calls ('Practice PAN' three times) and training fixes if no real emergency is in progress"]],["Lost, comms and electrical failure",["<b>Lost</b>: squawk <code>0030</code>, ask a radar ATSU or call D&D on 121.5, orbit a landmark and do not fly aimlessly","<b>Comms loss</b>: check volume, squelch, frequency and audio panel first, then set <code>7600</code>, stay in VMC and consider a quiet aerodrome outside CAS. Overhead observe the signal square and light signals","<b>Electrical failure</b>: alternator failure is common and the battery may give about 20 minutes. Reduce load, expect to lose the radio, know which systems are electric (flaps)"]],["Engine failure and field selection",["Know your best glide speed and procedure","Shortly after take-off <b>land ahead</b>, rather than turning back","With height check common causes: fuel selection and carb icing","With a partial failure decide positively between a field and an aerodrome","Field choice: wind (into wind), size (bigger), surroundings (power lines), shape (square), surface (grass is better than ploughed fields or crops) and slope (avoid)","<b>Constant aspect</b> approach: enter the pattern, assess the visual angle at about 45°, keep that angle constant by tightening or widening the turn, aim further in if using full flap or gear, and side slip or S-turn if high"]],["Fire and ditching",["Fire on the ground: usually when starting. Cut mixture and fuel, keep cranking with the throttle open to draw fire back, otherwise leave upwind","Fire in the air: engine or electrical. Shut down and force land. Do not reset a circuit breaker more than once","Ditching: wear lifejackets (belt over the jacket) and carry a liferaft for significant water crossings. In winter you are unlikely to survive more than an hour immersed unless in a survival suit"]]],cards:[["What frequency do you use if not talking to an ATSU in an emergency?","121.5 MHz."],["What squawk shows an emergency?","7700."],["What does 'Mayday out' mean?","No further reply is needed."],["What is D&D?","The Distress and Diversion Cell at London Area Control Centre."],["When is D&D available?","24 hours a day."],["Squawk if lost?","0030."],["Squawk for radio failure?","7600."],["How long might a battery last after alternator failure?","Perhaps 20 minutes."],["What to do after engine failure just after take-off?","Land ahead rather than turn back."],["Best field surface?","Grass, better than ploughed fields or crops."],["What is a constant-aspect approach?","Keep the visual angle to the landing spot constant by adjusting the turn."],["Maximum circuit breaker resets for a suspected fire risk?","Never reset more than once."],["Immersion survival time in winter without a suit?","Unlikely more than an hour."]],quiz:[["If not talking to a ATSU and you have an emergency, call on:",["118.0","121.5","123.45","135.48"],1,"121.5 MHz is the emergency frequency monitored by D&D."],["In the call order, after the station you give:",["Intentions","Callsign, then aircraft type","Position","Fuel"],1,"Station, callsign, type, nature, intentions, position, altitude, heading, other information."],["After engine failure just after take-off you should:",["Turn back","Land ahead","Climb","Stretch the glide"],1,"Landing ahead is safer than attempting a turn back."],["After alternator failure the battery may give about:",["2 minutes","20 minutes","2 hours","Unlimited power"],1,"Reduce loads to extend it."],["Radio failure: before concluding you have a failure you should check:",["Nothing","Volume, squelch, frequency and audio selector panel","Only the squawk","Fuel"],1,"Many apparent failures are caused by incorrect settings."],["Which is a good forced-landing field surface?",["Ploughed field","Crops","Grass","Steep slope"],2,"Grass is one of the better surfaces."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.136-141","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]},{s:3,topic:"Decision making and threat and error management (Skyway Code)",order:30,conf:"weak",status:"draft",summary:"Good decisions start before flight. Use PAVE (Pilot, Aircraft, EnVironment, External pressures) and I AM SAFE, ask 'what if?', and avoid time pressure. Threat and error management (TEM) has three elements: threats, errors and undesired aircraft states, and aims to manage them rather than eliminate them. Threats are anticipated, unanticipated or latent. Errors are handling, procedural or communication. Distraction and overload are common causes. Built from the Skyway Code pp.122-125.",sections:[["Pre-flight decisions",["Use a pre-flight checklist and consider the <b>cumulative</b> effect of risk factors. The decision to start the flight is often the most critical","<b>PAVE</b>: <b>P</b>ilot (recency, fitness, I AM SAFE), <b>A</b>ircraft (airworthiness, limits), En<b>V</b>ironment (weather, aerodrome, terrain), <b>E</b>xternal pressures (time, delays, passengers)","Gather NOTAMs and weather, think about how it will evolve and identify diversion aerodromes, not just a return to the start","Always ask 'what if?' and take positive decisions: do not wait 'hoping it will be OK'","Match the flight to your recent experience. Arrive in good time and remove distractions. Check the weather and NOTAMs the evening before for an early flight, then again on the day"]],["Stress and in-flight decisions",["If stressed, fatigued or unsure of fitness, defer the flight or fly with an instructor","Major emotional events such as bereavement can reduce focus below a safe level. Chronic stress signs: poor sleep, appetite, indigestion, irritability, poor concentration","Think a few minutes ahead of the aircraft and use quiet periods for routine checks","Monitor the wider weather: if you are being forced lower, a new plan is needed","In most non-normal situations pause and assess before reacting, unless the aircraft is in immediate danger. Emergencies such as engine failure need rehearsed procedures"]],["Threat and error management",["TEM is 'defensive flying'. It aims to manage threats and errors, not to eliminate them","Three elements: <b>threats</b>, <b>errors</b> and <b>undesired aircraft states</b> (an unsafe attitude, configuration or location)","<b>Threats</b> are outside the pilot's direct influence: <b>anticipated</b> (poor forecast, dense VFR traffic, short runway, known fault), <b>unanticipated</b> and <b>latent</b> (time pressure, fatigue, insufficient skill, poor safety attitude)","<b>Errors</b> are actions or inactions that reduce safety: <b>aircraft handling</b>, <b>procedural</b> or <b>communication</b>","Handling errors reflect low recency. Procedural and communication errors often come from poor checklist discipline or RT proficiency","A common cause of all error types is <b>distraction and overload</b>. Mitigate with planning, anticipation, task prioritisation and removing distractions"]]],cards:[["What does PAVE stand for?","Pilot, Aircraft, EnVironment, External pressures."],["What does TEM stand for?","Threat and error management."],["What are the three elements of TEM?","Threats, errors and undesired aircraft states."],["What is an undesired aircraft state?","An unsafe attitude, configuration or location."],["Name the three categories of threat.","Anticipated, unanticipated and latent."],["Give an example of a latent threat.","Time pressure, fatigue, insufficient skill or poor safety attitude."],["Name three types of error.","Aircraft handling, procedural and communication."],["What is a common cause of all error types?","Distraction and mental overload."],["What should you avoid when deciding to fly?","Waiting 'to see what happens' or 'hoping it will be OK'."],["What does TEM aim to do?","Manage threats and errors, not eliminate them."],["What should you do in most non-normal situations?","Pause and assess before reacting, unless in immediate danger."],["What should you do if stressed or fatigued?","Defer the flight or fly with an instructor."]],quiz:[["In PAVE, the E for External pressures includes:",["Engine","Time pressure and passengers","Weather","Fuel"],1,"Time pressure, delays and passengers are external pressures."],["A forecast of poor weather is which kind of threat?",["Latent","Anticipated","Unanticipated","Error"],1,"It is known in advance."],["Fatigue and time pressure are examples of:",["Unanticipated threats","Latent threats","Handling errors","Undesired aircraft states"],1,"Latent threats are background factors."],["A procedural error often comes from:",["Insufficient checklist discipline","Excess altitude","Engine icing","Radar"],0,"Procedural and communication errors link to checklist and RT discipline."],["TEM is best described as:",["Eliminating all risk","Defensive flying that manages threats and errors","A navigation method","An emergency drill"],1,"TEM aims to manage them more effectively."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.122-125","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]}]),Object.assign(a,{"F215, F214 and GAMET":"Low-level chart, upper winds chart and plain-text GA forecast.","Reading TAFs and METARs":"Decode wind, visibility, cloud, TEMPO and PROB groups.","Icing in the Skyway Code":"Airframe ice 0°C to -15°C, carb ice and alternate air.","Making the weather decision":"Ceiling, cloud base and why minima are limits.","The PLOG":"Contents of a pilot's log and why to plot a paper chart.","Maximum Elevation Figure and safety altitude":"MEF derivation and a 500 or 1,000 ft margin.","Choosing a cruising altitude":"Random altitudes and the 3 NM per 1,000 ft descent rule.","Avoiding infringements":"Take 2, FMCs and correct altimeter settings.","Planning a transit of CAS":"Request 10 minutes ahead with a plan B.","Four pressure settings":"QNH, QFE, RPS and 1013 and the 27 ft per hPa figure.","Transition altitude and level":"3,000 ft outside CAS, 5,000 or 6,000 ft in and below CAS.","Recommended procedure":"Use the local QNH and 1013 near flight-level airspace.","Fuel management":"Dip the tanks, trust no gauge and plan 30 minutes minimum.","Mass and balance reminders":"CG maths, fuel density and checks at landing.","Performance reminders":"Safety factors and minimum climb rates.","Flight plans":"When one is required and the abbreviated versus full forms.","Unfamiliar aerodromes":"What to ask before landing somewhere new.","Which rules apply":"UK SERA plus the Rules of the Air Regulations 2015.","Pilot in command":"Final authority and responsibility for compliance.","Low flying and congested areas":"500 ft and 1,000 ft within 600 m rules.","Right of way in the air":"Head-on, converging, overtaking and landing priorities.","Right of way on the ground":"Taxiing priorities and vehicles.","VMC minima":"Visibility and cloud distances with the UK class D and G exceptions.","Other VFR requirements":"CTR conditions and the FL195 ceiling.","VFR at night (UK)":"Minima and ceiling of 1,500 ft.","Special VFR (SVFR)":"1,500 m, clear of cloud, 140 kt.",IFR:"Class A and instrument qualification.","Airspace structure":"Class A, CTR, CTA, TMA and airways.","ATZ and aerodromes without one":"2 or 2.5 NM and 2,000 ft, plus T and U circles.",MATZ:"Not controlled airspace, but contact first.","Requesting a transit":"Request, pass message, read back and wilco.",Transponder:"7000, emergency codes, FMCs and Mode S.","Operating rules (SERA.3225)":"Left turns, into wind and leave clear to the left.","ATZ rules (Rule 11 and 12)":"Permission or information in the ATZ, and taxiing rules.","The circuit":"Legs, calls and giving way when joining.","Departure procedures":"Runway in use, taxi, hold, ready and report leaving the ATZ.","Key principles":"Fly, assess, declare, and use 121.5 when not with an ATSU.","Mayday and Pan call format":"Station, callsign, type, nature, intentions and position.","Distress and Diversion Cell (D&D)":"24-hour London centre for fixes and help.","Lost, comms and electrical failure":"0030, 7600 and about 20 minutes of battery.","Engine failure and field selection":"Land ahead, pick a field and use constant aspect.","Fire and ditching":"Fire drills and survival after ditching.","Pre-flight decisions":"PAVE, 'what if?' and diversion planning.","Stress and in-flight decisions":"Defer when unfit and think ahead.","Threat and error management":"Threats, errors, undesired states and distraction."}),t.push.apply(t,[{s:6,topic:"Aerodrome signals, markings and lighting (Skyway Code)",order:40,conf:"weak",status:"draft",summary:"Ground signals sit in the signal square: a white or orange T shows the landing direction, a right-hand arrow means right-hand circuits, and a red square with one yellow diagonal means special precautions. Two yellow diagonals mean landings are prohibited, a white dumb-bell means use runways and taxiways only. Mandatory signs are white on red and you must not pass them without clearance or checking the runway. A red stop bar must never be crossed. APAPI: one white and one red light on the correct slope. Built from the Skyway Code pp.107-113.",sections:[["Signal square",["<b>White or orange T</b>: land and take off parallel to the shaft of the T, towards the cross arm","<b>Right-hand arrow</b>: turns to the right before landing and after take-off. Absent any signal, left-hand circuits are the norm","<b>Red square with one yellow diagonal</b>: special precautions in approaching or landing, for example poor state of the manoeuvring area","<b>Red square with two yellow diagonals</b>: landings prohibited","<b>Horizontal white dumb-bell</b>: land, take off and taxi on runways and taxiways only","<b>Dumb-bell with black stripes</b>: take-offs and landings on runways only, other manoeuvres need not be","<b>Double white cross</b>: gliding operations in progress","<b>Cross on the surface</b>: area unfit for aircraft (white on a runway, yellow on a taxiway)","<b>Black C on yellow</b>: where a pilot reports to ATC or the person in charge. Visiting pilots usually report here"]],["Runway lighting and PAPI",["Typical GA runway: <b>green</b> threshold lights, <b>white</b> edge lights, <b>red</b> end lights","A simple approach lighting system is a single white T-bar to help acquire the runway in poor visibility","<b>PAPI</b> shows whether you are on the correct approach angle, normally between <code>3° and 4°</code>","Most GA aerodromes have a two-light <b>APAPI</b>: on the correct slope one light is white and one is red. Larger aerodromes typically use four lights"]],["Taxiway signs and holding points",["Taxiways are named by a letter such as Alpha. Holding points are usually a letter and number","<b>Mandatory instruction signs</b> are white on red. Do not pass one without permission from ATC (controlled aerodrome), or at an uncontrolled aerodrome without checking the runway and final approach are clear and announcing your intentions","The holding position marking on the ground has <b>two solid yellow lines followed by two dashed lines</b> on the runway side","Guard lights are pairs of alternately flashing yellow lights at the holding point","<b>Stop bars</b> at larger controlled aerodromes are red lights across the taxiway. Never cross a red stop bar. ATC switches it off and the green lights beyond come on after clearance to cross or enter","Hot spots on charts are holding points prone to runway incursions"]],["Marshalling",["A marshaller may direct you to park at larger aerodromes. Details are in Appendix 1 of SERA and CAP 637","Normal stop: arms and wands extended at 90° moved slowly above the head until they cross. Emergency stop: abruptly extend arms and wands to the top of the head, crossing wands","Wands pointing up with arms raised means identify gate"]]],cards:[["What does a white or orange T mean?","Land and take off parallel to the shaft towards the cross arm."],["What does a right-hand arrow in the signal square mean?","Right-hand circuits. Left-hand is the norm otherwise."],["Red square with one yellow diagonal?","Take special precautions in approaching or landing."],["Red square with two yellow diagonals?","Landings are prohibited."],["Horizontal white dumb-bell?","Land, take off and taxi on runways and taxiways only."],["Double white cross?","Gliding operations in progress."],["Cross on the surface, and its colours?","Area unfit for movement: white on runways, yellow on taxiways."],["Black letter C on yellow?","Where to report to ATC or the person in charge."],["GA runway light colours?","Green threshold, white edge, red end."],["Normal approach angle indicated by PAPI?","Between 3° and 4°."],["APAPI on the correct slope?","One white light and one red light."],["Mandatory instruction sign colours?","White letters on a red background."],["Holding position marking?","Two solid yellow lines then two dashed lines on the runway side."],["Can you cross a red stop bar?","Never. Wait for ATC to switch it off."]],quiz:[["A red square with two yellow diagonals in the signal square means:",["Special precautions","Landings prohibited","Right-hand circuit","Gliding"],1,"Two diagonals mean landings are prohibited."],["On the correct slope a two-light APAPI shows:",["Two white","Two red","One white and one red","One green"],2,"One white and one red light indicate the correct approach path."],["Mandatory instruction signs are:",["Black on yellow","White on red","Yellow on black","White on blue"],1,"They mark runway entry points and must not be passed without permission."],["You are approaching a red stop bar. You should:",["Cross carefully","Stop and wait for ATC to switch it off","Call tower and cross","Cross if the runway looks clear"],1,"Never cross a red stop bar."],["A white or orange T shows:",["Gliding","Direction for landing and take-off","Parking","Wind speed"],1,"Aircraft land and take off parallel to the shaft towards the cross arm."],["A double white cross means:",["Landing prohibited","Gliding operations","Unfit area","Right-hand circuit"],1,"Gliding is taking place at the aerodrome."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.107-113","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]},{s:6,topic:"Avoiding collisions (Skyway Code)",order:45,conf:"weak",status:"draft",summary:"Most UK mid-air collisions happen in good VMC at low level and about half near aerodromes. The big sky helps as much as see-and-avoid. Keep your eyes inside the cockpit no more than 25% of the time, scan in short 10° steps pausing at least a second, randomise levels, avoid choke points and final approach tracks, and use lights and electronic conspicuity (ADS-B on 1090 MHz is the preferred UK system). Built from the Skyway Code pp.129-132.",sections:[["The risk",["More than <code>100</code> airproxes are reported to the UK Airprox Board each year","Almost all mid-air collisions are in good VMC at relatively low level and around <b>half</b> happen near aerodromes, many in the circuit","No pilot detects 100% of traffic, especially outside the normal field of view"]],["Mitigations",["Avoid <b>choke points</b> at beacons and VRPs and avoid direct overflight","Avoid gliding sites. Gliders thermal in groups and fly cross-country downwind. Note cable launch heights","Hang glider and paraglider sites may not be on charts and may be activated by NOTAM","Randomise cruising levels, for example 2,200 ft instead of 2,000 ft","Avoid crossing the final approach track of aerodromes outside CAS, even outside the ATZ. Feathered arrows on charts show instrument approach paths, descending at about <code>300 ft per NM</code>","Know joining and circuit procedures. Be clear on position and intentions on the radio"]],["The visual scan",["Keep a clean windscreen","Eyes inside the cockpit <b>no more than 25%</b> of the time","Move your eyes in steps of about <code>10°</code>, pausing at least <code>1 second</code>. The eyes struggle to detect movement while the head is moving","<b>Side-to-side</b> method: start at far left and sweep right pausing in each block, then check the panel","<b>Front-to-side</b> method: start in the centre, move left, swing back to the centre, then go right, then check the panel","Do not fixate inside: look out every few seconds. A passenger can help if briefed"]],["Electronic and visual conspicuity",["<b>Electronic conspicuity (EC)</b> lets aircraft be detected by ATC or other aircraft. The transponder is the most common device","<b>ADS-B</b> broadcasts GPS position (Out) for receivers (In). The CAA preferred national system is ADS-B at <code>1090 MHz</code>. FLARM and PilotAware use other bands to transmit","EC devices are not always interoperable and must not replace a good lookout","Strobes and anti-collision beacons on at all times after entering the runway environment. Landing lights on approaching an aerodrome and in high traffic density","Black aircraft can show up well, while white or broken patterns blend into grey backgrounds"]]],cards:[["How many airproxes are reported each year?","More than 100."],["Where do about half of UK mid-air collisions happen?","Near aerodromes, many in the circuit."],["Maximum time eyes inside the cockpit?","25%."],["Eye movement per scan step?","About 10°."],["Minimum pause for each scan step?","At least one second."],["Name two scanning methods.","Side-to-side and front-to-side."],["Why avoid whole-number cruising levels?","Many pilots use them, so randomising reduces conflict risk."],["Descent along an instrument approach path?","About 300 ft per NM."],["Preferred UK ADS-B frequency?","1090 MHz."],["What is EC?","Electronic conspicuity: technology detecting aircraft position electronically."],["When should strobes and beacons be on?","At all times after entering the runway environment."],["When should landing lights be on?","On approaching an aerodrome and in areas of high traffic density."]],quiz:[["Eyes should be inside the cockpit for no more than:",["10%","25%","50%","75%"],1,"The rest of the time look outside."],["Most mid-air collisions occur:",["In IMC at high level","In good VMC at low level","At night","Above FL100"],1,"Traffic density is higher at low level."],["The CAA preferred UK ADS-B frequency is:",["978 MHz","1090 MHz","121.5 MHz","135.48 MHz"],1,"ADS-B on 1090 MHz is the preferred national system."],["Which statement about gliders is correct?",["They stay overhead their site","They may congregate in thermals and fly cross-country","They have no cable launches","They never use sites without charts"],1,"Gliders do not confine themselves to the site."],["An effective scan moves the eyes in steps of about:",["2°","10°","45°","90°"],1,"10° steps with a pause of at least a second each."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.129-132","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]},{s:5,topic:"Airspace infringements and FMCs (Skyway Code)",order:40,conf:"weak",status:"draft",summary:"An infringement is unauthorised entry into notified airspace: CAS, prohibited or restricted airspace, active danger areas, ATZ, RMZ or TMZ. Prevent them with pre-flight planning, a correctly configured moving map, a margin of 200 ft vertically or 2 NM horizontally, the right altimeter setting, a UK FIS or a Frequency Monitoring Code. To use an FMC, tune the frequency, check volume, select the code with ALT, listen out, and reset to 7000 afterwards. Built from the Skyway Code pp.12, 89, 133-134.",sections:[["What counts as an infringement",["Unauthorised entry into notified airspace: controlled airspace, prohibited or restricted airspace, active danger areas, <b>ATZ</b>, <b>RMZ</b> (radio mandatory zone) and <b>TMZ</b> (transponder mandatory zone)","Can be a serious safety incident and could lead to a mid-air collision","In most infringements pilots were not using a moving map, or not using it correctly"]],["Prevention",["Plan the flight in detail, even 'on the dining room table', with a secondary plan","Use a VFR moving map: keep databases up to date, check airspace and NOTAMs, place it where it does not block the lookout and have a backup (draw the route on a 1:500,000 or 1:250,000 chart)","Stay <code>200 ft</code> below the base of CAS (or over an ATZ, Danger, Prohibited or Restricted area) and <code>2 NM</code> from the edge of notified airspace. Increase the margin in turbulence","Use the right altimeter setting and note where the base of CAS changes between an altitude and a flight level","Get a UK FIS from an ATSU, or use an FMC","Apply TEM: threats include airspace, NOTAM, weather, distraction and equipment failure. Errors include misidentifying features, not holding altitude and inaccurate headings","Recognise distraction and positively shift attention back to flying"]],["Frequency Monitoring Codes (FMC)",["An FMC is selected on the transponder while <b>monitoring</b> an ATC frequency without having established contact","Steps: select the frequency and check volume and reception, select the FMC with <b>ALT (Mode C)</b>, listen for your callsign or position, and stay within range of the ATSU","Return to <code>7000</code> (VFR) or <code>2000</code> (IFR) when you stop monitoring","ATC will endeavour to warn you of a likely infringement but this is not guaranteed and depends on capacity","Each FMC has a published frequency and area (AIP ENR 6-80)"]],["Transponder rules",["If you have a serviceable transponder, SERA requires it selected on with altitude reporting at all times","Exceptions: ATC direction or local procedure, airspace where carriage is not required (turn off only to save power)","Switching it off while infringing increases the likely sanction"]]],cards:[["Which airspace types count for infringement?","CAS, prohibited and restricted airspace, active danger areas, ATZ, RMZ and TMZ."],["What does RMZ stand for?","Radio mandatory zone."],["What does TMZ stand for?","Transponder mandatory zone."],["Common factor in most infringements?","Not using a moving map or using it incorrectly."],["Recommended vertical margin from CAS?","200 ft."],["Recommended horizontal margin from notified airspace?","2 NM."],["What does FMC stand for?","Frequency Monitoring Code."],["What is an FMC used for?","Showing you monitor a frequency without a service."],["Mode to select an FMC with?","ALT (Mode C)."],["What to set after finishing with an FMC?","7000 (VFR) or 2000 (IFR)."],["Does an FMC guarantee a warning?","No, it depends on ATC capacity."],["Is it recommended to use IFR waypoints for VFR?","No."]],quiz:[["A Frequency Monitoring Code is used to:",["Declare an emergency","Show you are listening on a frequency without a service","Request a clearance","Report position"],1,"It improves situational awareness for pilot and ATC."],["The recommended margin from the base of CAS is:",["50 ft","200 ft","500 ft","1,000 ft"],1,"Plus 2 NM horizontally from the edge of notified airspace."],["When leaving the monitored frequency you should:",["Stay on the FMC","Return to 7000 (VFR)","Select 7700","Turn the transponder off"],1,"Reset to the conspicuity code."],["Which is NOT counted as an infringement?",["Entering an ATZ without permission","Entering a TMZ without transponder","Entering Class G airspace below 1,000 ft","Entering an active danger area"],2,"Class G is not notified restricted airspace."],["Most infringements occur when the pilot:",["Used a moving map correctly","Did not use or misused a moving map","Flew IFR","Had a Mode S transponder"],1,"Moving maps help only when configured and used properly."]],src:[["The Skyway Code (CAP 1535 v4, Nov 2023), pp.12, 89, 133-134","https://www.caa.co.uk/our-work/publications/documents/content/cap1535s/"]]},{s:2,topic:"Crosswind component (Skyway Code)",order:40,conf:"weak",status:"draft",summary:"The Skyway Code includes a chart for finding headwind and crosswind components. Resolve the wind speed against the angle between the runway and the wind direction: crosswind = speed x sin of the angle, headwind = speed x cos of the angle. Example from the chart: 20 kt at 60° to the runway gives a 17 kt crosswind and a 10 kt headwind. Know the crosswind limit for your aircraft and confidence level. Built from the Skyway Code p.153 and pre-flight guidance on p.40.",sections:[["Finding the components",["Angle = angle between runway direction and wind direction","<b>Crosswind</b> = wind speed x sin(angle). <b>Headwind</b> = wind speed x cos(angle)","Chart example: <code>20 kt</code> at <code>60°</code> gives a crosswind of about <code>17 kt</code> and a headwind of <code>10 kt</code>","Rules of thumb: 30° gives about half the speed as crosswind, 45° about 70%, 60° about 85%, 90° all of it","If the wind comes from behind the runway direction (more than 90°) the headwind becomes a tailwind component"]],["Using it",["If significant crosswind is expected be confident in the technique, or practise with an instructor","Winds above about 35 kt aloft often mean bumpy conditions and strong headwinds raise fuel needs","Tailwind of 10% of lift-off speed increases take-off and landing distances by about x1.2"]]],cards:[["Crosswind component formula?","Wind speed x sin of the angle to the runway."],["Headwind component formula?","Wind speed x cos of the angle to the runway."],["Crosswind from 20 kt at 60°?","About 17 kt."],["Headwind from 20 kt at 60°?","About 10 kt."],["Crosswind from 20 kt at 90°?","20 kt, the full speed."],["Crosswind from 30 kt at 30°?","About 15 kt."],["Rule of thumb at 30°?","Crosswind is about half the wind speed."],["Rule of thumb at 45°?","Crosswind is about 70% of the wind speed."],["Rule of thumb at 60°?","Crosswind is about 85% of the wind speed."],["Effect of a tailwind of 10% of lift-off speed?","About x1.2 on distance."]],quiz:[["A 30 kt wind is 30° off the runway. The crosswind component is about:",["8 kt","15 kt","26 kt","30 kt"],1,"Crosswind = 30 x sin30° = 15 kt."],["A 20 kt wind straight across the runway gives a crosswind of:",["0 kt","10 kt","17 kt","20 kt"],3,"At 90° the whole wind is crosswind."],["A 20 kt wind 60° off gives a headwind of about:",["10 kt","17 kt","20 kt","0 kt"],0,"Headwind = 20 x cos60° = 10 kt."],["A 20 kt wind 45° off gives a crosswind of about:",["10 kt","14 kt","17 kt","20 kt"],1,"20 x 0.7 = 14 kt."],["Approximate crosswind for a 24 kt wind at 60°:",["12 kt","16 kt","21 kt","24 kt"],2,"24 x 0.85 = about 21 kt."]],src:[["The Skyway Code (CAP 1
