<meta charset="utf-8">
<title>PPL Study Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: left rail on tablets and a bottom tab bar on phones; one bold teal block for today's review, everything else quiet; sessions open in a distraction-free focus mode. */
:root{
  --bg:#f4f1e6;--surface:#fbf9f0;--surface-2:#e6e2d0;--ink:#16284a;--ink-2:#55608a;--line:#cfc9b0;
  --accent:#1f4fa3;--on-accent:#ffffff;--accent-soft:#dbe4f5;
  --warm:#a1286b;--warm-soft:#f3dbe8;
  --good:#2f7d3c;--mid:#b07a0a;--bad:#b3282d;
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1426;--surface:#131d35;--surface-2:#1b2846;--ink:#e8ecf6;--ink-2:#9aa8c8;--line:#27375c;--accent:#7fa8ff;--on-accent:#0a1530;--accent-soft:#1a2c55;--warm:#f08cc0;--warm-soft:#3a1f33;--good:#5fd07a;--mid:#e8b04a;--bad:#ff8080;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1426;--surface:#131d35;--surface-2:#1b2846;--ink:#e8ecf6;--ink-2:#9aa8c8;--line:#27375c;--accent:#7fa8ff;--on-accent:#0a1530;--accent-soft:#1a2c55;--warm:#f08cc0;--warm-soft:#3a1f33;--good:#5fd07a;--mid:#e8b04a;--bad:#ff8080;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
ul{margin:0}
svg{display:block}
code{font-family:var(--f-mono);font-size:.84em;background:var(--surface-2);padding:2px 6px;border-radius:6px;white-space:nowrap}

.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.rail{display:none}
.main{min-width:0;padding-block:22px 120px}
@media(min-width:900px){
  .shell{grid-template-columns:232px minmax(0,1fr);gap:44px}
  .shell.focus{grid-template-columns:minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:28px;position:sticky;top:0;align-self:start;height:100vh;padding-block:32px}
  .main{padding-block:36px 72px}
}
.shell.focus .rail{display:none}
.brand b{display:block;font:700 1.25rem/1.15 var(--f-display);letter-spacing:-.01em}
.brand span{color:var(--ink-2);font-size:.82rem}
.navl{display:grid;gap:4px}
.nv{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:12px;padding:11px 14px;color:var(--ink-2);font-weight:500;text-align:left}
.nv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nv.on{background:var(--accent-soft);color:var(--accent)}
.nv:hover:not(.on){background:var(--surface-2)}

body{background-image:radial-gradient(circle at 15% 8%,transparent 0 60px,color-mix(in srgb,var(--accent) 7%,transparent) 61px 62px,transparent 63px 110px,color-mix(in srgb,var(--accent) 7%,transparent) 111px 112px,transparent 113px 170px,color-mix(in srgb,var(--accent) 7%,transparent) 171px 172px,transparent 173px 240px,color-mix(in srgb,var(--accent) 6%,transparent) 241px 242px,transparent 243px);background-attachment:fixed}
.hero{border-radius:8px}.card,.tile,.sc,.step,.explain div,.acc,.opt,.pick,.rcard,.tick,.fb{border-radius:8px}
.rcard{border-radius:12px}.btn,.rb,.xb,.nv{border-radius:8px}
.brand{display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 10px;align-items:center}
.brand svg{grid-row:1/span 2;width:34px;height:34px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.brand svg.logo{stroke:none;fill:initial;border-radius:8px}
.brand svg .n{fill:var(--warm);stroke:none}
.thm{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:8px 12px;font-weight:500;font-size:.88rem;min-height:40px}
.thm svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.thm:hover{border-color:var(--accent);color:var(--accent)}
.rail .thm{width:100%;justify-content:flex-start}
.mthm{display:inline-flex}
@media(min-width:900px){.mthm{display:none}}
.streak{margin-top:auto;border-radius:14px;background:var(--warm-soft);color:var(--warm);padding:12px 14px;font-weight:600;font-size:.9rem}
.streak small{display:block;font-weight:400;opacity:.85}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar .nv{flex-direction:column;gap:2px;font-size:.74rem;padding:7px 4px;text-align:center;justify-content:center}
@media(min-width:900px){.tabbar{display:none}}
body.focus .tabbar{display:none}

.h1{font:700 1.95rem/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.lede{color:var(--ink-2);margin-top:6px;max-width:60ch}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:600;background:var(--warm-soft);color:var(--warm);white-space:nowrap}
.sec-t{font:700 1.15rem/1.3 var(--f-display);margin:32px 0 12px}
.m{color:var(--ink-2);font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.stack{display:grid;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:12px 20px;font-weight:600;min-height:44px}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.inv{background:var(--on-accent);color:var(--accent)}
.btn.sm{padding:8px 16px;min-height:38px;font-size:.9rem}
.btn.big{width:100%;min-height:54px;font-size:1.05rem}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0}

.hero{background:var(--accent);color:var(--on-accent);border-radius:26px;padding:28px}
.hero .k{font-weight:600;opacity:.85}
.hero .big{font:700 3.4rem/1 var(--f-display);letter-spacing:-.03em;margin-block:6px 4px;font-variant-numeric:tabular-nums}
.hero p{opacity:.9;max-width:46ch}
.hero .btn{margin-top:20px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left}
.tile b{display:block;font:700 1.7rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{color:var(--ink-2);font-size:.82rem}
button.tile:hover{border-color:var(--accent)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:620px){.two{grid-template-columns:minmax(0,1fr)}.hero .big{font-size:2.9rem}}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.card h3{font:700 1.05rem/1.3 var(--f-display)}
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.explain div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.explain b{display:block;font:700 1rem/1.3 var(--f-display);margin-bottom:4px}
.explain p{color:var(--ink-2);font-size:.9rem}

.ring{--s:56px;--p:0;position:relative;flex:none;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p) * 1%),var(--surface-2) 0)}
.ring::before{content:"";position:absolute;inset:calc(var(--s) * .11);border-radius:50%;background:var(--surface)}
.ring span{position:relative;font:600 calc(var(--s) * .22) var(--f-mono)}
.sc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
button.sc:hover{border-color:var(--accent)}
.sc.idle{background:transparent;border-style:dashed;color:var(--ink-2);cursor:default}
.sc h3{font:700 1.02rem/1.3 var(--f-display)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin-top:8px}
.bar i{display:block}
.bar .s{background:var(--good)}.bar .l{background:var(--mid)}

.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;margin-bottom:10px}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.thead{display:flex;align-items:center;gap:20px;margin-bottom:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.84rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:block}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.step.next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.step .n{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:600 .9rem var(--f-mono)}
.step.done .n{background:var(--good);color:var(--surface)}
.step .n svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.step h3{font:700 1.02rem/1.3 var(--f-display)}
.step p{color:var(--ink-2);font-size:.88rem;line-height:1.45}
.step .note{font:500 .78rem var(--f-mono);color:var(--accent);margin-top:2px}
@media(max-width:560px){.step{grid-template-columns:38px minmax(0,1fr)}.step .go{grid-column:2}}

.callout{background:var(--accent-soft);border-radius:16px;padding:16px 18px;margin-block:16px}
.callout h3{font-size:.9rem;font-weight:600;color:var(--accent);margin-bottom:4px}
.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:8px}
.acc-h{display:grid;grid-template-columns:minmax(0,1fr) 16px;gap:2px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px 16px}
.acc-t{grid-column:1;font-weight:600;line-height:1.35}
.acc-s{grid-column:1;color:var(--ink-2);font-size:.88rem;line-height:1.5}
.chev{grid-column:2;grid-row:1/span 2;width:16px;height:16px;color:var(--ink-2);transition:transform .15s;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.acc.open .chev{transform:rotate(180deg)}
.acc-b{padding:12px 18px 16px 38px;border-top:1px solid var(--line)}
.acc-b li{margin-block:6px}
.acc-b li::marker{color:var(--accent)}

.focus-wrap{max-width:720px;margin:0 auto}
.fhead{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.xb{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:500;font-size:.9rem}
.xb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.fprog{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.fprog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.fcount{font:500 .85rem var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.tag{font-size:.82rem;color:var(--ink-2)}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:28px;min-height:280px;display:flex;flex-direction:column;gap:16px}
.rq{font:600 1.5rem/1.35 var(--f-display);text-wrap:balance}
.ra{background:var(--accent-soft);border-radius:16px;padding:16px 18px;font-size:1.05rem}
.prompt{color:var(--ink-2);font-size:.9rem;margin-top:auto}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.rb{display:grid;gap:2px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 4px;font-weight:600}
.rb small{font-weight:400;font-size:.74rem;color:var(--ink-2)}
.rb.a{border-color:var(--bad)}.rb.h{border-color:var(--mid)}.rb.g{border-color:var(--accent)}.rb.e{border-color:var(--good)}
.q{font:600 1.3rem/1.4 var(--f-display);text-wrap:balance}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:8px}
.opt .k{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--surface-2);font:500 .8rem var(--f-mono)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--on-accent)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.ok .k{background:var(--good);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt.bad .k{background:var(--bad);color:var(--surface)}
.conf{margin-top:18px}
.conf p{font-weight:600;margin-bottom:8px}
.conf .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;background:var(--surface-2)}
.fb h3{font-size:1rem;font-weight:600;margin-bottom:6px}
.fb h3.good{color:var(--good)}.fb h3.badt{color:var(--bad)}
.fb p{font-size:.92rem;margin-top:4px}
.fb .cal{color:var(--ink-2)}
.nav{display:flex;justify-content:flex-end;gap:12px;margin-top:16px}
.sum{text-align:left}
.score{font:700 3.6rem/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sum ul{padding-left:20px}.sum li{margin-block:8px}
.sum .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
textarea,.in{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 16px;font:inherit}
textarea{min-height:200px;resize:vertical}
.in{border-radius:12px;font-size:1.1rem}
.cz{font-size:1.2rem;line-height:1.75}
.blank{display:inline-block;min-width:5ch;border-bottom:3px solid var(--accent);margin-inline:3px}
mark.cl{background:var(--accent-soft);color:var(--ink);padding:1px 6px;border-radius:6px;font-weight:600}
.tick{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.tick .bx{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.tick .bx svg{width:14px;height:14px;fill:none;stroke:var(--on-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick.on{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.tick.on .bx{background:var(--good);border-color:var(--good)}
.tick.on .bx svg{opacity:1;stroke:var(--surface)}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:8px}
.pick:hover{border-color:var(--accent)}
.pick b{font-weight:600}
.pick .m{font-family:var(--f-mono);font-size:.78rem}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:10px}
.chart .col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.chart .col i{display:block;width:100%;max-width:26px;border-radius:5px 5px 0 0;background:var(--accent);min-height:3px}
.chart .col i.z{background:var(--surface-2)}
.chart .col .v{font:500 .7rem var(--f-mono);color:var(--ink-2);height:14px}
.chart .col b{font:500 .72rem var(--f-mono);color:var(--ink-2);height:16px}
.tbl{display:grid;gap:0}
.tr{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,.7fr));gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:.92rem;font-variant-numeric:tabular-nums}
.tr:first-child{border-top:0;color:var(--ink-2);font-size:.8rem}

.wxm{display:block;font-family:var(--f-mono);font-size:.88rem;background:var(--surface-2);padding:10px 12px;border-radius:8px;margin-bottom:12px;line-height:1.55;word-break:break-word;font-weight:400}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.ps{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.ps b{display:block;font:700 1.15rem/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.ps span{color:var(--ink-2);font-size:.78rem;line-height:1.3;display:block;margin-top:2px}
.pc{padding:14px 16px}
.pc-h{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;cursor:pointer}
.pc-h:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
div.pc-h{cursor:default}
.pc-t{flex:1;min-width:0}.pc-t h3{font-size:1rem}
.pc-h svg{flex:none;color:var(--ink-2);transition:transform .2s}
.pc-h[aria-expanded="true"] svg{transform:rotate(180deg)}
.tr.pt{grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,.5fr))}
.btn-row{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,.5fr));gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:.92rem;font-variant-numeric:tabular-nums}
.btn-row:hover span:first-child{color:var(--accent)}
.btn-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px;vertical-align:middle}
.dot.s{background:var(--good)}.dot.l{background:var(--mid)}.dot.n{background:var(--surface-2);outline:1px solid var(--line)}
@media(max-width:560px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.btn-row,.tr.pt{font-size:.82rem}}
@media(max-width:560px){.tr{grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,.6fr));font-size:.82rem}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:.9rem;max-width:calc(100vw - 32px)}

.tiles.q{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:620px){.tiles.q{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mn{background:var(--warm-soft);color:var(--warm);border-radius:12px;padding:12px 16px;font-size:.95rem}
.mn b{font-weight:600;margin-right:6px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:4px;justify-content:start;overflow-x:auto;padding-bottom:4px}

  else{q='For VFR flight in the TEMPO period ('+hhz(T.t1)+' to '+hhz(T.t2)+'), is 5 km visibility and a 1,500 ft ceiling met?';var okv=T.tv>=5000,okc=parseInt(T.tc.slice(3),10)*100>=1500;var y='Yes: both limits are met',nv='No: the visibility falls below 5 km',nc='No: the cloud ceiling falls below 1,500 ft',nb='No: both the visibility and the ceiling fall below the limits';c=okv&&okc?y:(!okv&&!okc?nb:(!okc?nc:nv));opts=[y,nv,nc,nb];why='TEMPO visibility '+fthou(T.tv)+' m (limit 5,000 m) and '+T.tc.slice(0,3)+' '+fthou(parseInt(T.tc.slice(3),10)*100)+' ft ('+'limit 1,500 ft). Plan an alternative if a TEMPO period crosses your arrival time.'}

function mkCodeSet(){var out=[],kinds=shuffle(['wind','wind2','vis','cloud','td','qnh','cavok','ceil']),i,k;

   else if(k==='vis'){var vv=pick([800,1500,3000,4500,6000,8000]),o=vv<1000?['FG','fog']:vv<=5000?pick([['BR','mist'],['-RA','light rain'],['DZ','drizzle']]):pick([['-RA','light rain'],['SHRA','rain showers'],['HZ','haze']]);q='Visibility '+fthou(vv)+' m in '+o[1]+'. Which groups?';c=vv+' '+o[0];opts=uniq4(c,[vv/10+' '+o[0],vv+' '+(o[0].charAt(0)==='-'?o[0].slice(1):'-'+o[0]),(vv*10>9999?9999:vv*10)+' '+o[0],'9999 '+o[0],vv+' CAVOK']);why='Visibility is four digits in metres, then the weather code. '+o[0]+' is '+o[1]+', and a minus sign means light intensity.'}
   else if(k==='cloud'){var am=pick(['FEW','SCT','BKN','OVC']),hh=pick([8,12,15,20,25,30,35,40]);q='Cloud '+AMT[am].split(' (')[0]+' at '+fthou(hh*100)+' ft above aerodrome level. Which group?';c=am+p3(hh);opts=uniq4(c,[am+p3(hh*10),am+String(hh*100),pick(['FEW','SCT','BKN','OVC'].filter(function(x){return x!==am}))+p3(hh),am+p3(hh/ (hh>=20?2:1))+'0']);why='Cloud amount (FEW, SCT, BKN, OVC) followed by the height in hundreds of feet in three digits. '+c+' is '+AMT[am]+' at '+fthou(hh*100)+' ft.'}
   else if(k==='td'){var t=ri(-6,22),sp=pick([1,2,3,5,7]),d=t-sp;q='Temperature '+(t<0?'minus '+(-t):t)+'°C and dew point '+(d<0?'minus '+(-d):d)+'°C. Which group?';c=tdS(t)+'/'+tdS(d);opts=uniq4(c,[tdS(d)+'/'+tdS(t),(t<0?p2(-t):'M'+p2(t))+'/'+(d<0?p2(-d):'M'+p2(d)),tdS(t)+'/'+(d<0?p2(-d):tdS(d)),p3(t<0?-t:t)+'/'+p3(d<0?-d:d)]);why='Temperature then dew point, always two digits, and M means minus. '+c+' is '+t+'°C and '+d+'°C.'}
   else if(k==='qnh'){var qq=ri(985,1030);q='QNH '+qq+' hPa. Which group?';c='Q'+qq;opts=uniq4(c,['A'+qq,'QNH'+qq,'Q'+(qq+10),'Q'+String(qq).split('').reverse().join('')]);why='The Q group is the QNH in hPa. An A group is an altimeter setting in inches of mercury and is used in the US.'}
   else if(k==='cavok'){q='Visibility 10 km or more, no cloud below 5,000 ft, no cumulonimbus and no significant weather. Which single code replaces the visibility, weather and cloud groups?';c='CAVOK';opts=['CAVOK','NSC','SKC','CLR'];why='CAVOK stands for Cloud And Visibility OK. NSC means no significant cloud but does not include the visibility and weather conditions.'}

function startRadio(m){
  if(m==='wxm'){startRq(m,mkMetarSet());return}
  if(m==='wxt'){startRq(m,mkTafSet());return}
  if(m==='wxc'){startRq(m,mkCodeSet());return}
  var r;
  if(m==='alpha')startRq(m,mkAlpha());
  else if(m==='spell'){r=[];for(var i=0;i<5;i++)r.push(mkSpell());startRb(m,r)}
  else if(m==='num'){r=[];for(var j=0;j<8;j++)r.push(mkNum());startRb(m,r)}
  else if(m==='prow')startRq(m,mkProw());
  else if(m==='rbk')startRq(m,mkRbk());
  else if(m==='call')startRb(m,shuffle(RB.calls).slice(0,5).map(function(c){return{ctx:c.ctx,ans:c.ans,bank:shuffle(c.ans.concat(c.dis)),why:c.why}}));
  else if(m==='emg')startRb(m,shuffle(RB.emerg).map(function(c){return{ctx:c.ctx,ans:c.ans,bank:shuffle(c.ans.concat(c.dis)),why:c.why}}));
  else if(m==='dist')startRq(m,mkDist());
  else if(m==='facts')startRq(m,shuffle(RB.facts).slice(0,10).map(function(f){return{q:f[0],opts:f[1],a:f[2],why:f[3]}}));
  else if(m==='scA'||m==='scB'){var sc=RB.scen.filter(function(x){return'sc'+x.id===m})[0];startRq(m,sc.steps.map(function(x){return{ctx:x.ctx,atc:x.atc,q:x.q,opts:x.opts,a:x.a,why:x.why}}),sc.title)}}

    var c=s.q[s.i],n=NOTES[c.n],t=getc(c.key);

    var act=s.shown?'<div class="rate">'+[['a','Again','Today',0],['h','Hard',ivl(INT[nextBox(t.b,1)]),1],['g','Good',ivl(INT[nextBox(t.b,2)]),2],['e','Easy',ivl(INT[nextBox(t.b,3)]),3]].map(function(x){return'<button class="rb '+x[0]+'" data-a="rate" data-r="'+x[3]+'">'+x[1]+'<small>'+(s.noSched?'':x[2])+'</small></button>'}).join('')+'</div>':'<div style="margin-top:14px"><button class="btn big" data-a="show">Show answer</button></div>';
    return w(fhead(s.i,s.q.length)+body+act)}
  if(s.type==='quiz'){
    if(s.done){
      var ok=s.res.filter(function(r){return r.ok}).length,cw=s.res.filter(function(r){return!r.ok&&r.conf===2}),gr=s.res.filter(function(r){return r.ok&&r.conf===0}),miss=s.res.filter(function(r){return!r.ok});

    var q=s.qs[s.i],rev=s.conf!==null,right=rev&&s.sel===q.a;
    var h=fhead(s.i,s.qs.length)+(s.mode==='pretest'?'<p class="tag" style="margin-bottom:10px">Pre-test. You have not read this yet, so guess freely.</p>':'<p class="tag" style="margin-bottom:10px">'+NOTES[q.n].topic+'</p>')+'<div class="card"><p class="q">'+esc(q.q)+'</p>';
    q.o.forEach(function(o,i){var cl='opt';if(rev){if(i===q.a)cl+=' ok';else if(i===s.sel)cl+=' bad'}else if(i===s.sel)cl+=' sel';h+='<button class="'+cl+'" data-a="opt" data-i="'+i+'"><span class="k">'+'ABCD'.charAt(i)+'</span><span>'+esc(o)+'</span></button>'});
    if(s.sel!==null&&!rev)h+='<div class="conf"><p>How sure are you?</p><div class="three"><button class="btn alt" data-a="conf" data-c="0">Guessing</button><button class="btn alt" data-a="conf" data-c="1">Fairly sure</button><button class="btn alt" data-a="conf" data-c="2">Certain</button></div></div>';
    if(rev){var cal=right?(s.conf===0?'That was a guess, so keep this one on your list.':s.conf===2?'Certain and correct. This one is solid.':''):(s.conf===2?'You were certain, which makes this the most useful mistake to learn from.':'');
      h+='<div class="fb"><h3 class="'+(right?'good':'badt')+'">'+(right?'Correct':'Incorrect')+'</h3>'+(right?'':'<p><b>You chose:</b> '+esc(q.o[s.sel])+'</p><p><b>Correct answer:</b> '+esc(q.o[q.a])+'</p>')+'<p><b>Why:</b> '+esc(q.why)+'</p>'+(cal?'<p class="cal">'+cal+'</p>':'')+'</div><div class="nav"><button class="btn" data-a="nq">'+(s.i===s.qs.length-1?'See results':'Next question')+'</button></div>'}

  if(s.type==='blurtpick'){

    if(!s.cmp)return w('<div class="fhead"><button class="xb" data-a="end">'+IC.x+'<span>End</span></button></div><p class="tag">'+n3.topic+'</p><h1 class="h1" style="margin:4px 0 14px">'+sec[0]+'</h1><p class="lede" style="margin:0 0 12px">Write everything you can remember about this. Short phrases are fine. Do not look at your notes.</p><textarea id="blurt-text" placeholder="Start writing...">'+esc(s.text)+'</textarea><div class="nav"><button class="btn" data-a="compare">Compare with my notes</button></div>');
    var cnt=Object.keys(s.ticks).filter(function(k){return s.ticks[k]}).length;
    return w('<div class="fhead"><button class="xb" data-a="end">'+IC.x+'<span>End</span></button></div><h1 class="h1" style="margin-bottom:12px">'+sec[0]+'</h1>'+(s.text.trim()?'<div class="card" style="margin-bottom:16px"><p class="m">What you wrote</p><p style="white-space:pre-wrap;margin-top:4px">'+esc(s.text)+'</p></div>':'')+'<p class="lede" style="margin:0 0 4px">Tick each point you recalled.</p>'+sec[1].map(function(b,i){return'<button class="tick'+(s.ticks[i]?' on':'')+'" data-a="tick" data-i="'+i+'"><span class="bx"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>'+b+'</span></button>'}).join('')+'<div class="nav"><span class="m" style="align-self:center">'+cnt+' of '+sec[1].length+' recalled</span><button class="btn" data-a="bsave">Save result</button></div>')}
  if(s.type==='cloze'){

    return w(hh+'</div>')}
  return''}

/* ---------- session starters ---------- */
function startReviewSession(cards,title,src,noSched){ses={type:'review',q:cards,i:0,shown:false,tally:[0,0,0,0],re:{},title:title,src:src,noSched:!!noSched,done:false};render()}
function mkQ(n,item){var idx=shuffle(item[1].map(function(_,i){return i}));return{n:n.id,key:n.topic+'|'+item[0],q:item[0],o:idx.map(function(i){return item[1][i]}),a:idx.indexOf(item[2]),why:item[3]}}
function startQuiz(qs,mode,topicId,sub){if(!qs.length){toast('No questions available');return}ses={type:'quiz',qs:qs,i:0,sel:null,conf:null,res:[],mode:mode,topic:topicId,sub:sub,done:false,logged:false};render()}
function topicQuiz(n,count,mode){startQuiz(shuffle(n.quiz).slice(0,count).map(function(q){return mkQ(n,q)}),mode,n.id)}
function mistakeQuiz(){var out=[];NOTES.forEach(function(n){n.quiz.forEach(function(q){if(S.miss[n.topic+'|'+q[0]])out.push(mkQ(n,q))})});startQuiz(shuffle(out).slice(0,12),'mistakes',null)}
function logQuiz(){
  if(!ses||ses.logged||!ses.res.length||ses.mode==='mock')return;
  var by={};ses.res.forEach(function(r){var t=NOTES[r.n].topic;by[t]=by[t]||{s:0,n:0};by[t].n++;if(r.ok)by[t].s++});
  Object.keys(by).forEach(function(t){if(ses.mode==='pretest')stepsOf(t).pre={s:by[t].s,n:by[t].n,d:today()};else(S.quiz[t]=S.quiz[t]||[]).push({d:today(),s:by[t].s,n:by[t].n,m:ses.mode})});
  ses.logged=true;save()}
function rateCard(c,r){
  if(!ses.noSched){var x=S.cards[c.key]||(S.cards[c.key]={b:0,d:0,n:0});if(x.b===0){if(S.newd.d!==today())S.newd={d:today(),n:0};S.newd.n++}if(r===0&&x.b>0)x.l=(x.l||0)+1;var ob=x.b;x.b=nextBox(x.b,r);x.d=today()+INT[x.b];x.n++;if(ob<3&&x.b>=3)S.sec[today()]=(S.sec[today()]||0)+1}
  S.days[today()]=(S.days[today()]||0)+1;save()}
function exitSession(){
  stopTimer();try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}if(ses&&ses.type==='quiz')logQuiz();
  var back=ses&&ses.topic!==null&&ses.topic!==undefined&&ses.topic>=0?'topic':null;
  ses=null;if(!back&&['subject','today','topic','practice','progress','radio','radioref','labs','sheet'].indexOf(ui.view)<0)ui.view='today';render();try{window.scrollTo(0,0)}catch(e){}}

/* ---------- actions ---------- */
function act(a,d){
  var s=ses;
  switch(a){
   case'nav':go(d.v,{});return;
   case'pexp':ui.pexp=ui.pexp||{};ui.pexp[d.i]=!ui.pexp[d.i];render();return;
   case'theme':setTheme();return;
   case'rstart':startRadio(d.m);return;
   case'lab':startLab(d.id);return;
   case'lx':labOn(d);return;
   case'ragain':if(s&&s.again)s.again();return;
   case'rlisten':ui.listen=!ui.listen;render();return;
   case'hear':speakText(s.items[s.i].atc||'');return;
   case'peek':s.peek=true;render();return;
   case'ropt':{if(s.sel!==null)return;var it=s.items[s.i];s.sel=+d.i;var ok=s.sel===it.a;s.res.push({q:it.q,atc:it.atc,ok:ok,chosen:it.opts[s.sel],ans:it.opts[it.a],why:it.why});var st=S.radio[s.mode]||(S.radio[s.mode]={s:0,n:0});st.n++;if(ok)st.s++;S.days[today()]=(S.days[today()]||0)+1;save();render();return}
   case'rnext':if(s.i>=s.items.length-1)s.done=true;else{s.i++;s.sel=null;s.peek=false;var nx=s.items[s.i];if(nx.atc&&s.hide&&ttsOk())speakText(nx.atc)}render();return;
   case'rput':{var p=+d.i;if(s.built.indexOf(p)<0)s.built.push(p);render();return}
   case'runput':{var q2=+d.i;s.built=s.built.filter(function(b){return b!==q2});render();return}
   case'rclear':s.built=[];render();return;
   case'rcheck':{var it2=s.items[s.i],got=s.built.map(function(b){return it2.bank[b]}),ok2=got.length===it2.ans.length&&got.every(function(t,i){return t===it2.ans[i]});s.checked=true;s.ok=ok2;s.res.push({ctx:it2.ctx,ok:ok2,built:got.join(' '),ans:it2.ans.join(' ')});var st2=S.radio[s.mode]||(S.radio[s.mode]={s:0,n:0});st2.n++;if(ok2)st2.s++;S.days[today()]=(S.days[today()]||0)+1;save();render();return}
   case'rbnext':if(s.i>=s.items.length-1)s.done=true;else{s.i++;s.built=[];s.checked=false;s.ok=false}render();return;
   case'mock':startMock(d.i);return;
   case'mixall':{var pl=[];NOTES.forEach(function(n){n.quiz.forEach(function(q){pl.push(mkQ(n,q))})});startQuiz(shuffle(pl).slice(0,10),'mix',null,null);return}
   case'tricky':{var tc=trickyCards();if(!tc.length){toast('No tricky cards yet');return}startReviewSession(shuffle(tc).slice(0,20),'Tricky cards','tricky');return}
   case'calc':startCalc(d.k);s=ses;if(s)s.kind=d.k;return;
   case'calccheck':{var ci=$('calc-in');s.typed=ci?ci.value:'';var it=s.items[s.i];s.ok=numOk(s.typed,it);s.checked=true;s.res.push({ok:s.ok,q:it.q,work:it.work+' (answer '+it.ans+' '+it.unit+')'});var cs=S.calc[it.t]||(S.calc[it.t]={s:0,n:0});cs.n++;if(s.ok)cs.s++;S.days[today()]=(S.days[today()]||0)+1;save();render();return}
   case'calcnext':if(s.i>=s.items.length-1)s.done=true;else{s.i++;s.typed='';s.checked=false}render();return;
   case'mnext':if(s.i<s.qs.length-1){s.i++;s.finArm=false;render();window.scrollTo(0,0)}return;
   case'mprev':if(s.i>0){s.i--;s.finArm=false;render();window.scrollTo(0,0)}return;

   case'mfb':S.mockFb=d.v;save();render();return;

   case'plansave':{var pi=$('plan-date'),pv=pi?pi.value:'';if(!pv){toast('Pick a date first');return}var dd=Math.floor(Date.parse(pv)/864e5);if(isNaN(dd)||dd<=today()){toast('Choose a date in the future');return}S.plan=dd;S.pq={d:0,v:10};save();toast('Exam date saved');render();return}
   case'planclear':S.plan=0;S.pq={d:0,v:10};save();render();return;
   case'sub':go('subject',{sub:+d.i});return;
   case'sheet':go('sheet',{sub:+d.i});return;
   case'print':try{window.print()}catch(e){toast('Printing is not available here. Use the browser menu.')}return;
   case'topic':go('topic',{topic:+d.i,sub:NOTES[+d.i].s});return;
   case'mix':{var si=+d.i,pool=[];NOTES.forEach(function(n){if(n.s===si)n.quiz.forEach(function(q){pool.push(mkQ(n,q))})});startQuiz(shuffle(pool).slice(0,12),'mix',null,si);return}
   case'review':{var rv=buildReview();if(!rv.all.length){toast('Nothing due today');return}startReviewSession(rv.all,'Daily review','daily');return}
   case'more':{var r2=buildReview(10);startReviewSession(r2.all,'Daily review','daily');return}
   case'fix':mistakeQuiz();return;
   case'step':{var n=NOTES[ui.topic];
     if(d.k==='pre')topicQuiz(n,4,'pretest');
     else if(d.k==='read')go('read',{});

     s.res.push({n:q.n,q:q.q,ok:ok,conf:s.conf,ans:q.o[q.a]});

     S.days[today()]=(S.days[today()]||0)+1;save();render();return}

   case'blurt':ses={type:'blurtpick',n:ui.topic};render();return;

   case'cloze':{var nid=ui.topic,pool2=clozePool(NOTES[nid]);var items=shuffle(pool2).slice(0,10).map(function(it){return{si:it.si,bi:it.bi,html:it.html,sp:it.sp[Math.floor(Math.random()*it.sp.length)]}});ses={type:'cloze',n:nid,items:items,i:0,typed:'',checked:false,ok:false,hint:false,res:[],done:false,topic:nid};render();return}
   case'hint':{var inp=$('cl-in');s.typed=inp?inp.value:'';s.hint=true;render();var i2=$('cl-in');if(i2)i2.focus();return}
   case'clcheck':{var i3=$('cl-in');s.typed=i3?i3.value:'';s.ok=sameAns(s.typed,s.items[s.i].sp.ans);s.checked=true;s.res.push({ok:s.ok,html:s.items[s.i].html.replace(s.items[s.i].sp.full,'<mark class="cl">'+s.items[s.i].sp.ans+'</mark>')});S.days[today()]=(S.days[today()]||0)+1;save();render();return}
   case'clright':s.ok=true;s.res[s.res.length-1].ok=true;render();return;
   case'clnext':{if(s.i>=s.items.length-1){s.done=true;var t=NOTES[s.n].topic,z=S.cloze[t]||(S.cloze[t]={s:0,n:0});z.n+=s.res.length;z.s+=s.res.filter(function(r){return r.ok}).length;save()}else{s.i++;s.typed='';s.checked=false;s.hint=false}render();return}
  }
}
function backupSave(){try{save();var d={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^ppl-/.test(k))d[k]=localStorage.getItem(k)}
  var txt=JSON.stringify({app:'ppl-study-hub',saved:new Date().toISOString(),data:d}),blob=new Blob([txt],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='ppl-hub-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);toast('Backup saved to your downloads')}catch(e){toast('Could not save the backup')}}
function backupLoad(f){var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j||j.app!=='ppl-study-hub'||!j.data)throw 0;var n=0;for(var k in j.data)if(/^ppl-/.test(k)&&typeof j.data[k]==='string'){localStorage.setItem(k,j.data[k]);n++}
  if(!n)throw 0;toast('Backup restored, reloading…');setTimeout(function(){location.reload()},900)}catch(e){toast('That file is not a PPL Study Hub backup')}};r.readAsText(f)}
document.addEventListener('change',function(e){if(e.target&&e.target.id==='restore-file'&&e.target.files&&e.target.files[0]){backupLoad(e.target.files[0]);e.target.value=''}});
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset)});
document.addEventListener('input',function(e){var t=e.target;if(t&&t.dataset&&t.dataset.a==='lxr')labOn({k:'r',v:t.value,f:t.dataset.f})});
document.addEventListener('keydown',function(e){
  if(!ses)return;
  if(e.target&&e.target.id==='cl-in'&&e.key==='Enter'){e.preventDefault();act('clcheck',{});return}
  if(e.target&&e.target.id==='calc-in'&&e.key==='Enter'){e.preventDefault();act('calccheck',{});return}
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(ses.type==='review'&&!ses.done){
    if(!ses.shown&&(e.key===' '||e.key==='Enter')){e.preventDefault();act('show',{})}
    else if(ses.shown&&'1234'.indexOf(e.key)>=0&&e.key){act('rate',{r:String(+e.key-1)})}}
});
render();
})();
